openapi: 3.0.3
info:
  title: Zitadel API (Cheladb vendor subset)
  description: >
    Pinned subset of Zitadel HTTP APIs for Studio codegen.
    Source pin: ghcr.io/zitadel/zitadel:v2.71.19
    Regenerate via `pnpm --filter @cheladb/zitadel generate`.
  version: 2.71.19
  license:
    name: Apache-2.0
servers:
  - url: http://localhost:8080
    description: Local Compose Zitadel
paths:
  /oidc/v1/userinfo:
    get:
      operationId: getUserInfo
      summary: OIDC UserInfo
      tags: [OIDC]
      security:
        - bearerAuth: []
      responses:
        "200":
          description: UserInfo claims
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/UserInfo"
        "401":
          description: Unauthorized
  /auth/v1/users/me:
    get:
      operationId: getMyUser
      summary: Get the authenticated user profile (Auth API)
      tags: [Auth]
      security:
        - bearerAuth: []
      responses:
        "200":
          description: Current user
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/UserResponse"
  /management/v1/orgs/me:
    get:
      operationId: getMyOrg
      summary: Get the organization of the authenticated user
      tags: [Management]
      security:
        - bearerAuth: []
      responses:
        "200":
          description: Current organization
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/OrgResponse"
  /v2/users/{userId}:
    get:
      operationId: getUserById
      summary: Get a user by ID (User Service v2)
      tags: [Users]
      security:
        - bearerAuth: []
      parameters:
        - name: userId
          in: path
          required: true
          schema:
            type: string
      responses:
        "200":
          description: User
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/UserV2Response"
components:
  securitySchemes:
    bearerAuth:
      type: http
      scheme: bearer
      bearerFormat: JWT
  schemas:
    UserInfo:
      type: object
      additionalProperties: true
      properties:
        sub:
          type: string
        name:
          type: string
        email:
          type: string
        email_verified:
          type: boolean
        preferred_username:
          type: string
    UserResponse:
      type: object
      properties:
        user:
          $ref: "#/components/schemas/User"
    User:
      type: object
      properties:
        id:
          type: string
        userName:
          type: string
        state:
          type: string
        human:
          type: object
          additionalProperties: true
    OrgResponse:
      type: object
      properties:
        org:
          $ref: "#/components/schemas/Org"
    Org:
      type: object
      properties:
        id:
          type: string
        name:
          type: string
        primaryDomain:
          type: string
    UserV2Response:
      type: object
      properties:
        user:
          type: object
          additionalProperties: true
