[package]
name = "orchestrator"
version.workspace = true
edition.workspace = true
license.workspace = true
description = "Cheladb control-plane orchestrator API"

[lib]
name = "orchestrator"
path = "src/lib.rs"

[[bin]]
name = "orchestrator"
path = "src/main.rs"

[dependencies]
cheladb-auth = { workspace = true }
cheladb-metadata = { workspace = true, features = ["openapi"] }
cheladb-nats = { workspace = true }
cheladb-query = { workspace = true }
cheladb-routes = { workspace = true }
cheladb-secrets = { workspace = true }
cheladb-zitadel = { workspace = true }
async-nats = { workspace = true }
cheladb-types = { workspace = true, features = ["axum", "openapi"] }
axum = { workspace = true }
tokio = { workspace = true }
tower-http = { workspace = true }
tracing = { workspace = true }
tracing-subscriber = { workspace = true }
serde = { workspace = true }
serde_json = { workspace = true }
uuid = { workspace = true }
dotenvy = { workspace = true }
anyhow = { workspace = true }
base64 = { workspace = true }
chrono = { workspace = true }
cheladb-neon = { workspace = true, features = ["metadata"] }
getrandom = { workspace = true }
hex = { workspace = true }
moka = { workspace = true }
tokio-postgres = { workspace = true }
pg_query = { workspace = true }
tokio-util = { workspace = true }
futures-util = { workspace = true }
bytes = { workspace = true }
reqwest = { workspace = true }
urlencoding = { workspace = true }
sha2 = { workspace = true }
sqlx = { workspace = true }
subtle = { workspace = true }
hmac = { workspace = true }
utoipa = { workspace = true }
utoipa-axum = { workspace = true }

[dev-dependencies]
async-trait = { workspace = true }
cheladb-zitadel = { workspace = true, features = ["mock"] }
cheladb-auth = { workspace = true, features = ["test-support"] }
hmac = { workspace = true }
jsonwebtoken = { workspace = true }
tempfile = { workspace = true }
