[package]
name = "orchestrator"
version.workspace = true
edition.workspace = true
license.workspace = true
description = "Cheladb control-plane orchestrator API"

[lib]
name = "orchestrator"
path = "src/lib.rs"

[[bin]]
name = "orchestrator"
path = "src/main.rs"

[dependencies]
cheladb-auth = { workspace = true }
cheladb-metadata = { workspace = true }
cheladb-nats = { workspace = true }
cheladb-routes = { workspace = true }
cheladb-secrets = { workspace = true }
async-nats = { workspace = true }
cheladb-types = { workspace = true }
axum = { workspace = true }
tokio = { workspace = true }
tower-http = { workspace = true }
tracing = { workspace = true }
tracing-subscriber = { workspace = true }
serde = { workspace = true }
serde_json = { workspace = true }
uuid = { workspace = true }
dotenvy = { workspace = true }
anyhow = { workspace = true }
chrono = { workspace = true }
cheladb-neon = { workspace = true, features = ["metadata"] }
hex = { workspace = true }
reqwest = { workspace = true }
sha2 = { workspace = true }
subtle = { workspace = true }

[dev-dependencies]
cheladb-auth = { workspace = true, features = ["test-support"] }
jsonwebtoken = { workspace = true }
tempfile = { workspace = true }
