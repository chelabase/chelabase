[package]
name = "orchestrator"
version.workspace = true
edition.workspace = true
license.workspace = true
description = "Chelabase control-plane orchestrator API"

[lib]
name = "orchestrator"
path = "src/lib.rs"

[[bin]]
name = "orchestrator"
path = "src/main.rs"

[dependencies]
chelabase-auth = { workspace = true }
chelabase-metadata = { workspace = true, features = ["openapi"] }
chelabase-nats = { workspace = true }
chelabase-query = { workspace = true }
chelabase-routes = { workspace = true }
chelabase-schema = { workspace = true }
chelabase-secrets = { workspace = true }
chelabase-zitadel = { workspace = true }
async-nats = { workspace = true }
chelabase-types = { workspace = true, features = ["axum", "openapi"] }
axum = { workspace = true }
tokio = { workspace = true }
tower-http = { workspace = true }
tracing = { workspace = true }
tracing-subscriber = { workspace = true }
serde = { workspace = true }
serde_json = { workspace = true }
uuid = { workspace = true }
dotenvy = { workspace = true }
anyhow = { workspace = true }
base64 = { workspace = true }
chrono = { workspace = true }
chelabase-neon = { workspace = true, features = ["metadata"] }
getrandom = { workspace = true }
hex = { workspace = true }
moka = { workspace = true }
tokio-postgres = { workspace = true }
pg_query = { workspace = true }
tokio-util = { workspace = true }
futures-util = { workspace = true }
bytes = { workspace = true }
reqwest = { workspace = true }
urlencoding = { workspace = true }
sha2 = { workspace = true }
deadpool-postgres = { workspace = true }
subtle = { workspace = true }
hmac = { workspace = true }
utoipa = { workspace = true }
utoipa-axum = { workspace = true }

[dev-dependencies]
# Live tests' own admin sessions.
sqlx = { workspace = true }
async-trait = { workspace = true }
chelabase-zitadel = { workspace = true, features = ["mock"] }
chelabase-auth = { workspace = true, features = ["test-support"] }
hmac = { workspace = true }
jsonwebtoken = { workspace = true }
tempfile = { workspace = true }
# The member API's grant invariant (T7).
proptest = { workspace = true }
# The role-rule agreement test (I2): the worker's reconciler rule against this crate's.
worker = { path = "../worker" }
