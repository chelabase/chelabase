[package]
name = "chelabase-functions"
version.workspace = true
edition.workspace = true
license.workspace = true
description = "Chelabase edge functions: invokes a branch's functions in the runtime and serves their bundles"

[lib]
name = "functions"
path = "src/lib.rs"

[[bin]]
name = "functions"
path = "src/main.rs"

[dependencies]
anyhow = { workspace = true }
async-trait = { workspace = true }
axum = { workspace = true }
base64 = { workspace = true }
bytes = { workspace = true }
chelabase-auth = { workspace = true }
chelabase-http = { workspace = true }
chelabase-metadata = { workspace = true }
chelabase-nats = { workspace = true }
# m13b: the database-event dispatcher's connections to branch computes (as rest's).
chelabase-pgsession = { workspace = true }
chelabase-query = { workspace = true }
# The dispatcher's login and NOTIFY channel, shared with the worker's install (already in the
# tree through chelabase-pgsession).
chelabase-schema = { workspace = true }
chelabase-secrets = { workspace = true }
# The bundle store (bucket chelabase-functions, the `functions` S3 identity).
chelabase-storage = { workspace = true }
chelabase-types = { workspace = true }
dotenvy = { workspace = true }
futures-util = { workspace = true }
hex = { workspace = true }
# m9: services' request signatures (the storage webhooks' scheme).
hmac = { workspace = true }
moka = { workspace = true }
# The runtime proxy streams both bodies.
reqwest = { workspace = true, features = ["stream"] }
serde = { workspace = true }
serde_json = { workspace = true }
sha2 = { workspace = true }
# The internal listener's bearers, compared in constant time.
subtle = { workspace = true }
thiserror = { workspace = true }
tokio = { workspace = true }
tokio-postgres = { workspace = true }
tracing = { workspace = true }
tracing-subscriber = { workspace = true }
uuid = { workspace = true }
# Decrypted secrets and the env header are wiped when a cached resolution drops.
zeroize = { workspace = true }

[dev-dependencies]
# ResolvedFunction's compatibility date, in the metadata fake.
chrono = { workspace = true }
# The dispatcher model test (m13b, moved from the worker).
proptest = { workspace = true }
chelabase-auth = { workspace = true, features = ["keygen"] }
# The e2e suite cleans up the rows it wrote directly to the metadata database.
sqlx = { workspace = true }
