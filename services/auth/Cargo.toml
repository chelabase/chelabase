[package]
name = "auth"
version.workspace = true
edition.workspace = true
license.workspace = true
description = "Cheladb's login backend: holds Zitadel's login-client token for Studio's sign-in pages"

[lib]
name = "auth"
path = "src/lib.rs"

[[bin]]
name = "auth"
path = "src/main.rs"

[dependencies]
anyhow = { workspace = true }
async-trait = { workspace = true }
axum = { workspace = true }
cheladb-auth = { workspace = true }
cheladb-query = { workspace = true }
cheladb-routes = { workspace = true }
cheladb-secrets = { workspace = true }
cheladb-types = { workspace = true, features = ["axum", "openapi"] }
cheladb-zitadel = { workspace = true }
chrono = { workspace = true }
dotenvy = { workspace = true }
hex = { workspace = true }
http = { workspace = true }
moka = { workspace = true }
reqwest = { workspace = true }
serde = { workspace = true }
serde_json = { workspace = true }
sha2 = { workspace = true }
thiserror = { workspace = true }
tokio = { workspace = true }
tracing = { workspace = true }
tracing-subscriber = { workspace = true }
utoipa = { workspace = true }
utoipa-axum = { workspace = true }
uuid = { workspace = true }

[dev-dependencies]
cheladb-auth = { workspace = true, features = ["keygen"] }
tempfile = { workspace = true }
cheladb-zitadel = { workspace = true, features = ["mock"] }
