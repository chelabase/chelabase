[package]
name = "rest"
version.workspace = true
edition.workspace = true
license.workspace = true
description = "Chelabase data API engine: JSON query language to SQL over a branch's compute"

[lib]
name = "rest"
path = "src/lib.rs"

[[bin]]
name = "rest"
path = "src/main.rs"

[dependencies]
anyhow = { workspace = true }
axum = { workspace = true }
chelabase-auth = { workspace = true }
chelabase-query = { workspace = true, features = ["openapi"] }
# The full-cell read's shared code (`cell`, `catalog`, P40).
chelabase-schema = { workspace = true }
chelabase-types = { workspace = true, features = ["openapi", "axum"] }
deadpool-postgres = { workspace = true }
dotenvy = { workspace = true }
moka = { workspace = true }
reqwest = { workspace = true }
serde = { workspace = true }
# Keeps a bare JSON number's digits (a 30-digit numeric binds exactly). It changes
# `serde_json::Number` for every crate built with rest; the workspace has no untagged or
# flattened serde types it would break.
serde_json = { workspace = true, features = ["arbitrary_precision"] }
subtle = { workspace = true }
thiserror = { workspace = true }
tokio = { workspace = true }
tokio-postgres = { workspace = true }
# The pools' TLS to computes, verified against the platform CA (U15).
tokio-postgres-rustls-improved = { workspace = true }
tracing = { workspace = true }
tracing-subscriber = { workspace = true }
utoipa = { workspace = true }
utoipa-axum = { workspace = true }
uuid = { workspace = true }

[dev-dependencies]
chelabase-auth = { workspace = true, features = ["keygen"] }
chelabase-metadata = { workspace = true }
chelabase-nats = { workspace = true }
# The OpenAPI document's registry test.
chelabase-routes = { workspace = true }
chelabase-neon = { workspace = true }
# U15 (f5b) tests: the fake compute's TLS server (`crates/chelabase-query/tests/common/tls_pg.rs`).
rustls = { workspace = true }
chelabase-secrets = { workspace = true }
chrono = { workspace = true }
# The live tests' own admin sessions (the service itself runs on tokio-postgres).
sqlx = { workspace = true }
worker = { path = "../worker" }
