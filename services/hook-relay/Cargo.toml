[package]
name = "cheladb-hook-relay"
version.workspace = true
edition.workspace = true
license.workspace = true
description = "Forwards the shared storage controller's compute-notification hooks to the worktree slot that knows the tenant"

[lib]
name = "cheladb_hook_relay"
path = "src/lib.rs"

[[bin]]
name = "cheladb-hook-relay"
path = "src/main.rs"

[dependencies]
axum = { workspace = true }
tokio = { workspace = true }
reqwest = { workspace = true }
tracing = { workspace = true }
tracing-subscriber = { workspace = true }
anyhow = { workspace = true }
clap = { workspace = true }

[dev-dependencies]
tempfile = { workspace = true }
