[package]
name = "worker"
version.workspace = true
edition.workspace = true
license.workspace = true
description = "Cheladb provisioning / reconciliation worker"

[lib]
name = "worker"
path = "src/lib.rs"

[[bin]]
name = "worker"
path = "src/main.rs"

[dependencies]
cheladb-metadata = { workspace = true }
cheladb-neon = { workspace = true, features = ["metadata"] }
cheladb-nats = { workspace = true }
cheladb-types = { workspace = true }
axum = { workspace = true }
tokio = { workspace = true }
tracing = { workspace = true }
tracing-subscriber = { workspace = true }
serde_json = { workspace = true }
dotenvy = { workspace = true }
anyhow = { workspace = true }
futures-util = { workspace = true }
rand = { workspace = true }
cheladb-secrets = { workspace = true }
async-nats = { workspace = true }
reqwest = { workspace = true }
sha2 = { workspace = true }
hex = { workspace = true }
chrono = { workspace = true }

[dev-dependencies]
tempfile = { workspace = true }
sqlx = { workspace = true }
base64 = { workspace = true }
cheladb-neon = { workspace = true, features = ["fake"] }
tokio = { workspace = true, features = ["test-util"] }
