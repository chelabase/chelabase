[package]
name = "worker"
version.workspace = true
edition.workspace = true
license.workspace = true
description = "Chelabase provisioning / reconciliation worker"

[lib]
name = "worker"
path = "src/lib.rs"

[[bin]]
name = "worker"
path = "src/main.rs"

[features]
# Test-only entry points for the integration tests (`Worker::create_personal_login`, T6-M4).
test-support = []

[dependencies]
chelabase-http = { workspace = true }
chelabase-metadata = { workspace = true }
chelabase-neon = { workspace = true, features = ["metadata"] }
chelabase-nats = { workspace = true }
chelabase-schema = { workspace = true }
chelabase-types = { workspace = true }
chelabase-identity = { workspace = true }
axum = { workspace = true }
tokio = { workspace = true }
tracing = { workspace = true }
tracing-subscriber = { workspace = true }
serde = { workspace = true }
serde_json = { workspace = true }
dotenvy = { workspace = true }
anyhow = { workspace = true }
futures-util = { workspace = true }
rand = { workspace = true }
chelabase-secrets = { workspace = true }
async-nats = { workspace = true }
reqwest = { workspace = true }
sha2 = { workspace = true }
# Storage webhooks (m18): their HMAC-SHA256 signatures.
hmac = { workspace = true }
hex = { workspace = true }
chrono = { workspace = true }
uuid = { workspace = true }
# The storage sweep (object-storage m8): user blobs.
chelabase-storage = { workspace = true }
bytes = { workspace = true }
# Edge functions m7: the scheduled runs' invoker port.
async-trait = { workspace = true }

[dev-dependencies]
worker = { path = ".", features = ["test-support"] }
chelabase-auth = { workspace = true, features = ["keygen"] }
# The managed pool's login check, asked as `chelabase_storage` in the storage login live test.
chelabase-pgsession = { workspace = true }
bollard = { workspace = true }
tempfile = { workspace = true }
sqlx = { workspace = true }
base64 = { workspace = true }
proptest = { workspace = true }
chelabase-neon = { workspace = true, features = ["fake"] }
chelabase-identity = { workspace = true, features = ["mock"] }
tokio = { workspace = true, features = ["test-util"] }
# The storage API live tests: the object store's blobs, and streamed (throttled, failing,
# stalled) upload bodies.
chelabase-storage = { workspace = true }
bytes = { workspace = true }
futures-util = { workspace = true }
reqwest = { workspace = true, features = ["stream"] }
# The storage service in-process (its failure paths, against a real compute): its router, the
# compute TLS, and an object store that fails on demand.
chelabase-storage-service = { path = "../storage" }
# m13b: the functions service's database-event dispatcher in-process, against a real compute.
chelabase-functions = { path = "../functions" }
chelabase-query = { workspace = true }
async-trait = { workspace = true }
