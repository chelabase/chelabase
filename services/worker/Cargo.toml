[package]
name = "worker"
version.workspace = true
edition.workspace = true
license.workspace = true
description = "Chelabase provisioning / reconciliation worker"

[lib]
name = "worker"
path = "src/lib.rs"

[[bin]]
name = "worker"
path = "src/main.rs"

[features]
# Test-only entry points for the integration tests (`Worker::create_personal_login`, T6-M4).
test-support = []

[dependencies]
chelabase-http = { workspace = true }
chelabase-metadata = { workspace = true }
chelabase-neon = { workspace = true, features = ["metadata"] }
chelabase-nats = { workspace = true }
chelabase-schema = { workspace = true }
chelabase-types = { workspace = true }
chelabase-identity = { workspace = true }
axum = { workspace = true }
tokio = { workspace = true }
tracing = { workspace = true }
tracing-subscriber = { workspace = true }
serde = { workspace = true }
serde_json = { workspace = true }
dotenvy = { workspace = true }
anyhow = { workspace = true }
futures-util = { workspace = true }
rand = { workspace = true }
chelabase-secrets = { workspace = true }
async-nats = { workspace = true }
reqwest = { workspace = true }
sha2 = { workspace = true }
hex = { workspace = true }
chrono = { workspace = true }
uuid = { workspace = true }

[dev-dependencies]
worker = { path = ".", features = ["test-support"] }
chelabase-auth = { workspace = true }
bollard = { workspace = true }
tempfile = { workspace = true }
sqlx = { workspace = true }
base64 = { workspace = true }
proptest = { workspace = true }
chelabase-neon = { workspace = true, features = ["fake"] }
chelabase-identity = { workspace = true, features = ["mock"] }
tokio = { workspace = true, features = ["test-util"] }
