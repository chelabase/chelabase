[package]
name = "gateway"
version.workspace = true
edition.workspace = true
license.workspace = true
description = "Cheladb HTTP API gateway (Pingora)"

[lib]
name = "gateway"
path = "src/lib.rs"

[[bin]]
name = "gateway"
path = "src/main.rs"

[dependencies]
cheladb-auth = { workspace = true }
cheladb-routes = { workspace = true }
cheladb-types = { workspace = true }
pingora-core = { workspace = true }
pingora-proxy = { workspace = true }
pingora-http = { workspace = true }
pingora-error = { workspace = true }
async-trait = { workspace = true }
bytes = { workspace = true }
http = { workspace = true }
arc-swap = { workspace = true }
uuid = { workspace = true }
serde_json = { workspace = true }
tokio = { workspace = true }
tracing = { workspace = true }
tracing-subscriber = { workspace = true }
dotenvy = { workspace = true }
anyhow = { workspace = true }
reqwest = { workspace = true }
moka = { workspace = true }
hex = { workspace = true }
serde = { workspace = true }
chrono = { workspace = true }

[dev-dependencies]
cheladb-auth = { workspace = true, features = ["test-support"] }
axum = { workspace = true }
tempfile = { workspace = true }
