# cargo-nextest settings (https://nexte.st/docs/configuration/).

# The worker's live tests share the checkout's stack: branch_live restarts its pageserver,
# roles_live recreates its orchestrator, and the caps count every database. They run one at a
# time (`just workbench test -p worker -- --run-ignored only`). Guarded by
# scripts/tests/workbench-recipes.sh.
[test-groups.stack-serial]
max-threads = 1

[[profile.default.overrides]]
filter = 'package(worker) & binary(/_live$/)'
test-group = "stack-serial"

# The catalog reader's live tests create cluster-wide roles in the metadata Postgres (the
# reserved ones too, on a fresh stack) and read every role back.
[[profile.default.overrides]]
filter = 'package(chelabase-schema) & binary(catalog_live)'
test-group = "stack-serial"

# The Zitadel live tests shorten the instance's invite code expiry for one call (#60).
[[profile.default.overrides]]
filter = 'package(chelabase-zitadel) & binary(zitadel_live)'
test-group = "stack-serial"

# Auth's live tests invite and remove members of the demo tenant, make a project with app users,
# and spend the runner address's accept-invite failures (#61).
[[profile.default.overrides]]
filter = 'package(auth) & binary(auth_live)'
test-group = "stack-serial"

# Other live suites that use the stack's Zitadel or its members while `zitadel_live` has the
# instance's invite code expiry shortened: they never run beside it. Only the orchestrator `api`
# binary's live Zitadel tests (`live_*`), so its hundreds of mock tests still run in parallel.
[[profile.default.overrides]]
filter = 'package(orchestrator) & binary(api) & test(/^live_/)'
test-group = "stack-serial"

[[profile.default.overrides]]
filter = 'package(chelabase-metadata) & binary(members_live)'
test-group = "stack-serial"

# `purge_app_sessions` clears every session's sealed grace token past its window, table-wide.
# Tests that hold such a session (the peek test compares rows before and after) never run beside
# the purge tests.
[test-groups.app-sessions-purge]
max-threads = 1

[[profile.default.overrides]]
filter = 'package(chelabase-metadata) & binary(live_db) & test(/^(purge_app_sessions_|peek_answers_like_refresh_and_writes_nothing$)/)'
test-group = "app-sessions-purge"
