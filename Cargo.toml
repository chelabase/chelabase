[workspace]
resolver = "3"
members = [
    "services/orchestrator",
    "services/worker",
    "services/gateway",
    "services/auth",
    "services/rest",
    "services/realtime",
    "services/init",
    "tools/cli",
    "tools/bench-data-api",
    "crates/chelabase-types",
    "crates/chelabase-metadata",
    "crates/chelabase-nats",
    "crates/chelabase-auth",
    "crates/chelabase-routes",
    "crates/chelabase-secrets",
    "crates/chelabase-neon",
    "crates/chelabase-query",
    "crates/chelabase-schema",
    "crates/chelabase-zitadel",
    "crates/chelabase-init",
    "crates/chelabase-http",
    "crates/chelabase-typegen",
    "crates/chelabase-storage",
]

[workspace.package]
version = "0.1.0"
edition = "2024"
license = "Apache-2.0"
repository = "https://github.com/chelabase/chelabase"

[workspace.dependencies]
chelabase-types = { path = "crates/chelabase-types" }
chelabase-metadata = { path = "crates/chelabase-metadata" }
chelabase-nats = { path = "crates/chelabase-nats" }
chelabase-auth = { path = "crates/chelabase-auth" }
chelabase-routes = { path = "crates/chelabase-routes" }
chelabase-secrets = { path = "crates/chelabase-secrets" }
chelabase-neon = { path = "crates/chelabase-neon" }
chelabase-query = { path = "crates/chelabase-query" }
chelabase-http = { path = "crates/chelabase-http" }
chelabase-schema = { path = "crates/chelabase-schema" }
chelabase-zitadel = { path = "crates/chelabase-zitadel" }
chelabase-init = { path = "crates/chelabase-init" }
chelabase-typegen = { path = "crates/chelabase-typegen" }
chelabase-storage = { path = "crates/chelabase-storage" }

axum = "0.8.9"
utoipa = { version = "6.0.0", features = ["chrono", "uuid"] }
utoipa-axum = "0.3.0"
tokio = { version = "1.54.0", features = ["full"] }
tower-http = { version = "0.7.1", features = ["trace", "cors"] }
tracing = "0.1.44"
tracing-subscriber = { version = "0.3.23", features = ["env-filter"] }
serde = { version = "1.0.229", features = ["derive"] }
serde_json = "1.0.151"
uuid = { version = "1.26.1", features = ["v4", "serde"] }
thiserror = "2.0.21"
anyhow = "1.0.104"
# TLS on aws-lc-rs like everything else, so a `sslmode=verify-full` URL works once the
# servers have certificates.
sqlx = { version = "0.9.0", features = ["runtime-tokio", "postgres", "uuid", "chrono", "json", "migrate", "tls-rustls-aws-lc-rs"] }
# Defaults off: they select ring for TLS and pull in KV, object store, websockets and the
# service API, none of which we use.
async-nats = { version = "0.50.0", default-features = false, features = ["jetstream", "aws-lc-rs", "server_2_10", "server_2_11", "server_2_12", "server_2_14"] }
dotenvy = "0.15.7"
chrono = { version = "0.4.45", features = ["serde"] }
humantime = "2.4.0"
urlencoding = "2.1.3"
bollard = "0.21.1"
futures-util = "0.3.34"
rand = "0.10.3"
proptest = "1.11.0"
# One crypto backend for the whole workspace: jsonwebtoken panics at runtime if both
# `aws_lc_rs` and `rust_crypto` end up enabled in one binary.
jsonwebtoken = { version = "11.1.0", features = ["aws_lc_rs"] }
# `rustls` uses the aws-lc-rs provider (post-quantum key exchange, FIPS mode); needs a C toolchain.
reqwest = { version = "0.13.5", default-features = false, features = ["json", "form", "rustls"] }
parking_lot = "0.12.5"
clap = { version = "4.6.7", features = ["derive", "env"] }
base64 = "0.23.1"
tempfile = "3.27.0"
pingora-core = "0.9.0"
pingora-proxy = "0.9.0"
pingora-http = "0.9.0"
pingora-error = "0.9.0"
async-trait = "0.1.92"
bytes = "1.12.1"
http = "1.5.0"
arc-swap = "1.9.2"
aes-gcm = "0.11.1"
ed25519-dalek = { version = "3.0.0", features = ["pem"] }
getrandom = "0.4.3"
hex = "0.4.3"
libc = "0.2.189"
# Our fork of 0.7.18, branch chelabase/replication (on top of chelabase/sasl-verified, which
# sits on chelabase/transaction-status, step 6e, and step 6d's simple-query tags): simple
# queries expose command tags, the empty-query marker and column types,
# `Client::transaction_status` tells whether a transaction may be open, a failed connect says
# whether the server's SCRAM final message verified, whether TLS setup failed and whether
# channel binding was refused (fork round 3, U9), and logical replication connections stream
# over CopyBoth (`Config::replication_mode`, `Client::copy_both_simple`,
# `replication::ReplicationStream`; RT1 T2). Upstream PRs pending; return to crates.io once
# they're released.
tokio-postgres = { git = "https://github.com/chelabase/rust-postgres", rev = "38859553846efbf142c4006048fb034839897ac8", default-features = false, features = ["runtime"] }
pg_query = "6.2.1"
tokio-util = "0.7.19"
moka = { version = "0.12.16", features = ["future", "sync"] }
hmac = "0.13.0"
pbkdf2 = "0.13.0"
# RT1 S7: rustls TLS for Valkey (platform mode; `CHELABASE_VALKEY_TLS=on`), its crypto from the
# workspace's rustls (aws-lc-rs, no ring).
redis = { version = "1.7.1", default-features = false, features = ["tokio-comp", "tokio-rustls-comp"] }
sha2 = "0.11.0"
subtle = "2.6.1"
# Fork round 3: compute TLS (a platform CA, compute server and orchestrator client certificates).
rcgen = { version = "0.14.10", default-features = false, features = ["aws_lc_rs", "pem", "x509-parser"] }
x509-parser = "0.18.1"
rustls = { version = "0.23.46", default-features = false, features = ["aws_lc_rs", "std", "tls12", "logging"] }
# Direct use (chelabase-auth's test RSA keys): the same aws-lc-rs that rustls and jsonwebtoken use.
aws-lc-rs = "1.18.2"
tokio-postgres-rustls-improved = { version = "0.17.1", default-features = false, features = ["aws-lc-rs"] }
tar = "0.4.46"
stringprep = "0.1.5"
deadpool-postgres = { version = "0.14.2", default-features = false, features = ["rt_tokio_1"] }
# Default features off for the SDK: `default-https-client` is rustls on aws-lc-rs (no ring), and
# key files are read by our own provider; `aws-config` supplies only the default chain.
aws-sdk-s3 = { version = "1.157.0", default-features = false, features = ["default-https-client", "rt-tokio", "behavior-version-latest"] }
aws-credential-types = "1.2"
# Default features off (no SSO/legacy client); same aws-lc-rs TLS as the SDK.
aws-config = { version = "1.13.0", default-features = false, features = ["default-https-client", "rt-tokio", "behavior-version-latest"] }

[profile.dev]
# File:line in backtraces without full debug info: smaller test binaries, faster links.
debug = "line-tables-only"

[profile.dev.package."*"]
# No debug info for dependencies (workspace members aren't matched by "*").
debug = false

# deadpool-postgres depends on crates.io tokio-postgres; route it to our fork so the bench
# harness has one tokio-postgres (the fork, chelabase/replication) in the build.
[patch.crates-io]
tokio-postgres = { git = "https://github.com/chelabase/rust-postgres", rev = "38859553846efbf142c4006048fb034839897ac8" }
# pingora 0.9.0 plus (chelabase/pingora branch chelabase/advisories): the websocket upgrade race fix
# (an empty request's end of body, read after the upstream's 101, no longer closes the upgraded
# connection; regression test: the gateway's a_websocket_upgrade_survives_a_101_that_beats_the_request_end)
# the removal of derivative and serde_yaml (RUSTSEC-2024-0388, RUSTSEC-2024-0449), and tokio 1.54
# support (no zero-capacity BufReader, which tokio 1.54 panics on for every accepted connection)
# with h2 0.4.20, the 32-per-connection malformed-stream bound kept under h2 0.4.20, and a
# write-buffer resize that flushes pending bytes first, and zstd 0.14.3 / zstd-safe 8.2
# (RUSTSEC-2026-0391/0398/0403/0410).
# From git, pingora-proxy takes its pingora-* siblings from the same checkout (path deps), so the
# ones the gateway names directly come from the same rev too; otherwise their types would differ.
pingora-proxy = { git = "https://github.com/chelabase/pingora", rev = "0eddec5420f2481ce6a761443105ea7f3fc35b65" }
pingora-core = { git = "https://github.com/chelabase/pingora", rev = "0eddec5420f2481ce6a761443105ea7f3fc35b65" }
pingora-http = { git = "https://github.com/chelabase/pingora", rev = "0eddec5420f2481ce6a761443105ea7f3fc35b65" }
pingora-error = { git = "https://github.com/chelabase/pingora", rev = "0eddec5420f2481ce6a761443105ea7f3fc35b65" }
