[workspace]
resolver = "2"
members = [
    "apps/orchestrator",
    "apps/worker",
    "apps/gateway",
    "apps/cheladb",
    "crates/cheladb-types",
    "crates/cheladb-metadata",
    "crates/cheladb-nats",
    "crates/cheladb-auth",
    "crates/cheladb-routes",
    "crates/cheladb-secrets",
]

[workspace.package]
version = "0.1.0"
edition = "2021"
license = "Apache-2.0"
repository = "https://github.com/cheladb/cheladb"

[workspace.dependencies]
cheladb-types = { path = "crates/cheladb-types" }
cheladb-metadata = { path = "crates/cheladb-metadata" }
cheladb-nats = { path = "crates/cheladb-nats" }
cheladb-auth = { path = "crates/cheladb-auth" }
cheladb-routes = { path = "crates/cheladb-routes" }
cheladb-secrets = { path = "crates/cheladb-secrets" }

axum = "0.8"
tokio = { version = "1", features = ["full"] }
tower-http = { version = "0.6", features = ["trace", "cors"] }
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
uuid = { version = "1", features = ["v4", "serde"] }
thiserror = "2"
anyhow = "1"
sqlx = { version = "0.8", features = ["runtime-tokio", "postgres", "uuid", "chrono", "migrate"] }
async-nats = "0.41"
dotenvy = "0.15"
chrono = { version = "0.4", features = ["serde"] }
bollard = "0.18"
futures-util = "0.3"
rand = "0.8"
jsonwebtoken = "9"
reqwest = { version = "0.12", default-features = false, features = ["json", "rustls-tls"] }
parking_lot = "0.12"
clap = { version = "4", features = ["derive", "env"] }
base64 = "0.22"
tempfile = "3"
pingora-core = "0.9"
pingora-proxy = "0.9"
pingora-http = "0.9"
pingora-error = "0.9"
async-trait = "0.1"
bytes = "1"
http = "1"
arc-swap = "1"
aes-gcm = "0.10"
tokio-postgres = "0.7"
ed25519-dalek = { version = "2", features = ["pkcs8", "pem", "rand_core"] }

# RSA key generation in the `rsa`/`num-bigint-dig` test-support path (JWKS
# mocks) is orders of magnitude slower unoptimized; opt these in dev builds
# so the auth/orchestrator test suites stay fast without an --release build.
[profile.dev.package.rsa]
opt-level = 3

[profile.dev.package.num-bigint-dig]
opt-level = 3
