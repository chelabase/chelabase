[workspace]
resolver = "3"
members = [
    "services/orchestrator",
    "services/worker",
    "services/gateway",
    "services/auth",
    "services/rest",
    "tools/cli",
    "crates/chelabase-types",
    "crates/chelabase-metadata",
    "crates/chelabase-nats",
    "crates/chelabase-auth",
    "crates/chelabase-routes",
    "crates/chelabase-secrets",
    "crates/chelabase-neon",
    "crates/chelabase-query",
    "crates/chelabase-zitadel",
]

[workspace.package]
version = "0.1.0"
edition = "2024"
license = "Apache-2.0"
repository = "https://github.com/chelabase/chelabase"

[workspace.dependencies]
chelabase-types = { path = "crates/chelabase-types" }
chelabase-metadata = { path = "crates/chelabase-metadata" }
chelabase-nats = { path = "crates/chelabase-nats" }
chelabase-auth = { path = "crates/chelabase-auth" }
chelabase-routes = { path = "crates/chelabase-routes" }
chelabase-secrets = { path = "crates/chelabase-secrets" }
chelabase-neon = { path = "crates/chelabase-neon" }
chelabase-query = { path = "crates/chelabase-query" }
chelabase-zitadel = { path = "crates/chelabase-zitadel" }

axum = "0.8.9"
utoipa = { version = "6.0.0", features = ["chrono", "uuid"] }
utoipa-axum = "0.3.0"
tokio = { version = "1.53.1", features = ["full"] }
tower-http = { version = "0.7.1", features = ["trace", "cors"] }
tracing = "0.1.44"
tracing-subscriber = { version = "0.3.23", features = ["env-filter"] }
serde = { version = "1.0.229", features = ["derive"] }
serde_json = "1.0.151"
uuid = { version = "1.26.1", features = ["v4", "serde"] }
thiserror = "2.0.21"
anyhow = "1.0.104"
# TLS on aws-lc-rs like everything else, so a `sslmode=verify-full` URL works once the
# servers have certificates.
sqlx = { version = "0.9.0", features = ["runtime-tokio", "postgres", "uuid", "chrono", "migrate", "tls-rustls-aws-lc-rs"] }
# Defaults off: they select ring for TLS and pull in KV, object store, websockets and the
# service API, none of which we use.
async-nats = { version = "0.50.0", default-features = false, features = ["jetstream", "aws-lc-rs", "server_2_10", "server_2_11", "server_2_12", "server_2_14"] }
dotenvy = "0.15.7"
chrono = { version = "0.4.45", features = ["serde"] }
humantime = "2.4.0"
urlencoding = "2.1.3"
bollard = "0.21.1"
futures-util = "0.3.34"
rand = "0.10.3"
# One crypto backend for the whole workspace: jsonwebtoken panics at runtime if both
# `aws_lc_rs` and `rust_crypto` end up enabled in one binary.
jsonwebtoken = { version = "11.1.0", features = ["aws_lc_rs"] }
# `rustls` uses the aws-lc-rs provider (post-quantum key exchange, FIPS mode); needs a C toolchain.
reqwest = { version = "0.13.5", default-features = false, features = ["json", "form", "rustls"] }
parking_lot = "0.12.5"
clap = { version = "4.6.7", features = ["derive", "env"] }
base64 = "0.23.1"
tempfile = "3.27.0"
pingora-core = "0.9.0"
pingora-proxy = "0.9.0"
pingora-http = "0.9.0"
pingora-error = "0.9.0"
async-trait = "0.1.92"
bytes = "1.12.1"
http = "1.5.0"
arc-swap = "1.9.2"
aes-gcm = "0.11.1"
ed25519-dalek = { version = "3.0.0", features = ["pem"] }
getrandom = "0.4.3"
hex = "0.4.3"
# Our fork of 0.7.18 (step 6d): simple queries expose command tags, the empty-query marker and
# column types. Upstream PR pending; return to crates.io once it's released.
tokio-postgres = { git = "https://github.com/chelabase/rust-postgres", rev = "d20c5b3cd15c8fa649757768a788428788844612", default-features = false, features = ["runtime"] }
pg_query = "6.2.1"
tokio-util = "0.7.19"
moka = { version = "0.12.16", features = ["future", "sync"] }
hmac = "0.13.0"
pbkdf2 = "0.13.0"
redis = { version = "1.7.1", default-features = false, features = ["tokio-comp"] }
sha2 = "0.11.0"
subtle = "2.6.1"
stringprep = "0.1.5"

[profile.dev]
# File:line in backtraces without full debug info: smaller test binaries, faster links.
debug = "line-tables-only"

[profile.dev.package."*"]
# No debug info for dependencies (workspace members aren't matched by "*").
debug = false

# RSA key generation in the `rsa`/`num-bigint-dig` test-support path (JWKS
# mocks) is orders of magnitude slower unoptimized; opt these in dev builds
# so the auth/orchestrator test suites stay fast without an --release build.
[profile.dev.package.rsa]
opt-level = 3

[profile.dev.package.num-bigint-dig]
opt-level = 3
