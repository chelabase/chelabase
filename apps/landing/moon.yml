language: "typescript"

tasks:
  dev:
    command: "pnpm"
    args: ["dev"]
    options:
      persistent: true
      cache: false
  build:
    command: "pnpm"
    args: ["build"]
    inputs:
      - "src/**/*"
      - "vite.config.ts"
      - "/packages/design/**/*"
    outputs:
      - "dist"
  typecheck:
    command: "pnpm"
    args: ["typecheck"]
    inputs:
      - "**/*"
      - "/packages/design/src/**/*"
  test:
    command: "pnpm"
    args: ["test"]
    inputs:
      - "**/*"
      - "/packages/design/src/**/*"
    deps:
      - "~:build"
