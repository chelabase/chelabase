language: "typescript"

tasks:
  dev:
    command: "pnpm"
    args: ["dev"]
    options:
      persistent: true
      cache: false
  build:
    command: "pnpm"
    args: ["build"]
    inputs:
      - "**/*"
      - "/packages/design/**/*"
  typecheck:
    command: "pnpm"
    args: ["typecheck"]
    inputs:
      - "**/*"
      - "/packages/design/src/**/*"
