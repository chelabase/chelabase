# The offline checks: `just check` (nextest included) and the doctests `just test` adds, the same
# commands a contributor runs.
name: ci

on:
  workflow_dispatch:
  pull_request:
  push: { branches: [main] }

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

env:
  CARGO_TERM_COLOR: always
  CARGO_INCREMENTAL: "0"

jobs:
  check:
    name: just check, doctests
    runs-on: ubuntu-latest
    timeout-minutes: 90
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
          # compose-overlay-equiv.sh compares against an older commit.
          fetch-depth: 0

      - name: System packages
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends clang cmake protobuf-compiler postgresql-client jq

      # proto reads .prototools: Rust, moon, node, pnpm, just (and sccache, unused here).
      - uses: moonrepo/setup-toolchain@261c62cb5b0f580c7be7c8cd0f023a2e96756095 # v0.6.4
        with:
          auto-install: true

      # The version of cargo-deny matches `just deny-install`.
      - uses: taiki-e/install-action@86f7a0ffb25f40114606501a311ebcfaf882ea32 # v2.88.0
        with:
          tool: nextest,cargo-deny@0.20.2

      - name: Compose version (just check's compose scripts need 2.30 or newer)
        run: docker compose version

      # proto's Rust install leaves the toolchain without rustc on the hosted runner, so let
      # rustup install rust-toolchain.toml's channel and components itself.
      - name: Rust toolchain (rust-toolchain.toml)
        run: |
          rustup toolchain uninstall "$(sed -n 's/^channel = "\(.*\)"/\1/p' rust-toolchain.toml)" || true
          rustup toolchain install
          rustc -vV

      - uses: Swatinem/rust-cache@d1527c8f67ef9af357290475d4af4b0fab8f12e0 # v2.9.3

      - name: pnpm store path
        id: pnpm-store
        run: echo "path=$(pnpm store path --silent)" >> "$GITHUB_OUTPUT"

      - uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: ${{ steps.pnpm-store.outputs.path }}
          key: pnpm-store-${{ runner.os }}-${{ hashFiles('pnpm-lock.yaml') }}
          restore-keys: pnpm-store-${{ runner.os }}-

      - run: pnpm install --frozen-lockfile

      - run: just check

      # `just test` is `cargo nextest run --workspace` (already run by `just check`) plus the
      # doctests, which nextest doesn't run: only the doctests are left.
      - run: cargo test --workspace --doc
