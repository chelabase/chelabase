# Cheladb local dependencies: one worktree slot's app tier (`just deps-up` in that worktree).
# Slot N (CHELADB_SLOT, from the worktree's .env.local; 0 for the main checkout) is project
# cheladb-s<N> and publishes today's ports + 100 × N. The shared tier (shared.yml, project
# cheladb) must be up first: the proxy reaches computes on its network and mounts its
# certificate volume. See scripts/lib/slots.sh.

name: cheladb-s${CHELADB_SLOT:-0}

# Keep equal to shared.yml's pin (infra/compose/tests/slots.sh checks it); `just deps-up`
# overrides it with a local `just neon-build` when present.
x-neon-image: &neon-image ${NEON_IMAGE:-ghcr.io/cheladb/neon-storage:532981ad7de5-dev@sha256:08ab209a64face61321f140cd6a82941ff0297740d2882109bf1e462549b2935}

services:
  nats:
    image: nats:2.15.0-alpine@sha256:ac8f88a6494bffc2c2a5289a0ca61cb28a9145c11ba5677cf24265d07f46d8d4
    restart: unless-stopped
    command: ["--jetstream", "--store_dir=/data", "-m", "8222"]
    ports:
      - "127.0.0.1:${CHELADB_NATS_PORT:-4222}:4222"
      - "127.0.0.1:${CHELADB_NATS_MONITOR_PORT:-8222}:8222"
    volumes:
      - nats_data:/data
    healthcheck:
      test: ["CMD", "wget", "-qO-", "http://localhost:8222/healthz"]
      interval: 5s
      timeout: 5s
      retries: 10

  # Valkey (BSD-3-Clause, speaks the Redis protocol). Neon's proxy uses it for query cancel and
  # for the cache-clearing messages the control plane publishes on a password change. Local dev:
  # no auth, loopback only. Platform mode needs auth and TLS.
  valkey:
    image: valkey/valkey:9.1.2-alpine@sha256:48332870af354a799964c0012ae1194a0bf2bf894eb508f945810596dc2d8d11
    restart: unless-stopped
    ports:
      - "127.0.0.1:${CHELADB_VALKEY_PORT:-6379}:6379"
    volumes: ["valkey_data:/data"]
    healthcheck:
      test: ["CMD", "valkey-cli", "ping"]
      interval: 2s
      timeout: 5s
      retries: 30

  # Neon's proxy. Clients connect to <endpoint-id>.localtest.me (which resolves to 127.0.0.1):
  # Postgres wire on CHELADB_PROXY_PG_PORT (4432 in slot 0); WebSocket and SQL over HTTP on
  # CHELADB_PROXY_HTTP_PORT (4444). It asks this slot's internal listener for role secrets and
  # compute addresses, and reaches computes on the shared network. Role secrets are cached for
  # at most a minute, and dropped at once when the control plane publishes /password_updated
  # to this slot's Valkey.
  proxy:
    image: *neon-image
    restart: unless-stopped
    command:
      - proxy
      - --auth-backend=control-plane
      - --auth-endpoint=http://host.docker.internal:${CHELADB_INTERNAL_PORT:-8083}/proxy/api/v1
      - --proxy=0.0.0.0:4432
      - --wss=0.0.0.0:4444
      # The proxy takes the endpoint domain from the certificate's CN.
      - --tls-cert=/tls/tls.crt
      - --tls-key=/tls/tls.key
      - --project-info-cache=size=10000,ttl=1m,max_roles=64,gc_interval=60m
      - --redis-auth-type=plain
      - --redis-plain=redis://valkey:6379
    environment:
      NEON_PROXY_TO_CONTROLPLANE_TOKEN: ${CHELADB_PROXY_API_TOKEN:-cheladb-dev-proxy-api}
    ports:
      - "127.0.0.1:${CHELADB_PROXY_PG_PORT:-4432}:4432"
      - "127.0.0.1:${CHELADB_PROXY_HTTP_PORT:-4444}:4444"
    extra_hosts: ["host.docker.internal:host-gateway"]
    networks: [default, shared]
    volumes: ["neon_proxy_tls:/tls:ro"]
    healthcheck:
      test: ["CMD", "bash", "-c", "</dev/tcp/127.0.0.1/4432"]
      interval: 2s
      retries: 60
    depends_on:
      # The proxy exits if it can't reach Redis at startup.
      valkey:
        condition: service_healthy

networks:
  # The shared tier's network: computes (started by the worker) live there.
  shared:
    external: true
    name: cheladb_default

volumes:
  nats_data:
  valkey_data:
  # Written by shared.yml's proxy-tls (deps-up waits for it before starting this tier).
  neon_proxy_tls:
    external: true
    name: cheladb_neon_proxy_tls
