# The stack's NATS server (RT1 T1, R11). JetStream, the store dir and the monitoring port come
# from the command line (infra/compose/docker-compose.yml).
#
# One account, one user per service (orchestrator, worker, realtime, the test runner), each with
# its own publish/subscribe allow lists and its own reply-inbox prefix (`_INBOX_<user>`), so no
# service reads another's replies. There is no anonymous user: a client without credentials is
# refused. `chelabase workbench up` renders the users (bcrypt hashes of the generated passwords
# under .chelabase/nats/, never the passwords) into the stack's state dir; Compose mounts that
# file next to this one.
include "auth.conf"
