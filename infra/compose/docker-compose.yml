# Cheladb local control-plane dependencies.
# Rust apps and Studio run on the host against these services.

name: cheladb

# --- Neon storage (part of the base stack: `just deps-up`) ---
# Pinned by digest; `just deps-up` overrides these with a local `just neon-build` when present.
# The packages are public on ghcr.io (infra/neon/README.md).
x-neon-images:
  neon: &neon-image ${NEON_IMAGE:-ghcr.io/cheladb/neon-storage:39b641053212-dev@sha256:8c6618db76f76a87b368123cbf13a22f3bd1f97c8e786ee3ebbf36902fc2e9ca}
  # The image of the compute containers the worker starts (CHELADB_COMPUTE_IMAGE); pinned here.
  compute: ${COMPUTE_NODE_IMAGE:-ghcr.io/cheladb/neon-compute-v17:39b641053212-dev@sha256:d263f15661362838b3591f1325f08920addf87b8ef11914e931d72d503193a21}

# S3 credentials for SeaweedFS. Local dev only.
x-neon-s3-env: &neon-s3-env
  AWS_ACCESS_KEY_ID: cheladb-dev
  AWS_SECRET_ACCESS_KEY: cheladb-dev-secret
  AWS_DEFAULT_REGION: us-east-1

services:
  metadata-db:
    image: postgres:17.11-alpine@sha256:b0f9560a2de083e2cc7382e75f808c7381a32852a7ec49117deedb300e552b24
    restart: unless-stopped
    environment:
      POSTGRES_USER: cheladb
      POSTGRES_PASSWORD: cheladb
      POSTGRES_DB: cheladb_metadata
    ports:
      - "127.0.0.1:5433:5432"
    volumes:
      - metadata_pg_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U cheladb -d cheladb_metadata"]
      interval: 5s
      timeout: 5s
      retries: 10

  nats:
    image: nats:2.15.0-alpine@sha256:ac8f88a6494bffc2c2a5289a0ca61cb28a9145c11ba5677cf24265d07f46d8d4
    restart: unless-stopped
    command: ["--jetstream", "--store_dir=/data", "-m", "8222"]
    ports:
      - "127.0.0.1:4222:4222"
      - "127.0.0.1:8222:8222"
    volumes:
      - nats_data:/data
    healthcheck:
      test: ["CMD", "wget", "-qO-", "http://localhost:8222/healthz"]
      interval: 5s
      timeout: 5s
      retries: 10

  # Valkey (BSD-3-Clause, speaks the Redis protocol). Neon's proxy uses it for query cancel and
  # for the cache-clearing messages the control plane publishes on a password change. Local dev:
  # no auth, loopback only. Platform mode needs auth and TLS.
  valkey:
    image: valkey/valkey:9.1.2-alpine@sha256:48332870af354a799964c0012ae1194a0bf2bf894eb508f945810596dc2d8d11
    restart: unless-stopped
    ports:
      - "127.0.0.1:6379:6379"
    volumes: ["valkey_data:/data"]
    healthcheck:
      test: ["CMD", "valkey-cli", "ping"]
      interval: 2s
      timeout: 5s
      retries: 30

  zitadel-db:
    image: postgres:17.11-alpine@sha256:b0f9560a2de083e2cc7382e75f808c7381a32852a7ec49117deedb300e552b24
    restart: unless-stopped
    environment:
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgres
    ports:
      - "127.0.0.1:5434:5432"
    volumes:
      - zitadel_pg_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres"]
      interval: 5s
      timeout: 5s
      retries: 10

  # Zitadel v4: sign-in pages are Studio's own (/login …), served by auth. FirstInstance writes admin.pat and login-client.pat once, on a fresh zitadel_pg_data volume.
  zitadel:
    image: ghcr.io/zitadel/zitadel:v4.19.1@sha256:f98935f56505ec6fa3e6523261cd1b8ace0c622e16da4a45acd493cb472f003f
    restart: unless-stopped
    command: start-from-init --masterkey "MasterkeyNeedsToHave32Characters" --tlsMode disabled
    environment:
      ZITADEL_DATABASE_POSTGRES_HOST: zitadel-db
      ZITADEL_DATABASE_POSTGRES_PORT: 5432
      ZITADEL_DATABASE_POSTGRES_DATABASE: zitadel
      ZITADEL_DATABASE_POSTGRES_USER_USERNAME: zitadel
      ZITADEL_DATABASE_POSTGRES_USER_PASSWORD: zitadel
      ZITADEL_DATABASE_POSTGRES_USER_SSL_MODE: disable
      ZITADEL_DATABASE_POSTGRES_ADMIN_USERNAME: postgres
      ZITADEL_DATABASE_POSTGRES_ADMIN_PASSWORD: postgres
      ZITADEL_DATABASE_POSTGRES_ADMIN_SSL_MODE: disable
      ZITADEL_EXTERNALSECURE: "false"
      ZITADEL_EXTERNALDOMAIN: localhost
      ZITADEL_EXTERNALPORT: "8080"
      ZITADEL_FIRSTINSTANCE_PATPATH: /zitadel-bootstrap/admin.pat
      ZITADEL_FIRSTINSTANCE_ORG_MACHINE_MACHINE_USERNAME: cheladb-bootstrap
      ZITADEL_FIRSTINSTANCE_ORG_MACHINE_MACHINE_NAME: Cheladb Bootstrap
      ZITADEL_FIRSTINSTANCE_ORG_MACHINE_PAT_EXPIRATIONDATE: "2099-01-01T00:00:00Z"
      ZITADEL_FIRSTINSTANCE_ORG_HUMAN_PASSWORDCHANGEREQUIRED: "false"
      ZITADEL_FIRSTINSTANCE_LOGINCLIENTPATPATH: /zitadel-bootstrap/login-client.pat
      ZITADEL_FIRSTINSTANCE_ORG_LOGINCLIENT_MACHINE_USERNAME: login-client
      ZITADEL_FIRSTINSTANCE_ORG_LOGINCLIENT_MACHINE_NAME: Cheladb auth
      ZITADEL_FIRSTINSTANCE_ORG_LOGINCLIENT_PAT_EXPIRATIONDATE: "2099-01-01T00:00:00Z"
      ZITADEL_DEFAULTINSTANCE_FEATURES_LOGINV2_REQUIRED: "true"
      ZITADEL_DEFAULTINSTANCE_FEATURES_LOGINV2_BASEURI: http://localhost:3000/
      ZITADEL_OIDC_DEFAULTLOGINURLV2: "http://localhost:3000/login?authRequest="
      ZITADEL_OIDC_DEFAULTLOGOUTURLV2: "http://localhost:3000/logout?post_logout_redirect="
    depends_on:
      zitadel-db:
        condition: service_healthy
    ports:
      - "127.0.0.1:8080:8080"
    volumes:
      - ../../.cheladb/zitadel:/zitadel-bootstrap

  # Local mail catcher: Zitadel's signup verification codes land here (UI :8025).
  mailpit:
    image: axllent/mailpit:v1.31.3@sha256:ed9b00c609e77e99c79b93f1178255ebc271868920f2c69a8d166bd5634ed10d
    restart: unless-stopped
    environment:
      # Zitadel needs SMTP credentials (it can't handle an empty password), so
      # accept any user/password over plain SMTP. Local dev only.
      MP_SMTP_AUTH_ACCEPT_ANY: "true"
      MP_SMTP_AUTH_ALLOW_INSECURE: "true"
    ports:
      - "127.0.0.1:8025:8025"

  # --- Neon storage ------------------------------------------------------
  # Flags and health checks come from the old cheladb repo's core/docker/docker-compose.yml,
  # checked there against the pinned Neon source.

  # All-in-one SeaweedFS (master, volume, filer, S3) for pageserver layers and safekeeper WAL.
  seaweedfs:
    image: chrislusf/seaweedfs:4.47@sha256:ce9e796f1fe6f06968f4c04bdaf8f678dad9c8acdfef3d244133d71bfa6bf882
    restart: unless-stopped
    entrypoint: ["/bin/sh", "-c"]
    command:
      - |
        cat > /tmp/s3.json <<EOT
        {"identities": [{"name": "neon",
          "credentials": [{"accessKey": "cheladb-dev", "secretKey": "cheladb-dev-secret"}],
          "actions": ["Admin", "Read", "Write", "List", "Tagging"]}]}
        EOT
        exec weed server -s3 -s3.config=/tmp/s3.json -dir=/data -volume.max=64 -master.volumeSizeLimitMB=1024
    volumes:
      - neon_seaweedfs_data:/data
    healthcheck:
      test: ["CMD", "nc", "-z", "127.0.0.1", "8333"]
      interval: 2s
      retries: 60

  create-bucket:
    image: *neon-image
    restart: "no"
    environment: *neon-s3-env
    entrypoint: ["/bin/sh", "-c"]
    command:
      - |
        for i in $$(seq 60); do
          aws --endpoint-url http://seaweedfs:8333 s3 mb s3://neon 2>/dev/null ||
            aws --endpoint-url http://seaweedfs:8333 s3 ls s3://neon >/dev/null && exit 0
          sleep 2
        done
        exit 1
    depends_on:
      seaweedfs:
        condition: service_healthy

  storage-broker:
    image: *neon-image
    restart: unless-stopped
    command: ["storage_broker", "--listen-addr=0.0.0.0:50051"]
    healthcheck:
      test: ["CMD", "bash", "-c", "</dev/tcp/127.0.0.1/50051"]
      interval: 2s
      retries: 60

  # One safekeeper keeps WAL on one disk; enough for local dev.
  safekeeper1:
    image: *neon-image
    restart: unless-stopped
    environment: *neon-s3-env
    command:
      - safekeeper
      - --id=1
      - -D
      - /data
      - --listen-pg=0.0.0.0:5454
      - --listen-http=0.0.0.0:7676
      - --advertise-pg=safekeeper1:5454
      - --availability-zone=az-1
      - --broker-endpoint=http://storage-broker:50051
      - "--remote-storage={endpoint='http://seaweedfs:8333', bucket_name='neon', bucket_region='us-east-1', prefix_in_bucket='/safekeeper/'}"
    volumes:
      - neon_safekeeper1_data:/data
    healthcheck:
      test: ["CMD", "curl", "-fsS", "http://127.0.0.1:7676/v1/status"]
      interval: 2s
      retries: 60
    depends_on:
      storage-broker:
        condition: service_healthy
      create-bucket:
        condition: service_completed_successfully

  storcon-db:
    image: postgres:17.11-alpine@sha256:b0f9560a2de083e2cc7382e75f808c7381a32852a7ec49117deedb300e552b24
    restart: unless-stopped
    environment:
      # Local dev only.
      POSTGRES_USER: storcon
      POSTGRES_PASSWORD: storcon
      POSTGRES_DB: storage_controller
    volumes:
      - neon_storcon_pg_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U storcon -d storage_controller"]
      interval: 2s
      retries: 60

  storage-controller:
    image: *neon-image
    restart: unless-stopped
    command:
      - storage_controller
      # --dev: no JWT auth between storage components. Their ports stay on the Compose
      # network; only the API below is published, on loopback.
      - --dev
      - --listen=0.0.0.0:1234
      # Attachment changes (every tenant create, too) are pushed to the orchestrator's
      # internal listener on the host; a tenant's reconcile waits until it answers. The
      # token is local dev only.
      - --control-plane-url=http://host.docker.internal:8083/storcon
      - --control-plane-jwt-token=${CHELADB_STORCON_HOOK_TOKEN:-cheladb-dev-storcon-hook}
      - --database-url=postgresql://storcon:storcon@storcon-db:5432/storage_controller
    ports:
      # The control plane runs on the host.
      - "127.0.0.1:1234:1234"
    extra_hosts: ["host.docker.internal:host-gateway"]
    healthcheck:
      test: ["CMD", "curl", "-fsS", "http://127.0.0.1:1234/ready"]
      interval: 2s
      retries: 60
    depends_on:
      storcon-db:
        condition: service_healthy

  # Registers with the storage controller from metadata.json at startup.
  pageserver:
    image: *neon-image
    restart: unless-stopped
    environment: *neon-s3-env
    entrypoint: ["/bin/sh", "-c"]
    command:
      - |
        set -e
        mkdir -p /data/.neon
        echo 'id=1' > /data/.neon/identity.toml
        cat > /data/.neon/pageserver.toml <<EOT
        broker_endpoint='http://storage-broker:50051'
        pg_distrib_dir='/usr/local/'
        listen_pg_addr='0.0.0.0:6400'
        listen_http_addr='0.0.0.0:9898'
        control_plane_api='http://storage-controller:1234/upcall/v1/'
        virtual_file_io_mode='buffered'
        remote_storage={ endpoint='http://seaweedfs:8333', bucket_name='neon', bucket_region='us-east-1', prefix_in_bucket='/pageserver' }
        EOT
        echo '{"host":"pageserver","port":6400,"http_host":"pageserver","http_port":9898,"availability_zone_id":"az-1"}' > /data/.neon/metadata.json
        exec pageserver -D /data/.neon
    ports:
      # HTTP API for the host-side control plane; the pg port (6400) stays internal.
      - "127.0.0.1:9898:9898"
    volumes:
      - neon_pageserver_data:/data
    healthcheck:
      test: ["CMD", "curl", "-fsS", "http://127.0.0.1:9898/v1/status"]
      interval: 2s
      retries: 60
    depends_on:
      storage-broker:
        condition: service_healthy
      storage-controller:
        condition: service_healthy
      create-bucket:
        condition: service_completed_successfully

  # One-shot: registers the safekeepers with the storage controller and marks them Active.
  register-safekeepers:
    image: *neon-image
    restart: "no"
    entrypoint: ["/bin/sh", "-c"]
    command:
      - |
        set -e
        S=http://storage-controller:1234
        for ID in 1; do
          curl -fsS -X POST -H 'Content-Type: application/json' \
            -d "{\"id\":$$ID,\"created_at\":\"2023-10-25T09:11:25Z\",\"updated_at\":\"2024-08-28T11:32:43Z\",\"region_id\":\"local\",\"host\":\"safekeeper$$ID\",\"port\":5454,\"http_port\":7676,\"https_port\":null,\"version\":5957,\"availability_zone_id\":\"az-$$ID\"}" \
            $$S/control/v1/safekeeper/$$ID
          curl -fsS -X POST -H 'Content-Type: application/json' \
            -d '{"scheduling_policy":"Active"}' $$S/control/v1/safekeeper/$$ID/scheduling_policy
        done
    depends_on:
      storage-controller:
        condition: service_healthy
      safekeeper1:
        condition: service_healthy

  # Writes the proxy's TLS certificate once: a local CA and a *.localtest.me certificate signed
  # by it. Clients verify against the CA; `just deps-up` copies it to
  # .cheladb/neon/proxy-ca.crt.
  proxy-tls:
    image: *neon-image
    restart: "no"
    user: "0"
    entrypoint: ["/bin/sh", "-c"]
    command:
      - |
        set -e
        cd /tls
        if [ -s tls.crt ] && openssl x509 -in tls.crt -noout -subject | grep -qF '*.localtest.me'; then
          echo "certificate for *.localtest.me exists"; exit 0
        fi
        [ -s ca.key ] || openssl req -x509 -newkey ec -pkeyopt ec_paramgen_curve:P-256 -nodes \
          -keyout ca.key -out ca.crt -days 3650 -subj "/CN=Cheladb local CA"
        openssl req -newkey ec -pkeyopt ec_paramgen_curve:P-256 -nodes -keyout tls.key -out tls.csr \
          -subj "/CN=*.localtest.me"
        printf 'subjectAltName=DNS:*.localtest.me\n' > ext.cnf
        openssl x509 -req -in tls.csr -CA ca.crt -CAkey ca.key -CAcreateserial -days 825 \
          -extfile ext.cnf -out tls.crt
        rm -f tls.csr ext.cnf
        chown 1000:1000 tls.key tls.crt ca.crt
        chmod 600 ca.key tls.key
        echo "issued a certificate for *.localtest.me"
    volumes: ["neon_proxy_tls:/tls"]
    network_mode: none

  # Neon's proxy. Clients connect to <endpoint-id>.localtest.me (which resolves to 127.0.0.1):
  # Postgres wire on 4432; WebSocket and SQL over HTTP on 4444. It asks the orchestrator's
  # internal listener for role secrets and compute addresses, and reaches computes on this
  # network. Role secrets are cached for at most a minute, and dropped at once when the
  # control plane publishes /password_updated to Valkey.
  proxy:
    image: *neon-image
    restart: unless-stopped
    command:
      - proxy
      - --auth-backend=control-plane
      - --auth-endpoint=http://host.docker.internal:8083/proxy/api/v1
      - --proxy=0.0.0.0:4432
      - --wss=0.0.0.0:4444
      # The proxy takes the endpoint domain from the certificate's CN.
      - --tls-cert=/tls/tls.crt
      - --tls-key=/tls/tls.key
      - --project-info-cache=size=10000,ttl=1m,max_roles=64,gc_interval=60m
      - --redis-auth-type=plain
      - --redis-plain=redis://valkey:6379
    environment:
      NEON_PROXY_TO_CONTROLPLANE_TOKEN: ${CHELADB_PROXY_API_TOKEN:-cheladb-dev-proxy-api}
    ports:
      - "127.0.0.1:4432:4432"
      - "127.0.0.1:4444:4444"
    extra_hosts: ["host.docker.internal:host-gateway"]
    volumes: ["neon_proxy_tls:/tls:ro"]
    healthcheck:
      test: ["CMD", "bash", "-c", "</dev/tcp/127.0.0.1/4432"]
      interval: 2s
      retries: 60
    depends_on:
      proxy-tls:
        condition: service_completed_successfully
      # The proxy exits if it can't reach Redis at startup.
      valkey:
        condition: service_healthy

volumes:
  metadata_pg_data:
  nats_data:
  valkey_data:
  zitadel_pg_data:
  neon_seaweedfs_data:
  neon_pageserver_data:
  neon_safekeeper1_data:
  neon_storcon_pg_data:
  neon_proxy_tls:
