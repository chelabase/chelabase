x-app-health: &app-health
  interval: 2s
  timeout: 5s
  retries: 30
  start_period: 60s

services:
  metadata-db:
    image: postgres:17.11-alpine@sha256:b0f9560a2de083e2cc7382e75f808c7381a32852a7ec49117deedb300e552b24
    restart: unless-stopped
    environment:
      POSTGRES_USER: chelabase
      POSTGRES_PASSWORD: chelabase
      POSTGRES_DB: chelabase_metadata
    volumes:
      - metadata_pg_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U chelabase -d chelabase_metadata"]
      interval: 5s
      timeout: 5s
      retries: 10

  nats:
    image: nats:2.15.0-alpine@sha256:ac8f88a6494bffc2c2a5289a0ca61cb28a9145c11ba5677cf24265d07f46d8d4
    restart: unless-stopped
    # RT1 T1 (R11): one account, one user per service with its own permissions and inbox prefix
    # (infra/compose/nats/nats.conf includes the users the workbench renders into the stack's
    # state dir: bcrypt hashes only). No anonymous access. Not on the compute network.
    command: ["-c", "/etc/nats/nats.conf", "--jetstream", "--store_dir=/data", "-m", "8222"]
    volumes:
      - nats_data:/data
      - type: bind
        source: ${CHELABASE_CHECKOUT}/infra/compose/nats/nats.conf
        target: /etc/nats/nats.conf
        read_only: true
        bind: {create_host_path: false}
      - type: bind
        source: ${CHELABASE_STACK_DIR}/nats/auth.conf
        target: /etc/nats/auth.conf
        read_only: true
        bind: {create_host_path: false}
    healthcheck:
      test: ["CMD", "wget", "-qO-", "http://localhost:8222/healthz"]
      interval: 5s
      timeout: 5s
      retries: 10

  # Valkey (BSD-3-Clause, speaks the Redis protocol). Neon's proxy uses it for query cancel and
  # for the cache-clearing messages the control plane publishes on a password change; realtime
  # keeps its tickets and counters in it. RT1 T1 (P5, S6): ACL users only (`default` off), from
  # the users file the workbench renders into the stack's state dir (SHA-256 hashes only). It runs
  # as the stack's uid to read that 0600 file; nothing is persisted (`--save ""`: every key is
  # short-lived). Not on the compute network. TLS is a platform-mode setting.
  valkey:
    image: valkey/valkey:9.1.2-alpine@sha256:48332870af354a799964c0012ae1194a0bf2bf894eb508f945810596dc2d8d11
    restart: unless-stopped
    user: "${CHELABASE_UID}:${CHELABASE_GID}"
    command: ["valkey-server", "--aclfile", "/etc/valkey/users.acl", "--save", "", "--appendonly", "no"]
    volumes:
      - valkey_data:/data
      - type: bind
        source: ${CHELABASE_STACK_DIR}/valkey/users.acl
        target: /etc/valkey/users.acl
        read_only: true
        bind: {create_host_path: false}
      - type: bind
        source: ${CHELABASE_KEYS_DIR}/valkey/health.password
        target: /run/valkey-health.password
        read_only: true
        bind: {create_host_path: false}
    # Ruling (f): the healthcheck logs in as `health`, which may only PING.
    healthcheck:
      # The password goes through the environment (VALKEYCLI_AUTH), never valkey-cli's arguments.
      test: ["CMD-SHELL", "VALKEYCLI_AUTH=\"$$(cat /run/valkey-health.password)\" valkey-cli --no-auth-warning --user health ping | grep -qx PONG"]
      interval: 2s
      timeout: 5s
      retries: 30

  zitadel-db:
    image: postgres:17.11-alpine@sha256:b0f9560a2de083e2cc7382e75f808c7381a32852a7ec49117deedb300e552b24
    restart: unless-stopped
    environment:
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgres
    volumes:
      - zitadel_pg_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres"]
      interval: 5s
      timeout: 5s
      retries: 10

  # Zitadel v4: sign-in pages are Studio's own (/login …), served by auth. FirstInstance writes
  # admin.pat and login-client.pat once, on a fresh zitadel_pg_data volume, into the stack's
  # state dir.
  zitadel:
    image: ghcr.io/zitadel/zitadel:v4.19.1@sha256:f98935f56505ec6fa3e6523261cd1b8ace0c622e16da4a45acd493cb472f003f
    restart: unless-stopped
    command: start-from-init --masterkey "MasterkeyNeedsToHave32Characters" --tlsMode ${CHELABASE_ZITADEL_TLS_MODE:?set by chelabase workbench (stack.env)}
    environment:
      ZITADEL_DATABASE_POSTGRES_HOST: zitadel-db
      ZITADEL_DATABASE_POSTGRES_PORT: 5432
      ZITADEL_DATABASE_POSTGRES_DATABASE: zitadel
      ZITADEL_DATABASE_POSTGRES_USER_USERNAME: zitadel
      ZITADEL_DATABASE_POSTGRES_USER_PASSWORD: zitadel
      ZITADEL_DATABASE_POSTGRES_USER_SSL_MODE: disable
      ZITADEL_DATABASE_POSTGRES_ADMIN_USERNAME: postgres
      ZITADEL_DATABASE_POSTGRES_ADMIN_PASSWORD: postgres
      ZITADEL_DATABASE_POSTGRES_ADMIN_SSL_MODE: disable
      # Zitadel's public address is the stack's auth host (CHELABASE_AUTH_HOST), set apart here:
      # its name, the public port and whether the scheme is https. stack.env carries them (and
      # the TLS mode above); there are no defaults here.
      ZITADEL_EXTERNALSECURE: "${CHELABASE_PUBLIC_SECURE:?set by chelabase workbench (stack.env)}"
      ZITADEL_EXTERNALDOMAIN: "${CHELABASE_AUTH_HOST_NAME:?set by chelabase workbench (stack.env)}"
      ZITADEL_EXTERNALPORT: "${CHELABASE_PUBLIC_PORT:?set by chelabase workbench (stack.env)}"
      # The TLS mode is `disabled` or `external` (TLS ends at the gateway), so Zitadel serves
      # plain HTTP; `zitadel ready` (the healthcheck) reads this, not the start flag.
      ZITADEL_TLS_ENABLED: "false"
      # Zitadel's own registration is off: sign-up goes only through Chelabase's rules. (A volume
      # made before this setting gets it from `chelabase dev bootstrap`.)
      ZITADEL_DEFAULTINSTANCE_LOGINPOLICY_ALLOWREGISTER: "false"
      ZITADEL_FIRSTINSTANCE_PATPATH: /zitadel-bootstrap/admin.pat
      ZITADEL_FIRSTINSTANCE_ORG_MACHINE_MACHINE_USERNAME: chelabase-bootstrap
      ZITADEL_FIRSTINSTANCE_ORG_MACHINE_MACHINE_NAME: Chelabase Bootstrap
      ZITADEL_FIRSTINSTANCE_ORG_MACHINE_PAT_EXPIRATIONDATE: "2099-01-01T00:00:00Z"
      ZITADEL_FIRSTINSTANCE_ORG_HUMAN_PASSWORDCHANGEREQUIRED: "false"
      ZITADEL_FIRSTINSTANCE_LOGINCLIENTPATPATH: /zitadel-bootstrap/login-client.pat
      ZITADEL_FIRSTINSTANCE_ORG_LOGINCLIENT_MACHINE_USERNAME: login-client
      ZITADEL_FIRSTINSTANCE_ORG_LOGINCLIENT_MACHINE_NAME: Chelabase auth
      ZITADEL_FIRSTINSTANCE_ORG_LOGINCLIENT_PAT_EXPIRATIONDATE: "2099-01-01T00:00:00Z"
      ZITADEL_DEFAULTINSTANCE_FEATURES_LOGINV2_REQUIRED: "true"
      # The login UI is Studio, at its public origin (scheme and CHELABASE_STUDIO_HOST).
      ZITADEL_DEFAULTINSTANCE_FEATURES_LOGINV2_BASEURI: "${CHELABASE_PUBLIC_SCHEME:?set by chelabase workbench (stack.env)}://${CHELABASE_STUDIO_HOST:?set by chelabase workbench (stack.env)}/"
      ZITADEL_OIDC_DEFAULTLOGINURLV2: "${CHELABASE_PUBLIC_SCHEME}://${CHELABASE_STUDIO_HOST}/login?authRequest="
      ZITADEL_OIDC_DEFAULTLOGOUTURLV2: "${CHELABASE_PUBLIC_SCHEME}://${CHELABASE_STUDIO_HOST}/logout?post_logout_redirect="
      # Actions call the orchestrator by service name (a private address on the stack network,
      # allowed); loopback and link-local stay blocked.
      ZITADEL_HTTPCLIENT_DENYLIST: "localhost,0.0.0.0/8,127.0.0.0/8,169.254.0.0/16,::1/128"
    depends_on:
      zitadel-db:
        condition: service_healthy
    volumes:
      - type: bind
        source: ${CHELABASE_STACK_DIR}/zitadel
        target: /zitadel-bootstrap
    # The image has no shell or HTTP client; `zitadel ready` asks its own /debug/ready.
    healthcheck:
      test: ["CMD", "/app/zitadel", "ready"]
      interval: 5s
      timeout: 5s
      retries: 60
      start_period: 30s

  # Local mail catcher: Zitadel's emails (invites, resets, verification codes) land here; its UI
  # is the stack's mail host, through the gateway.
  mailpit:
    image: axllent/mailpit:v1.31.3@sha256:ed9b00c609e77e99c79b93f1178255ebc271868920f2c69a8d166bd5634ed10d
    restart: unless-stopped
    environment:
      # Zitadel needs SMTP credentials (it can't handle an empty password), so
      # accept any user/password over plain SMTP. Local dev only.
      MP_SMTP_AUTH_ACCEPT_ANY: "true"
      MP_SMTP_AUTH_ALLOW_INSECURE: "true"
    # `mailpit readyz` asks the server's /readyz (the image has no HTTP client of its own).
    healthcheck:
      test: ["CMD", "/mailpit", "readyz"]
      interval: 2s
      timeout: 5s
      retries: 30

  # --- Neon storage ------------------------------------------------------
  # Flags and health checks come from the old cheladb repo's core/docker/docker-compose.yml,
  # checked there against the pinned Neon source.

  # All-in-one SeaweedFS (master, volume, filer, S3) for pageserver layers and safekeeper WAL.
  seaweedfs:
    image: chrislusf/seaweedfs:4.47@sha256:ce9e796f1fe6f06968f4c04bdaf8f678dad9c8acdfef3d244133d71bfa6bf882
    restart: unless-stopped
    entrypoint: ["/bin/sh", "-c"]
    command:
      - |
        cat > /tmp/s3.json <<EOT
        {"identities": [{"name": "neon",
          "credentials": [{"accessKey": "chelabase-dev", "secretKey": "chelabase-dev-secret"}],
          "actions": ["Admin", "Read", "Write", "List", "Tagging"]}]}
        EOT
        exec weed server -s3 -s3.config=/tmp/s3.json -dir=/data -volume.max=64 -master.volumeSizeLimitMB=1024
    volumes:
      - neon_seaweedfs_data:/data
    healthcheck:
      test: ["CMD", "nc", "-z", "127.0.0.1", "8333"]
      interval: 2s
      retries: 60

  create-bucket:
    image: *neon-image
    restart: "no"
    environment: *neon-s3-env
    entrypoint: ["/bin/sh", "-c"]
    command:
      - |
        for i in $$(seq 60); do
          aws --endpoint-url http://seaweedfs:8333 s3 mb s3://neon 2>/dev/null ||
            aws --endpoint-url http://seaweedfs:8333 s3 ls s3://neon >/dev/null && exit 0
          sleep 2
        done
        exit 1
    depends_on:
      seaweedfs:
        condition: service_healthy

  storage-broker:
    image: *neon-image
    restart: unless-stopped
    command: ["storage_broker", "--listen-addr=0.0.0.0:50051"]
    healthcheck:
      test: ["CMD", "bash", "-c", "</dev/tcp/127.0.0.1/50051"]
      interval: 2s
      retries: 60

  # Three safekeepers, each with its WAL on its own volume: the storage controller runs without
  # --dev, which needs every timeline on 3 (RT1 T1, user). The worker reads each timeline's
  # commit LSN from their HTTP APIs (CHELABASE_SAFEKEEPER_HTTP, by service name). NeonJWT on the
  # WAL service and the HTTP API (the compute presents its tenant token, the pageserver and the
  # storage controller safekeeperdata); peers use safekeeperdata too. On the compute network:
  # computes stream WAL to them.
  safekeeper1:
    image: *neon-image
    restart: unless-stopped
    user: "0"
    entrypoint: *neon-as-stack-user
    environment: *neon-s3-env
    command:
      - safekeeper
      - --id=1
      - -D
      - /data
      - --listen-pg=0.0.0.0:5454
      - --listen-http=0.0.0.0:7676
      - --advertise-pg=safekeeper1:5454
      - --availability-zone=az-1
      - --broker-endpoint=http://storage-broker:50051
      - "--remote-storage={endpoint='http://seaweedfs:8333', bucket_name='neon', bucket_region='us-east-1', prefix_in_bucket='/safekeeper/'}"
      - --pg-auth-public-key-path=/run/storage-auth.pub.pem
      - --http-auth-public-key-path=/run/storage-auth.pub.pem
      - --auth-token-path=/run/safekeeper-data.jwt
    networks:
      default: {}
      compute: {}
    volumes:
      - neon_safekeeper1_data:/data
      - *run-storage-pem
      - *run-safekeeper-data
    healthcheck:
      test: ["CMD", "curl", "-fsS", "http://127.0.0.1:7676/v1/status"]
      interval: 2s
      retries: 60
    depends_on:
      storage-broker:
        condition: service_healthy
      create-bucket:
        condition: service_completed_successfully

  safekeeper2:
    image: *neon-image
    restart: unless-stopped
    user: "0"
    entrypoint: *neon-as-stack-user
    environment: *neon-s3-env
    command:
      - safekeeper
      - --id=2
      - -D
      - /data
      - --listen-pg=0.0.0.0:5454
      - --listen-http=0.0.0.0:7676
      - --advertise-pg=safekeeper2:5454
      - --availability-zone=az-2
      - --broker-endpoint=http://storage-broker:50051
      - "--remote-storage={endpoint='http://seaweedfs:8333', bucket_name='neon', bucket_region='us-east-1', prefix_in_bucket='/safekeeper/'}"
      - --pg-auth-public-key-path=/run/storage-auth.pub.pem
      - --http-auth-public-key-path=/run/storage-auth.pub.pem
      - --auth-token-path=/run/safekeeper-data.jwt
    networks:
      default: {}
      compute: {}
    volumes:
      - neon_safekeeper2_data:/data
      - *run-storage-pem
      - *run-safekeeper-data
    healthcheck:
      test: ["CMD", "curl", "-fsS", "http://127.0.0.1:7676/v1/status"]
      interval: 2s
      retries: 60
    depends_on:
      storage-broker:
        condition: service_healthy
      create-bucket:
        condition: service_completed_successfully

  safekeeper3:
    image: *neon-image
    restart: unless-stopped
    user: "0"
    entrypoint: *neon-as-stack-user
    environment: *neon-s3-env
    command:
      - safekeeper
      - --id=3
      - -D
      - /data
      - --listen-pg=0.0.0.0:5454
      - --listen-http=0.0.0.0:7676
      - --advertise-pg=safekeeper3:5454
      - --availability-zone=az-3
      - --broker-endpoint=http://storage-broker:50051
      - "--remote-storage={endpoint='http://seaweedfs:8333', bucket_name='neon', bucket_region='us-east-1', prefix_in_bucket='/safekeeper/'}"
      - --pg-auth-public-key-path=/run/storage-auth.pub.pem
      - --http-auth-public-key-path=/run/storage-auth.pub.pem
      - --auth-token-path=/run/safekeeper-data.jwt
    networks:
      default: {}
      compute: {}
    volumes:
      - neon_safekeeper3_data:/data
      - *run-storage-pem
      - *run-safekeeper-data
    healthcheck:
      test: ["CMD", "curl", "-fsS", "http://127.0.0.1:7676/v1/status"]
      interval: 2s
      retries: 60
    depends_on:
      storage-broker:
        condition: service_healthy
      create-bucket:
        condition: service_completed_successfully

  storcon-db:
    image: postgres:17.11-alpine@sha256:b0f9560a2de083e2cc7382e75f808c7381a32852a7ec49117deedb300e552b24
    restart: unless-stopped
    environment:
      # Local dev only.
      POSTGRES_USER: storcon
      POSTGRES_PASSWORD: storcon
      POSTGRES_DB: storage_controller
    volumes:
      - neon_storcon_pg_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U storcon -d storage_controller"]
      interval: 2s
      retries: 60

  # Strict mode (no --dev, RT1 T1 user decision): every caller presents a NeonJWT signed with the
  # compute-JWT key pair (PUBLIC_KEY); it presents scoped tokens to the pageserver and the
  # safekeepers, and the generated hook token to the orchestrator. The secrets are read from
  # their mounts by the entrypoint into the environment (the controller reads each one there
  # when its flag is absent; a program's arguments are world-readable); the flags stay in
  # `command`.
  storage-controller:
    image: *neon-image
    restart: unless-stopped
    user: "${CHELABASE_UID}:${CHELABASE_GID}"
    entrypoint:
      - /bin/sh
      - -c
      - >-
        set -e;
        export PUBLIC_KEY="$$(cat /run/storage-auth.pub.pem)";
        export PAGESERVER_JWT_TOKEN="$$(cat /run/pageserver-api.jwt)";
        export SAFEKEEPER_JWT_TOKEN="$$(cat /run/safekeeper-data.jwt)";
        export CONTROL_PLANE_JWT_TOKEN="$$(cat /run/storcon-hook.token)";
        exec storage_controller "$$@"
      - storage_controller
    command:
      - --listen=0.0.0.0:1234
      # Attachment changes (every tenant create, too) are pushed to the orchestrator's
      # internal listener, by service name; a tenant's reconcile waits until it answers.
      - --control-plane-url=http://orchestrator:8083/storcon
      - --database-url=postgresql://storcon:storcon@storcon-db:5432/storage_controller
      # The controller creates and deletes each timeline on the safekeepers (all three).
      # Without these, the compute creates them implicitly and a deleted database, branch or
      # superseded timeline leaves its WAL on the safekeepers and in S3.
      - --timelines-onto-safekeepers
      - --timeline-safekeeper-count=3
    volumes:
      - type: bind
        source: ${CHELABASE_KEYS_DIR}/tokens/storcon-hook.token
        target: /run/storcon-hook.token
        read_only: true
        bind: {create_host_path: false}
      - *run-storage-pem
      - type: bind
        source: ${CHELABASE_KEYS_DIR}/neon/storage-tokens/pageserver-api.jwt
        target: /run/pageserver-api.jwt
        read_only: true
        bind: {create_host_path: false}
      - *run-safekeeper-data
    healthcheck:
      test: ["CMD", "curl", "-fsS", "http://127.0.0.1:1234/ready"]
      interval: 2s
      retries: 60
    depends_on:
      storcon-db:
        condition: service_healthy

  # Registers with the storage controller from metadata.json at startup. NeonJWT on its page
  # service and HTTP API (RT1 T1, user): computes present their tenant token, the storage
  # controller pageserverapi. Its upcalls carry generations_api, its WAL reads from the
  # safekeepers safekeeperdata (NEON_AUTH_TOKEN). On the compute network: computes read pages.
  pageserver:
    image: *neon-image
    restart: unless-stopped
    user: "0"
    entrypoint: *neon-as-stack-user
    environment: *neon-s3-env
    command:
      - /bin/sh
      - -c
      - |
        set -e
        mkdir -p /data/.neon
        echo 'id=1' > /data/.neon/identity.toml
        umask 077
        cat > /data/.neon/pageserver.toml <<EOT
        broker_endpoint='http://storage-broker:50051'
        pg_distrib_dir='/usr/local/'
        listen_pg_addr='0.0.0.0:6400'
        listen_http_addr='0.0.0.0:9898'
        http_auth_type='NeonJWT'
        pg_auth_type='NeonJWT'
        auth_validation_public_key_path='/run/storage-auth.pub.pem'
        control_plane_api='http://storage-controller:1234/upcall/v1/'
        control_plane_api_token='$$(cat /run/generations-api.jwt)'
        virtual_file_io_mode='buffered'
        remote_storage={ endpoint='http://seaweedfs:8333', bucket_name='neon', bucket_region='us-east-1', prefix_in_bucket='/pageserver' }
        EOT
        echo '{"host":"pageserver","port":6400,"http_host":"pageserver","http_port":9898,"availability_zone_id":"az-1"}' > /data/.neon/metadata.json
        NEON_AUTH_TOKEN="$$(cat /run/safekeeper-data.jwt)"
        export NEON_AUTH_TOKEN
        exec pageserver -D /data/.neon
    networks:
      default: {}
      compute: {}
    volumes:
      - neon_pageserver_data:/data
      - *run-storage-pem
      - type: bind
        source: ${CHELABASE_KEYS_DIR}/neon/storage-tokens/generations-api.jwt
        target: /run/generations-api.jwt
        read_only: true
        bind: {create_host_path: false}
      - *run-safekeeper-data
    healthcheck:
      test: ["CMD", "curl", "-fsS", "http://127.0.0.1:9898/v1/status"]
      interval: 2s
      retries: 60
    depends_on:
      storage-broker:
        condition: service_healthy
      storage-controller:
        condition: service_healthy
      create-bucket:
        condition: service_completed_successfully

  # One-shot: registers the three safekeepers with the storage controller (with its admin
  # NeonJWT) and marks them Active; computes get them from the storage controller.
  register-safekeepers:
    image: *neon-image
    restart: "no"
    user: "${CHELABASE_UID}:${CHELABASE_GID}"
    entrypoint: ["/bin/sh", "-c"]
    command:
      - |
        set -e
        S=http://storage-controller:1234
        # The bearer goes to curl in a header file (`-H @file`), never on its command line.
        umask 077
        H="$$(mktemp)"
        trap 'rm -f "$$H"' EXIT
        { printf 'Authorization: Bearer '; tr -d '\r\n' < /run/storcon-admin.jwt; echo; } > "$$H"
        for ID in 1 2 3; do
          curl -fsS -X POST -H 'Content-Type: application/json' -H "@$$H" \
            -d "{\"id\":$$ID,\"created_at\":\"2023-10-25T09:11:25Z\",\"updated_at\":\"2024-08-28T11:32:43Z\",\"region_id\":\"local\",\"host\":\"safekeeper$$ID\",\"port\":5454,\"http_port\":7676,\"https_port\":null,\"version\":5957,\"availability_zone_id\":\"az-$$ID\"}" \
            $$S/control/v1/safekeeper/$$ID
          curl -fsS -X POST -H 'Content-Type: application/json' -H "@$$H" \
            -d '{"scheduling_policy":"Active"}' $$S/control/v1/safekeeper/$$ID/scheduling_policy
        done
    volumes:
      - type: bind
        source: ${CHELABASE_KEYS_DIR}/neon/storage-tokens/storcon-admin.jwt
        target: /run/storcon-admin.jwt
        read_only: true
        bind: {create_host_path: false}
    depends_on:
      storage-controller:
        condition: service_healthy
      safekeeper1:
        condition: service_healthy
      safekeeper2:
        condition: service_healthy
      safekeeper3:
        condition: service_healthy

  # Writes the proxy's TLS certificate once: a local CA and a *.localtest.me certificate signed
  # by it. Clients verify against the CA; `chelabase workbench up` copies it to
  # <state>/neon/proxy-ca.crt.
  proxy-tls:
    image: *neon-image
    restart: "no"
    user: "0"
    entrypoint: ["/bin/sh", "-c"]
    command:
      - |
        set -e
        cd /tls
        # The proxy runs as the stack's uid (it reads the stack's 0600 secrets too).
        owner="${CHELABASE_UID}:${CHELABASE_GID}"
        if [ -s tls.crt ] && openssl x509 -in tls.crt -noout -subject | grep -qF '*.localtest.me'; then
          chown "$$owner" tls.key tls.crt ca.crt
          echo "certificate for *.localtest.me exists"; exit 0
        fi
        [ -s ca.key ] || openssl req -x509 -newkey ec -pkeyopt ec_paramgen_curve:P-256 -nodes \
          -keyout ca.key -out ca.crt -days 3650 -subj "/CN=Chelabase local CA"
        openssl req -newkey ec -pkeyopt ec_paramgen_curve:P-256 -nodes -keyout tls.key -out tls.csr \
          -subj "/CN=*.localtest.me"
        printf 'subjectAltName=DNS:*.localtest.me\n' > ext.cnf
        openssl x509 -req -in tls.csr -CA ca.crt -CAkey ca.key -CAcreateserial -days 825 \
          -extfile ext.cnf -out tls.crt
        rm -f tls.csr ext.cnf
        chown "$$owner" tls.key tls.crt ca.crt
        chmod 600 ca.key tls.key
        echo "issued a certificate for *.localtest.me"
    volumes: ["neon_proxy_tls:/tls"]
    network_mode: none

  # Neon's proxy. Clients connect to <endpoint-id>.localtest.me (which resolves to 127.0.0.1):
  # Postgres wire on the stack's proxy port (4432 inside); WebSocket and SQL over HTTP on 4444,
  # inside the stack's network only. It asks the orchestrator's internal listener for role
  # secrets and compute addresses, and reaches computes on this network. Role secrets are cached
  # for at most a minute, and dropped at once when the control plane publishes
  # /password_updated to Valkey.
  # RT1 T1 (S6, S27): it logs in to Valkey as the `proxy` ACL user and calls the orchestrator
  # with its generated token; the entrypoint reads both from their mounts (the proxy takes the
  # Valkey credentials only on its command line). On the compute network: it dials computes.
  proxy:
    image: *neon-image
    restart: unless-stopped
    user: "${CHELABASE_UID}:${CHELABASE_GID}"
    entrypoint:
      - /bin/sh
      - -c
      - >-
        export NEON_PROXY_TO_CONTROLPLANE_TOKEN="$$(cat /run/proxy-api.token)";
        exec proxy --redis-plain=redis://proxy:$$(cat /run/valkey-proxy.password)@valkey:6379 "$$@"
      - proxy
    command:
      - --auth-backend=control-plane
      - --auth-endpoint=http://orchestrator:8083/proxy/api/v1
      - --proxy=0.0.0.0:4432
      - --wss=0.0.0.0:4444
      # The proxy takes the endpoint domain from the certificate's CN.
      - --tls-cert=/tls/tls.crt
      - --tls-key=/tls/tls.key
      - --project-info-cache=size=10000,ttl=1m,max_roles=64,gc_interval=60m
      - --redis-auth-type=plain
    ports:
      - "127.0.0.1:${CHELABASE_PROXY_PORT:?set by chelabase workbench (stack.env)}:4432"
      - "[::1]:${CHELABASE_PROXY_PORT}:4432"
    networks:
      default: {}
      compute: {}
    volumes:
      - neon_proxy_tls:/tls:ro
      - type: bind
        source: ${CHELABASE_KEYS_DIR}/valkey/proxy.password
        target: /run/valkey-proxy.password
        read_only: true
        bind: {create_host_path: false}
      - type: bind
        source: ${CHELABASE_KEYS_DIR}/tokens/proxy-api.token
        target: /run/proxy-api.token
        read_only: true
        bind: {create_host_path: false}
    healthcheck:
      test: ["CMD", "bash", "-c", "</dev/tcp/127.0.0.1/4432"]
      interval: 2s
      retries: 60
    depends_on:
      proxy-tls:
        condition: service_completed_successfully
      # The proxy exits if it can't reach Redis at startup.
      valkey:
        condition: service_healthy

  # --- The app tier: the checkout's host-built debug binaries in the workbench image ---------
  # Listeners bind 0.0.0.0 inside and every URL is a service name (stack.env). The gateway is the
  # one way in from the host.

  orchestrator:
    <<: *workbench
    command: ["${CHELABASE_CHECKOUT}/target/debug/orchestrator"]
    env_file:
      - *stack-env
      - *demo-env
      - path: ${CHELABASE_STACK_DIR}/zitadel/actions.env
        required: false
    environment:
      # Connection strings name the proxy's published port on the host.
      - CHELABASE_PROXY_PG_PORT=${CHELABASE_PROXY_PORT}
      # Bare names: taken from the caller's env, unset when it has none. The runner's live tests
      # recreate the orchestrator with these to exercise the settings (roles_live).
      - CHELABASE_PASSWORD_STRENGTH
      - CHELABASE_BRANCH_DATABASE_CAP
      # RT1 T1 (S1, S27): its own credentials, from its own mounts below.
      - CHELABASE_NATS_USER=orchestrator
      - CHELABASE_NATS_PASSWORD_FILE=${CHELABASE_KEYS_DIR}/nats/orchestrator.password
      - CHELABASE_NATS_INBOX_PREFIX=_INBOX_orchestrator
      - CHELABASE_VALKEY_USER=control
      - CHELABASE_VALKEY_PASSWORD_FILE=${CHELABASE_KEYS_DIR}/valkey/control.password
      - CHELABASE_REALTIME_INTERNAL_TOKEN_FILE=${CHELABASE_KEYS_DIR}/realtime/internal.token
      - CHELABASE_REST_INTERNAL_TOKEN_FILE=${CHELABASE_KEYS_DIR}/tokens/rest-internal.token
      - CHELABASE_DATA_KEYS_TOKEN_FILE=${CHELABASE_KEYS_DIR}/tokens/data-keys.token
      - CHELABASE_APP_AUTH_INTERNAL_TOKEN_FILE=${CHELABASE_KEYS_DIR}/tokens/app-auth.token
      - CHELABASE_APP_SESSIONS_INTERNAL_TOKEN_FILE=${CHELABASE_KEYS_DIR}/tokens/app-sessions.token
      - CHELABASE_PROXY_API_TOKEN_FILE=${CHELABASE_KEYS_DIR}/tokens/proxy-api.token
      - CHELABASE_STORCON_HOOK_TOKEN_FILE=${CHELABASE_KEYS_DIR}/tokens/storcon-hook.token
    group_add: ["${CHELABASE_DOCKER_GID:?set by chelabase workbench (stack.env)}"]
    # The default network for the apps, `control` (static address) for its TLS connections to
    # computes, and `compute` (P4): computes call its hooks listener (8083) as `orchestrator`.
    networks:
      default: {}
      control:
        ipv4_address: ${CHELABASE_ORCHESTRATOR_CONTROL_IP:?set by chelabase workbench (stack.env)}
      compute: {}
    volumes:
      - *checkout-ro
      - *keys-mask
      - *checkout-mask
      - *key-secrets
      - *key-internal-verify
      - *key-compute-jwt-private
      - *key-compute-jwt-public
      - *keys-orchestrator-tls-ro
      - *key-nats-orchestrator
      - *key-valkey-control
      - *key-realtime-internal
      - *key-token-rest-internal
      - *key-token-data-keys
      - *key-token-app-auth
      - *key-token-app-sessions
      - *key-token-proxy-api
      - *key-token-storcon-hook
      - *state
      - *docker-sock
    healthcheck:
      <<: *app-health
      test: ["CMD-SHELL", "curl -fsS http://127.0.0.1:8081/health && curl -fsS http://127.0.0.1:8083/health"]
    depends_on:
      metadata-db:
        condition: service_healthy
      nats:
        condition: service_healthy
      valkey:
        condition: service_healthy
      storage-controller:
        condition: service_healthy
      zitadel:
        condition: service_healthy

  worker:
    <<: *workbench
    command: ["${CHELABASE_CHECKOUT}/target/debug/worker"]
    env_file:
      - *stack-env
      - *demo-env
    # RT1 T1 (S1): its own credentials, from its own mounts below.
    environment:
      - CHELABASE_NATS_USER=worker
      - CHELABASE_NATS_PASSWORD_FILE=${CHELABASE_KEYS_DIR}/nats/worker.password
      - CHELABASE_NATS_INBOX_PREFIX=_INBOX_worker
      - CHELABASE_VALKEY_USER=control
      - CHELABASE_VALKEY_PASSWORD_FILE=${CHELABASE_KEYS_DIR}/valkey/control.password
      - CHELABASE_REALTIME_PG_PASSWORD_FILE=${CHELABASE_KEYS_DIR}/realtime/pg.password
    group_add: ["${CHELABASE_DOCKER_GID}"]
    # P4: it dials computes (compute_ctl) on the compute network.
    networks:
      default: {}
      compute: {}
    volumes:
      - *checkout-ro
      - *keys-mask
      - *checkout-mask
      - *key-secrets
      - *key-compute-jwt-private
      - *key-compute-jwt-public
      - *keys-compute-ca-rw
      - *keys-orchestrator-tls-rw
      - *key-nats-worker
      - *key-valkey-control
      - *key-realtime-pg
      - *state
      - *docker-sock
    healthcheck:
      <<: *app-health
      test: ["CMD", "curl", "-fsS", "http://127.0.0.1:8082/health"]
    depends_on:
      metadata-db:
        condition: service_healthy
      nats:
        condition: service_healthy
      valkey:
        condition: service_healthy
      storage-controller:
        condition: service_healthy
      pageserver:
        condition: service_healthy
      safekeeper1:
        condition: service_healthy
      safekeeper2:
        condition: service_healthy
      safekeeper3:
        condition: service_healthy
      register-safekeepers:
        condition: service_completed_successfully
      zitadel:
        condition: service_healthy

  # The front door. It listens on the stack's gateway port inside too (CHELABASE_GATEWAY_LISTEN)
  # and answers every host of its stack on the network (the aliases), so one URL works from the
  # host, from an app container and from the runner. It starts before its backends (502 until
  # they come up).
  gateway:
    <<: *workbench
    command: ["${CHELABASE_CHECKOUT}/target/debug/gateway"]
    env_file:
      - *stack-env
      - *demo-env
    # RT1 T1 (S27): the bearers it sends to the orchestrator's internal listener.
    environment:
      - CHELABASE_DATA_KEYS_TOKEN_FILE=${CHELABASE_KEYS_DIR}/tokens/data-keys.token
      - CHELABASE_APP_SESSIONS_INTERNAL_TOKEN_FILE=${CHELABASE_KEYS_DIR}/tokens/app-sessions.token
    ports:
      - "127.0.0.1:${CHELABASE_GATEWAY_PORT:?set by chelabase workbench (stack.env)}:${CHELABASE_GATEWAY_PORT}"
      - "[::1]:${CHELABASE_GATEWAY_PORT}:${CHELABASE_GATEWAY_PORT}"
    networks:
      default:
        aliases:
          - ${CHELABASE_STUDIO_HOST_NAME:?set by chelabase workbench (stack.env)}
          - ${CHELABASE_API_HOST_NAME:?set by chelabase workbench (stack.env)}
          - ${CHELABASE_AUTH_HOST_NAME}
          - ${CHELABASE_MAIL_HOST_NAME:?set by chelabase workbench (stack.env)}
          - ${CHELABASE_DOCS_HOST_NAME:?set by chelabase workbench (stack.env)}
          - ${CHELABASE_LANDING_HOST_NAME:?set by chelabase workbench (stack.env)}
    volumes:
      - *checkout-ro
      - *keys-mask
      - *checkout-mask
      - *key-internal-signing
      - *key-app-jwt-public
      - *key-token-data-keys
      - *key-token-app-sessions
      - *state
    healthcheck:
      <<: *app-health
      test: ["CMD", "curl", "-fsS", "http://127.0.0.1:${CHELABASE_GATEWAY_PORT}/_gateway/health"]
    depends_on:
      zitadel:
        condition: service_healthy
      mailpit:
        condition: service_healthy

  # Studio's sign-in backend. On the compute network (P4: the app-users sync dials computes), so
  # computes reach it directly: only the gateway's X-Forwarded-For counts
  # (CHELABASE_AUTH_TRUSTED_PROXY=gateway, ruling (e)).
  auth:
    <<: *workbench
    command: ["${CHELABASE_CHECKOUT}/target/debug/auth"]
    env_file:
      - *stack-env
      - *demo-env
    # RT1 T1 (S27): the bearer it sends to the orchestrator's internal app routes.
    environment:
      - CHELABASE_APP_AUTH_INTERNAL_TOKEN_FILE=${CHELABASE_KEYS_DIR}/tokens/app-auth.token
    networks:
      default: {}
      compute: {}
    volumes:
      - *checkout-ro
      - *keys-mask
      - *checkout-mask
      - *key-cookie
      - *key-app-jwt-private
      - *key-app-jwt-public
      - *key-internal-verify
      - *key-compute-ca-cert
      - *key-token-app-auth
      - *state
    # auth has no health route: any HTTP answer (even a 404) means it is serving.
    healthcheck:
      <<: *app-health
      test: ["CMD", "curl", "-sS", "-o", "/dev/null", "http://127.0.0.1:8084/"]
    depends_on:
      zitadel:
        condition: service_healthy

  rest:
    <<: *workbench
    command: ["${CHELABASE_CHECKOUT}/target/debug/rest"]
    env_file:
      - *stack-env
      - *demo-env
    # RT1 T1 (S27): its internal bearer (both ways with the orchestrator).
    environment:
      - CHELABASE_REST_INTERNAL_TOKEN_FILE=${CHELABASE_KEYS_DIR}/tokens/rest-internal.token
    # P4: the data API dials computes on the compute network.
    networks:
      default: {}
      compute: {}
    volumes:
      - *checkout-ro
      - *keys-mask
      - *checkout-mask
      - *key-internal-verify
      - *key-compute-ca-cert
      - *key-token-rest-internal
      - *state
    # rest has no health route: any HTTP answer (even a 404) means it is serving.
    healthcheck:
      <<: *app-health
      test: ["CMD", "curl", "-sS", "-o", "/dev/null", "http://127.0.0.1:8085/"]
    depends_on:
      metadata-db:
        condition: service_healthy

  # RT1 T7: tickets and the one WebSocket per tab, behind the gateway (8087); 8088 serves only
  # /health. It reads demo.env for the OIDC audiences, as the gateway does, and verifies the
  # gateway's identity on ticket requests.
  realtime:
    <<: *workbench
    command: ["${CHELABASE_CHECKOUT}/target/debug/realtime"]
    env_file:
      - *stack-env
      - *demo-env
    # S1: its own credentials and secrets, from its own mounts below; Valkey TLS is platform
    # mode's (S7).
    environment:
      - CHELABASE_NATS_USER=realtime
      - CHELABASE_NATS_PASSWORD_FILE=${CHELABASE_KEYS_DIR}/nats/realtime.password
      - CHELABASE_NATS_INBOX_PREFIX=_INBOX_realtime
      - CHELABASE_VALKEY_USER=realtime
      - CHELABASE_VALKEY_PASSWORD_FILE=${CHELABASE_KEYS_DIR}/valkey/realtime.password
      - CHELABASE_VALKEY_TLS=off
      - CHELABASE_REALTIME_PG_PASSWORD_FILE=${CHELABASE_KEYS_DIR}/realtime/pg.password
      - CHELABASE_REALTIME_TICKET_KEY_FILE=${CHELABASE_KEYS_DIR}/realtime/ticket.key
      - CHELABASE_REALTIME_INTERNAL_TOKEN_FILE=${CHELABASE_KEYS_DIR}/realtime/internal.token
    # P4: T8's replication and check connections dial computes on the compute network.
    networks:
      default: {}
      compute: {}
    volumes:
      - *checkout-ro
      - *keys-mask
      - *checkout-mask
      - *key-internal-verify
      - *key-compute-ca-cert
      - *key-nats-realtime
      - *key-valkey-realtime
      - *key-realtime-pg
      - *key-realtime-ticket
      - *key-realtime-internal
      - *state
    healthcheck:
      <<: *app-health
      test: ["CMD", "curl", "-fsS", "http://127.0.0.1:8088/health"]
    depends_on:
      nats:
        condition: service_healthy
      valkey:
        condition: service_healthy

  # Vite dev servers from the checkout (read-write: Vite's cache lives under node_modules), bound
  # to 0.0.0.0 (CHELABASE_*_BIND) and reached through the gateway; HMR goes through it too.
  studio:
    <<: *workbench
    command: ["pnpm", "--filter", "@chelabase/studio", "dev"]
    env_file:
      - *stack-env
      - path: ${CHELABASE_STACK_DIR}/studio.env
        required: false
    environment:
      CHELABASE_STUDIO_PORT: "3000"
    volumes:
      - *checkout-rw
      - *keys-mask
      - *checkout-mask
    healthcheck:
      <<: *app-health
      test: ["CMD", "curl", "-fsS", "-o", "/dev/null", "-H", "Host: ${CHELABASE_STUDIO_HOST_NAME}", "http://127.0.0.1:3000/"]

  docs:
    <<: *workbench
    profiles: ["sites"]
    command: ["pnpm", "--filter", "@chelabase/docs", "dev"]
    env_file:
      - *stack-env
    volumes:
      - *checkout-rw
      - *keys-mask
      - *checkout-mask
    healthcheck:
      <<: *app-health
      test: ["CMD", "curl", "-fsS", "-o", "/dev/null", "-H", "Host: ${CHELABASE_DOCS_HOST_NAME}", "http://127.0.0.1:3001/"]

  landing:
    <<: *workbench
    profiles: ["sites"]
    command: ["pnpm", "--filter", "@chelabase/landing", "dev"]
    env_file:
      - *stack-env
    volumes:
      - *checkout-rw
      - *keys-mask
      - *checkout-mask
    healthcheck:
      <<: *app-health
      test: ["CMD", "curl", "-fsS", "-o", "/dev/null", "-H", "Host: ${CHELABASE_LANDING_HOST_NAME}", "http://127.0.0.1:3002/"]

  # The test runner (`chelabase workbench test` / `run`, through `compose run --rm`): live tests
  # and e2e scripts on the stack's network, by service name. The CLI points CHELABASE_NEXTEST_BIN
  # at the host's cargo-nextest.
  runner:
    <<: *workbench
    profiles: ["runner"]
    restart: "no"
    entrypoint: []
    env_file:
      - *stack-env
      - *demo-env
    environment:
      # Bare names: a live test's own input, taken from the caller's env (unset when it has none),
      # e.g. `CHELABASE_LIVE_ENDPOINT=ep-… just workbench test -p chelabase-neon …`.
      - CHELABASE_LIVE_ENDPOINT
      # RT1 T1 (S1, S27, ruling (c)): the test harness runs the worker, the orchestrator and
      # realtime in-process (S24) and probes every user's rights, so it sees every service
      # secret (it has the Docker socket anyway). Its own NATS and Valkey users: `runner`.
      - CHELABASE_NATS_USER=runner
      - CHELABASE_NATS_PASSWORD_FILE=${CHELABASE_KEYS_DIR}/nats/runner.password
      - CHELABASE_NATS_INBOX_PREFIX=_INBOX_runner
      - CHELABASE_VALKEY_USER=runner
      - CHELABASE_VALKEY_PASSWORD_FILE=${CHELABASE_KEYS_DIR}/valkey/runner.password
      - CHELABASE_REALTIME_PG_PASSWORD_FILE=${CHELABASE_KEYS_DIR}/realtime/pg.password
      - CHELABASE_REALTIME_TICKET_KEY_FILE=${CHELABASE_KEYS_DIR}/realtime/ticket.key
      - CHELABASE_REALTIME_INTERNAL_TOKEN_FILE=${CHELABASE_KEYS_DIR}/realtime/internal.token
      - CHELABASE_REST_INTERNAL_TOKEN_FILE=${CHELABASE_KEYS_DIR}/tokens/rest-internal.token
      - CHELABASE_DATA_KEYS_TOKEN_FILE=${CHELABASE_KEYS_DIR}/tokens/data-keys.token
      - CHELABASE_APP_AUTH_INTERNAL_TOKEN_FILE=${CHELABASE_KEYS_DIR}/tokens/app-auth.token
      - CHELABASE_APP_SESSIONS_INTERNAL_TOKEN_FILE=${CHELABASE_KEYS_DIR}/tokens/app-sessions.token
      - CHELABASE_PROXY_API_TOKEN_FILE=${CHELABASE_KEYS_DIR}/tokens/proxy-api.token
      - CHELABASE_STORCON_HOOK_TOKEN_FILE=${CHELABASE_KEYS_DIR}/tokens/storcon-hook.token
    group_add: ["${CHELABASE_DOCKER_GID}"]
    # The static address is in the member-login rule's address list. On the compute network:
    # live tests dial computes like the services do.
    networks:
      default: {}
      control:
        ipv4_address: ${CHELABASE_RUNNER_CONTROL_IP:?set by chelabase workbench (stack.env)}
      compute: {}
    volumes:
      - *checkout-rw
      - *keys-mask
      - *checkout-mask
      - *key-secrets
      - *key-compute-jwt-private
      - *key-compute-jwt-public
      - *key-app-jwt-private
      - *key-app-jwt-public
      - *keys-compute-ca-ro
      - *keys-orchestrator-tls-ro
      - *key-nats-orchestrator
      - *key-nats-worker
      - *key-nats-realtime
      - *key-nats-runner
      - *key-valkey-proxy
      - *key-valkey-control
      - *key-valkey-realtime
      - *key-valkey-runner
      - *key-valkey-health
      - *key-realtime-pg
      - *key-realtime-ticket
      - *key-realtime-internal
      - *key-token-rest-internal
      - *key-token-data-keys
      - *key-token-app-auth
      - *key-token-app-sessions
      - *key-token-proxy-api
      - *key-token-storcon-hook
      - *key-storage-pem
      - *key-storage-pageserver-api
      - *key-storage-safekeeper-data
      - *key-storage-generations-api
      - *key-storage-storcon-admin
      - *state
      - *docker-sock
      - type: bind
        source: ${CHELABASE_NEXTEST_BIN:-/usr/local/bin/cargo-nextest}
        target: /usr/local/bin/cargo-nextest
        read_only: true

networks:
  # Orchestrator and test runner to computes (<project>_control). A fixed subnet per stack from
  # the registry's control slot; computes take addresses from the upper /23 only.
  control:
    ipam:
      config:
        - subnet: ${CHELABASE_CONTROL_SUBNET:?set by chelabase workbench (stack.env)}
          ip_range: ${CHELABASE_CONTROL_COMPUTE_RANGE:?set by chelabase workbench (stack.env)}
  # RT1 T1 (P4, W14): the computes' own network (<project>_compute, CHELABASE_COMPUTE_NETWORK).
  # On it: what a compute needs (pageserver, safekeepers, the orchestrator's hooks listener) and
  # the clients that dial computes (proxy, rest, auth, worker, orchestrator, runner; realtime
  # with T7). Never NATS, Valkey, a database, Zitadel, Mailpit, SeaweedFS, the storage broker or
  # controller, the gateway or Studio. Every listener of its members needs a credential or is
  # public by design (scripts/compute-network-e2e.sh audits each one).
  compute: {}

volumes:
  metadata_pg_data:
  nats_data:
  valkey_data:
  zitadel_pg_data:
  neon_seaweedfs_data:
  neon_pageserver_data:
  neon_safekeeper1_data:
  neon_safekeeper2_data:
  neon_safekeeper3_data:
  neon_storcon_pg_data:
  neon_proxy_tls:
