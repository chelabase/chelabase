  read_only: true
x-checkout-rw: &checkout-rw
  type: bind
  source: ${CHELABASE_CHECKOUT}
  target: ${CHELABASE_CHECKOUT}
# Machine keys, one file at its own path per service that reads it (U10): a service sees exactly
# the key files it reads and nothing else under the keys dir. `.chelabase` inside every checkout
# mount is masked first (an empty tmpfs; on the main stack the keys dir is that directory), then
# the narrow mounts go on top (Docker applies mounts by target depth). A missing file fails the
# start (create_host_path: false) instead of Docker making a directory.
# Both masks are read-only tmpfs. The first covers the keys dir itself: in a worktree
# `<checkout>/.chelabase` is a symlink to it, Docker follows the link, and it orders mounts by the
# unresolved target depth, so a mask at the link's path would tie with the key mounts and hide
# them; a mask at the (shallower) keys dir never does. The second covers `<checkout>/.chelabase`
# when that is a different directory; the CLI sets CHELABASE_CHECKOUT_MASK to its path then, and
# the default (the keys dir) makes it the same mount point as the first, which Compose merges.
x-keys-mask: &keys-mask
  type: tmpfs
  target: ${CHELABASE_KEYS_DIR:?set by chelabase workbench (stack.env)}
  read_only: true
x-checkout-mask: &checkout-mask
  type: tmpfs
  target: ${CHELABASE_CHECKOUT_MASK:-${CHELABASE_KEYS_DIR}}
  read_only: true
