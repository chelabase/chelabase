# A Chelabase stack: the infra, Neon storage and proxy, Zitadel and the app tier (orchestrator,
# worker, gateway, auth, rest, realtime, Studio), with their wiring: images, networks, volumes,
# secrets, credentials, healthchecks and dependencies.
#
# The workbench never uses this file alone: every `chelabase workbench` compose call passes
# `-p <project> -f <checkout>/infra/compose/docker-compose.yml
# -f <checkout>/infra/compose/docker-compose.workbench.yml --env-file <state>/env/stack.env`.
# The overlay holds every dev-loop piece (the workbench image, the checkout's debug binaries and
# Vite dev servers, the uid/gid and Docker group, checkout and state-dir mounts, the stack's
# ports and control subnet, its env files, Mailpit, the sites and the runner);
# scripts/tests/compose-overlay-equiv.sh checks the pair renders what the single file did.
# There is no `name:`; stack.env is rendered from .env.example plus the stack's own values.
#
# Per-service key files are Compose secrets (the top-level `secrets:` at the end; each service
# lists the ones it reads, with the target path): Compose binds the host file read-only at that
# path, and a missing file fails `up` instead of Docker making a directory.
#
# In the workbench, reachable from the host only through the gateway's port and the proxy's
# Postgres port (published by the overlay), each on 127.0.0.1 and ::1. Everything else talks over
# the project network by service name; computes get their own `compute` network (see `networks:`
# at the end). NATS, Valkey and the storage services require credentials (RT1 T1).

# --- Neon storage ---
# Pinned by digest; `chelabase workbench up` overrides these with a local `just neon-build` when
# present. The packages are public on ghcr.io (infra/neon/README.md).
x-neon-images:
  neon: &neon-image ${NEON_IMAGE:-ghcr.io/chelabase/neon-storage:0741b56deb67-dev@sha256:4a353f17adf0eab71d60164b92e67943880d4dc7b2c95ea73490d703bac84a2e}
  # The image of the compute containers the worker starts (CHELABASE_COMPUTE_IMAGE); pinned here.
  compute: ${COMPUTE_NODE_IMAGE:-ghcr.io/chelabase/neon-compute-v17:0741b56deb67-dev@sha256:64ff9618a88e4686cb3b77907c3efdda47b610631a993161c75afe04bc997a56}

# The Neon services that read the stack's 0600 secrets run as the stack's uid:gid (the files'
# owner), whatever the host uid is; the image's own user (uid 1000) can read them only when the
# host uid happens to be 1000. Those without a data volume set `user:`; the pageserver and the
# safekeepers start as root only to hand their data volume (created by the image as 1000:1000)
# to the stack's uid once, then drop to it before anything else runs.
x-neon-as-stack-user: &neon-as-stack-user
  - /bin/sh
  - -c
  - >-
    set -e;
    [ "$$(stat -c %u:%g /data)" = "${CHELABASE_UID}:${CHELABASE_GID}" ] ||
    chown -R "${CHELABASE_UID}:${CHELABASE_GID}" /data;
    exec setpriv --reuid="${CHELABASE_UID}" --regid="${CHELABASE_GID}" --clear-groups -- "$$@"
  - neon

# S3 credentials for SeaweedFS. Local dev only.
x-neon-s3-env: &neon-s3-env
  AWS_ACCESS_KEY_ID: chelabase-dev
  AWS_SECRET_ACCESS_KEY: chelabase-dev-secret
  AWS_DEFAULT_REGION: us-east-1

x-app-health: &app-health
  interval: 2s
  timeout: 5s
  retries: 30
  start_period: 60s

services:
  metadata-db:
    image: postgres:17.11-alpine@sha256:b0f9560a2de083e2cc7382e75f808c7381a32852a7ec49117deedb300e552b24
    restart: unless-stopped
    environment:
      POSTGRES_USER: chelabase
      POSTGRES_PASSWORD: chelabase
      POSTGRES_DB: chelabase_metadata
    volumes:
      - metadata_pg_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U chelabase -d chelabase_metadata"]
      interval: 5s
      timeout: 5s
      retries: 10

  nats:
    image: nats:2.15.0-alpine@sha256:ac8f88a6494bffc2c2a5289a0ca61cb28a9145c11ba5677cf24265d07f46d8d4
    restart: unless-stopped
    # RT1 T1 (R11): one account, one user per service with its own permissions and inbox prefix
    # (infra/compose/nats/nats.conf includes the users the workbench renders into the stack's
    # state dir: bcrypt hashes only). No anonymous access. Not on the compute network. The
    # workbench overlay mounts nats.conf and auth.conf at /etc/nats.
    command: ["-c", "/etc/nats/nats.conf", "--jetstream", "--store_dir=/data", "-m", "8222"]
    volumes:
      - nats_data:/data
    healthcheck:
      test: ["CMD", "wget", "-qO-", "http://localhost:8222/healthz"]
      interval: 5s
      timeout: 5s
      retries: 10

  # Valkey (BSD-3-Clause, speaks the Redis protocol). Neon's proxy uses it for query cancel and
  # for the cache-clearing messages the control plane publishes on a password change; realtime
  # keeps its tickets and counters in it. RT1 T1 (P5, S6): ACL users only (`default` off), from
  # the users file the workbench renders into the stack's state dir (SHA-256 hashes only). It runs
  # as the stack's uid to read that 0600 file; nothing is persisted (`--save ""`: every key is
  # short-lived). Not on the compute network. TLS is a platform-mode setting.
  valkey:
    image: valkey/valkey:9.1.2-alpine@sha256:48332870af354a799964c0012ae1194a0bf2bf894eb508f945810596dc2d8d11
    restart: unless-stopped
    user: "${CHELABASE_UID}:${CHELABASE_GID}"
    # The workbench overlay mounts users.acl at /etc/valkey.
    command: ["valkey-server", "--aclfile", "/etc/valkey/users.acl", "--save", "", "--appendonly", "no"]
    volumes:
      - valkey_data:/data
    secrets:
      - {source: valkey-health, target: /run/valkey-health.password}
    # Ruling (f): the healthcheck logs in as `health`, which may only PING.
    healthcheck:
      # The password goes through the environment (VALKEYCLI_AUTH), never valkey-cli's arguments.
      test: ["CMD-SHELL", "VALKEYCLI_AUTH=\"$$(cat /run/valkey-health.password)\" valkey-cli --no-auth-warning --user health ping | grep -qx PONG"]
      interval: 2s
      timeout: 5s
      retries: 30

  zitadel-db:
    image: postgres:17.11-alpine@sha256:b0f9560a2de083e2cc7382e75f808c7381a32852a7ec49117deedb300e552b24
    restart: unless-stopped
    environment:
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgres
    volumes:
      - zitadel_pg_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres"]
      interval: 5s
      timeout: 5s
      retries: 10

  # Zitadel v4: sign-in pages are Studio's own (/login …), served by auth. FirstInstance writes
  # admin.pat and login-client.pat once, on a fresh zitadel_pg_data volume, into the stack's
  # state dir. Its mount (the overlay's) is the whole <state>/zitadel directory (rw), which also
  # holds the bootstrap's demo.env, demo-sa.json and actions.env: that exposes nothing new to
  # Zitadel, which generated those secrets itself (the service account's key, the actions signing
  # key) and controls its own instance.
  zitadel:
    image: ghcr.io/zitadel/zitadel:v4.19.1@sha256:f98935f56505ec6fa3e6523261cd1b8ace0c622e16da4a45acd493cb472f003f
    restart: unless-stopped
    # Runs as the stack user so its PATs belong to the host user and the dir can be private.
    user: "${CHELABASE_UID}:${CHELABASE_GID}"
    command: start-from-init --masterkey "MasterkeyNeedsToHave32Characters" --tlsMode ${CHELABASE_ZITADEL_TLS_MODE:?set by chelabase workbench (stack.env)}
    environment:
      ZITADEL_DATABASE_POSTGRES_HOST: zitadel-db
      ZITADEL_DATABASE_POSTGRES_PORT: 5432
      ZITADEL_DATABASE_POSTGRES_DATABASE: zitadel
      ZITADEL_DATABASE_POSTGRES_USER_USERNAME: zitadel
      ZITADEL_DATABASE_POSTGRES_USER_PASSWORD: zitadel
      ZITADEL_DATABASE_POSTGRES_USER_SSL_MODE: disable
      ZITADEL_DATABASE_POSTGRES_ADMIN_USERNAME: postgres
      ZITADEL_DATABASE_POSTGRES_ADMIN_PASSWORD: postgres
      ZITADEL_DATABASE_POSTGRES_ADMIN_SSL_MODE: disable
      # Zitadel's public address is the stack's auth host (CHELABASE_AUTH_HOST), set apart here:
      # its name, the public port and whether the scheme is https. stack.env carries them (and
      # the TLS mode above); there are no defaults here.
      ZITADEL_EXTERNALSECURE: "${CHELABASE_PUBLIC_SECURE:?set by chelabase workbench (stack.env)}"
      ZITADEL_EXTERNALDOMAIN: "${CHELABASE_AUTH_HOST_NAME:?set by chelabase workbench (stack.env)}"
      ZITADEL_EXTERNALPORT: "${CHELABASE_PUBLIC_PORT:?set by chelabase workbench (stack.env)}"
      # The TLS mode is `disabled` or `external` (TLS ends at the gateway), so Zitadel serves
      # plain HTTP; `zitadel ready` (the healthcheck) reads this, not the start flag.
      ZITADEL_TLS_ENABLED: "false"
      # Zitadel's own registration is off: sign-up goes only through Chelabase's rules. (A volume
      # made before this setting gets it from `chelabase dev bootstrap`.)
      ZITADEL_DEFAULTINSTANCE_LOGINPOLICY_ALLOWREGISTER: "false"
      ZITADEL_FIRSTINSTANCE_PATPATH: /zitadel-bootstrap/admin.pat
      ZITADEL_FIRSTINSTANCE_ORG_MACHINE_MACHINE_USERNAME: chelabase-bootstrap
      ZITADEL_FIRSTINSTANCE_ORG_MACHINE_MACHINE_NAME: Chelabase Bootstrap
      ZITADEL_FIRSTINSTANCE_ORG_MACHINE_PAT_EXPIRATIONDATE: "2099-01-01T00:00:00Z"
      ZITADEL_FIRSTINSTANCE_ORG_HUMAN_PASSWORDCHANGEREQUIRED: "false"
      ZITADEL_FIRSTINSTANCE_LOGINCLIENTPATPATH: /zitadel-bootstrap/login-client.pat
      ZITADEL_FIRSTINSTANCE_ORG_LOGINCLIENT_MACHINE_USERNAME: login-client
      ZITADEL_FIRSTINSTANCE_ORG_LOGINCLIENT_MACHINE_NAME: Chelabase auth
      ZITADEL_FIRSTINSTANCE_ORG_LOGINCLIENT_PAT_EXPIRATIONDATE: "2099-01-01T00:00:00Z"
      ZITADEL_DEFAULTINSTANCE_FEATURES_LOGINV2_REQUIRED: "true"
      # The login UI is Studio, at its public origin (scheme and CHELABASE_STUDIO_HOST).
      ZITADEL_DEFAULTINSTANCE_FEATURES_LOGINV2_BASEURI: "${CHELABASE_PUBLIC_SCHEME:?set by chelabase workbench (stack.env)}://${CHELABASE_STUDIO_HOST:?set by chelabase workbench (stack.env)}/"
      ZITADEL_OIDC_DEFAULTLOGINURLV2: "${CHELABASE_PUBLIC_SCHEME}://${CHELABASE_STUDIO_HOST}/login?authRequest="
      ZITADEL_OIDC_DEFAULTLOGOUTURLV2: "${CHELABASE_PUBLIC_SCHEME}://${CHELABASE_STUDIO_HOST}/logout?post_logout_redirect="
      # Actions call the orchestrator by service name (a private address on the stack network,
      # allowed); loopback and link-local stay blocked.
      ZITADEL_HTTPCLIENT_DENYLIST: "localhost,0.0.0.0/8,127.0.0.0/8,169.254.0.0/16,::1/128"
    depends_on:
      zitadel-db:
        condition: service_healthy
    # The PATs go to /zitadel-bootstrap (the workbench overlay binds <state>/zitadel there).
    # The image has no shell or HTTP client; `zitadel ready` asks its own /debug/ready.
    healthcheck:
      test: ["CMD", "/app/zitadel", "ready"]
      interval: 5s
      timeout: 5s
      retries: 60
      start_period: 30s

  # --- Neon storage ------------------------------------------------------
  # Flags and health checks come from the old cheladb repo's core/docker/docker-compose.yml,
  # checked there against the pinned Neon source.

  # All-in-one SeaweedFS (master, volume, filer, S3) for pageserver layers and safekeeper WAL.
  seaweedfs:
    image: chrislusf/seaweedfs:4.47@sha256:ce9e796f1fe6f06968f4c04bdaf8f678dad9c8acdfef3d244133d71bfa6bf882
    restart: unless-stopped
    entrypoint: ["/bin/sh", "-c"]
    command:
      - |
        cat > /tmp/s3.json <<EOT
        {"identities": [{"name": "neon",
          "credentials": [{"accessKey": "chelabase-dev", "secretKey": "chelabase-dev-secret"}],
          "actions": ["Admin", "Read", "Write", "List", "Tagging"]}]}
        EOT
        exec weed server -s3 -s3.config=/tmp/s3.json -dir=/data -volume.max=64 -master.volumeSizeLimitMB=1024
    volumes:
      - neon_seaweedfs_data:/data
    healthcheck:
      test: ["CMD", "nc", "-z", "127.0.0.1", "8333"]
      interval: 2s
      retries: 60

  create-bucket:
    image: *neon-image
    restart: "no"
    environment: *neon-s3-env
    entrypoint: ["/bin/sh", "-c"]
    command:
      - |
        for i in $$(seq 60); do
          aws --endpoint-url http://seaweedfs:8333 s3 mb s3://neon 2>/dev/null ||
            aws --endpoint-url http://seaweedfs:8333 s3 ls s3://neon >/dev/null && exit 0
          sleep 2
        done
        exit 1
    depends_on:
      seaweedfs:
        condition: service_healthy

  storage-broker:
    image: *neon-image
    restart: unless-stopped
    command: ["storage_broker", "--listen-addr=0.0.0.0:50051"]
    healthcheck:
      test: ["CMD", "bash", "-c", "</dev/tcp/127.0.0.1/50051"]
      interval: 2s
      retries: 60

  # Three safekeepers, each with its WAL on its own volume: the storage controller runs without
  # --dev, which needs every timeline on 3 (RT1 T1, user). The worker reads each timeline's
  # commit LSN from their HTTP APIs (CHELABASE_SAFEKEEPER_HTTP, by service name). NeonJWT on the
  # WAL service and the HTTP API (the compute presents its tenant token, the pageserver and the
  # storage controller safekeeperdata); peers use safekeeperdata too. On the compute network:
  # computes stream WAL to them.
  safekeeper1:
    image: *neon-image
    restart: unless-stopped
    user: "0"
    entrypoint: *neon-as-stack-user
    environment: *neon-s3-env
    command:
      - safekeeper
      - --id=1
      - -D
      - /data
      - --listen-pg=0.0.0.0:5454
      - --listen-http=0.0.0.0:7676
      - --advertise-pg=safekeeper1:5454
      - --availability-zone=az-1
      - --broker-endpoint=http://storage-broker:50051
      - "--remote-storage={endpoint='http://seaweedfs:8333', bucket_name='neon', bucket_region='us-east-1', prefix_in_bucket='/safekeeper/'}"
      - --pg-auth-public-key-path=/run/storage-auth.pub.pem
      - --http-auth-public-key-path=/run/storage-auth.pub.pem
      - --auth-token-path=/run/safekeeper-data.jwt
    networks:
      default: {}
      compute: {}
    volumes:
      - neon_safekeeper1_data:/data
    secrets:
      - {source: storage-pem, target: /run/storage-auth.pub.pem}
      - {source: storage-safekeeper-data, target: /run/safekeeper-data.jwt}
    healthcheck:
      test: ["CMD", "curl", "-fsS", "http://127.0.0.1:7676/v1/status"]
      interval: 2s
      retries: 60
    depends_on:
      storage-broker:
        condition: service_healthy
      create-bucket:
        condition: service_completed_successfully

  safekeeper2:
    image: *neon-image
    restart: unless-stopped
    user: "0"
    entrypoint: *neon-as-stack-user
    environment: *neon-s3-env
    command:
      - safekeeper
      - --id=2
      - -D
      - /data
      - --listen-pg=0.0.0.0:5454
      - --listen-http=0.0.0.0:7676
      - --advertise-pg=safekeeper2:5454
      - --availability-zone=az-2
      - --broker-endpoint=http://storage-broker:50051
      - "--remote-storage={endpoint='http://seaweedfs:8333', bucket_name='neon', bucket_region='us-east-1', prefix_in_bucket='/safekeeper/'}"
      - --pg-auth-public-key-path=/run/storage-auth.pub.pem
      - --http-auth-public-key-path=/run/storage-auth.pub.pem
      - --auth-token-path=/run/safekeeper-data.jwt
    networks:
      default: {}
      compute: {}
    volumes:
      - neon_safekeeper2_data:/data
    secrets:
      - {source: storage-pem, target: /run/storage-auth.pub.pem}
      - {source: storage-safekeeper-data, target: /run/safekeeper-data.jwt}
    healthcheck:
      test: ["CMD", "curl", "-fsS", "http://127.0.0.1:7676/v1/status"]
      interval: 2s
      retries: 60
    depends_on:
      storage-broker:
        condition: service_healthy
      create-bucket:
        condition: service_completed_successfully

  safekeeper3:
    image: *neon-image
    restart: unless-stopped
    user: "0"
    entrypoint: *neon-as-stack-user
    environment: *neon-s3-env
    command:
      - safekeeper
      - --id=3
      - -D
      - /data
      - --listen-pg=0.0.0.0:5454
      - --listen-http=0.0.0.0:7676
      - --advertise-pg=safekeeper3:5454
      - --availability-zone=az-3
      - --broker-endpoint=http://storage-broker:50051
      - "--remote-storage={endpoint='http://seaweedfs:8333', bucket_name='neon', bucket_region='us-east-1', prefix_in_bucket='/safekeeper/'}"
      - --pg-auth-public-key-path=/run/storage-auth.pub.pem
      - --http-auth-public-key-path=/run/storage-auth.pub.pem
      - --auth-token-path=/run/safekeeper-data.jwt
    networks:
      default: {}
      compute: {}
    volumes:
      - neon_safekeeper3_data:/data
    secrets:
      - {source: storage-pem, target: /run/storage-auth.pub.pem}
      - {source: storage-safekeeper-data, target: /run/safekeeper-data.jwt}
    healthcheck:
      test: ["CMD", "curl", "-fsS", "http://127.0.0.1:7676/v1/status"]
      interval: 2s
      retries: 60
    depends_on:
      storage-broker:
        condition: service_healthy
      create-bucket:
        condition: service_completed_successfully

  storcon-db:
    image: postgres:17.11-alpine@sha256:b0f9560a2de083e2cc7382e75f808c7381a32852a7ec49117deedb300e552b24
    restart: unless-stopped
    environment:
      # Local dev only.
      POSTGRES_USER: storcon
      POSTGRES_PASSWORD: storcon
      POSTGRES_DB: storage_controller
    volumes:
      - neon_storcon_pg_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U storcon -d storage_controller"]
      interval: 2s
      retries: 60

  # Strict mode (no --dev, RT1 T1 user decision): every caller presents a NeonJWT signed with the
  # compute-JWT key pair (PUBLIC_KEY, a public key, exported by the entrypoint); it presents
  # scoped tokens to the pageserver and the safekeepers, and the generated hook token to the
  # orchestrator. It reads each token from its mount itself (`--*-jwt-token-file`), so no
  # secret is in its environment or its arguments (fork round 4, F6).
  storage-controller:
    image: *neon-image
    restart: unless-stopped
    user: "${CHELABASE_UID}:${CHELABASE_GID}"
    entrypoint:
      - /bin/sh
      - -c
      - >-
        set -e;
        export PUBLIC_KEY="$$(cat /run/storage-auth.pub.pem)";
        exec storage_controller "$$@"
      - storage_controller
    command:
      - --listen=0.0.0.0:1234
      - --pageserver-jwt-token-file=/run/pageserver-api.jwt
      - --safekeeper-jwt-token-file=/run/safekeeper-data.jwt
      - --control-plane-jwt-token-file=/run/storcon-hook.token
      # Attachment changes (every tenant create, too) are pushed to the orchestrator's
      # internal listener, by service name; a tenant's reconcile waits until it answers.
      - --control-plane-url=http://orchestrator:8083/storcon
      - --database-url=postgresql://storcon:storcon@storcon-db:5432/storage_controller
      # The controller creates and deletes each timeline on the safekeepers (all three).
      # Without these, the compute creates them implicitly and a deleted database, branch or
      # superseded timeline leaves its WAL on the safekeepers and in S3.
      - --timelines-onto-safekeepers
      - --timeline-safekeeper-count=3
    secrets:
      - {source: token-storcon-hook, target: /run/storcon-hook.token}
      - {source: storage-pem, target: /run/storage-auth.pub.pem}
      - {source: storage-pageserver-api, target: /run/pageserver-api.jwt}
      - {source: storage-safekeeper-data, target: /run/safekeeper-data.jwt}
    healthcheck:
      test: ["CMD", "curl", "-fsS", "http://127.0.0.1:1234/ready"]
      interval: 2s
      retries: 60
    depends_on:
      storcon-db:
        condition: service_healthy

  # Registers with the storage controller from metadata.json at startup. NeonJWT on its page
  # service and HTTP API (RT1 T1, user): computes present their tenant token, the storage
  # controller pageserverapi. Its upcalls carry generations_api, its WAL reads from the
  # safekeepers safekeeperdata (--auth-token-file). On the compute network: computes read pages.
  pageserver:
    image: *neon-image
    restart: unless-stopped
    user: "0"
    entrypoint: *neon-as-stack-user
    environment: *neon-s3-env
    command:
      - /bin/sh
      - -c
      - |
        set -e
        mkdir -p /data/.neon
        echo 'id=1' > /data/.neon/identity.toml
        umask 077
        cat > /data/.neon/pageserver.toml <<EOT
        broker_endpoint='http://storage-broker:50051'
        pg_distrib_dir='/usr/local/'
        listen_pg_addr='0.0.0.0:6400'
        listen_http_addr='0.0.0.0:9898'
        http_auth_type='NeonJWT'
        pg_auth_type='NeonJWT'
        auth_validation_public_key_path='/run/storage-auth.pub.pem'
        control_plane_api='http://storage-controller:1234/upcall/v1/'
        control_plane_api_token='$$(cat /run/generations-api.jwt)'
        virtual_file_io_mode='buffered'
        remote_storage={ endpoint='http://seaweedfs:8333', bucket_name='neon', bucket_region='us-east-1', prefix_in_bucket='/pageserver' }
        EOT
        echo '{"host":"pageserver","port":6400,"http_host":"pageserver","http_port":9898,"availability_zone_id":"az-1"}' > /data/.neon/metadata.json
        exec pageserver -D /data/.neon --auth-token-file=/run/safekeeper-data.jwt
    networks:
      default: {}
      compute: {}
    volumes:
      - neon_pageserver_data:/data
    secrets:
      - {source: storage-pem, target: /run/storage-auth.pub.pem}
      - {source: storage-generations-api, target: /run/generations-api.jwt}
      - {source: storage-safekeeper-data, target: /run/safekeeper-data.jwt}
    healthcheck:
      test: ["CMD", "curl", "-fsS", "http://127.0.0.1:9898/v1/status"]
      interval: 2s
      retries: 60
    depends_on:
      storage-broker:
        condition: service_healthy
      storage-controller:
        condition: service_healthy
      create-bucket:
        condition: service_completed_successfully

  # One-shot: registers the three safekeepers with the storage controller (with its admin
  # NeonJWT) and marks them Active; computes get them from the storage controller.
  register-safekeepers:
    image: *neon-image
    restart: "no"
    user: "${CHELABASE_UID}:${CHELABASE_GID}"
    entrypoint: ["/bin/sh", "-c"]
    command:
      - |
        set -e
        S=http://storage-controller:1234
        # The bearer goes to curl in a header file (`-H @file`), never on its command line.
        umask 077
        H="$$(mktemp)"
        trap 'rm -f "$$H"' EXIT
        { printf 'Authorization: Bearer '; tr -d '\r\n' < /run/storcon-admin.jwt; echo; } > "$$H"
        for ID in 1 2 3; do
          curl -fsS -X POST -H 'Content-Type: application/json' -H "@$$H" \
            -d "{\"id\":$$ID,\"created_at\":\"2023-10-25T09:11:25Z\",\"updated_at\":\"2024-08-28T11:32:43Z\",\"region_id\":\"local\",\"host\":\"safekeeper$$ID\",\"port\":5454,\"http_port\":7676,\"https_port\":null,\"version\":5957,\"availability_zone_id\":\"az-$$ID\"}" \
            $$S/control/v1/safekeeper/$$ID
          curl -fsS -X POST -H 'Content-Type: application/json' -H "@$$H" \
            -d '{"scheduling_policy":"Active"}' $$S/control/v1/safekeeper/$$ID/scheduling_policy
        done
    secrets:
      - {source: storage-storcon-admin, target: /run/storcon-admin.jwt}
    depends_on:
      storage-controller:
        condition: service_healthy
      safekeeper1:
        condition: service_healthy
      safekeeper2:
        condition: service_healthy
      safekeeper3:
        condition: service_healthy

  # Writes the proxy's TLS certificate once: a local CA and a *.localtest.me certificate signed
  # by it. Clients verify against the CA; `chelabase workbench up` copies it to
  # <state>/neon/proxy-ca.crt.
  proxy-tls:
    image: *neon-image
    restart: "no"
    user: "0"
    entrypoint: ["/bin/sh", "-c"]
    command:
      - |
        set -e
        cd /tls
        # The proxy runs as the stack's uid (it reads the stack's 0600 secrets too).
        owner="${CHELABASE_UID}:${CHELABASE_GID}"
        if [ -s tls.crt ] && openssl x509 -in tls.crt -noout -subject | grep -qF '*.localtest.me'; then
          chown "$$owner" tls.key tls.crt ca.crt
          echo "certificate for *.localtest.me exists"; exit 0
        fi
        [ -s ca.key ] || openssl req -x509 -newkey ec -pkeyopt ec_paramgen_curve:P-256 -nodes \
          -keyout ca.key -out ca.crt -days 3650 -subj "/CN=Chelabase local CA"
        openssl req -newkey ec -pkeyopt ec_paramgen_curve:P-256 -nodes -keyout tls.key -out tls.csr \
          -subj "/CN=*.localtest.me"
        printf 'subjectAltName=DNS:*.localtest.me\n' > ext.cnf
        openssl x509 -req -in tls.csr -CA ca.crt -CAkey ca.key -CAcreateserial -days 825 \
          -extfile ext.cnf -out tls.crt
        rm -f tls.csr ext.cnf
        chown "$$owner" tls.key tls.crt ca.crt
        chmod 600 ca.key tls.key
        echo "issued a certificate for *.localtest.me"
    volumes: ["neon_proxy_tls:/tls"]
    network_mode: none

  # Neon's proxy. Clients connect to <endpoint-id>.localtest.me (which resolves to 127.0.0.1):
  # Postgres wire on 4432 (the overlay publishes it on the stack's proxy port); WebSocket and SQL
  # over HTTP on 4444, inside the stack's network only. It asks the orchestrator's internal
  # listener for role secrets and compute addresses, and reaches computes on this network. Role
  # secrets are cached for at most a minute, and dropped at once when the control plane publishes
  # /password_updated to Valkey.
  # RT1 T1 (S6, S27): it logs in to Valkey as the `proxy` ACL user and calls the orchestrator
  # with its generated token; the entrypoint reads both from their mounts (the proxy takes the
  # Valkey credentials only on its command line). On the compute network: it dials computes.
  proxy:
    image: *neon-image
    restart: unless-stopped
    user: "${CHELABASE_UID}:${CHELABASE_GID}"
    entrypoint:
      - /bin/sh
      - -c
      - >-
        exec proxy --redis-plain=redis://proxy@valkey:6379 --redis-plain-password-file=/run/valkey-proxy.password --control-plane-token-file=/run/proxy-api.token "$$@"
      - proxy
    command:
      - --auth-backend=control-plane
      - --auth-endpoint=http://orchestrator:8083/proxy/api/v1
      - --proxy=0.0.0.0:4432
      - --wss=0.0.0.0:4444
      # The proxy takes the endpoint domain from the certificate's CN.
      - --tls-cert=/tls/tls.crt
      - --tls-key=/tls/tls.key
      - --project-info-cache=size=10000,ttl=1m,max_roles=64,gc_interval=60m
      - --redis-auth-type=plain
    networks:
      default: {}
      compute: {}
    volumes:
      - neon_proxy_tls:/tls:ro
    secrets:
      - {source: valkey-proxy, target: /run/valkey-proxy.password}
      - {source: token-proxy-api, target: /run/proxy-api.token}
    healthcheck:
      test: ["CMD", "bash", "-c", "</dev/tcp/127.0.0.1/4432"]
      interval: 2s
      retries: 60
    depends_on:
      proxy-tls:
        condition: service_completed_successfully
      # The proxy exits if it can't reach Redis at startup.
      valkey:
        condition: service_healthy

  # --- The app tier ---------------------------------------------------------------------------
  # Each app's wiring: its credentials (files, by <NAME>_FILE), secrets, networks, health and
  # dependencies. The images are the release images (infra/images); the workbench overlay runs the
  # checkout's host-built debug binaries in the workbench image instead, and adds the env files,
  # mounts, ports and static control addresses. Listeners bind 0.0.0.0 inside and every URL is a
  # service name. The gateway is the one way in from the host.

  orchestrator:
    image: chelabase/orchestrator:latest
    restart: unless-stopped
    # RT1 T1 (S1, S27): its own credentials, from its own secrets below.
    environment:
      - CHELABASE_NATS_USER=orchestrator
      - CHELABASE_NATS_PASSWORD_FILE=${CHELABASE_KEYS_DIR}/nats/orchestrator.password
      - CHELABASE_NATS_INBOX_PREFIX=_INBOX_orchestrator
      - CHELABASE_VALKEY_USER=control
      - CHELABASE_VALKEY_PASSWORD_FILE=${CHELABASE_KEYS_DIR}/valkey/control.password
      - CHELABASE_REALTIME_INTERNAL_TOKEN_FILE=${CHELABASE_KEYS_DIR}/realtime/internal.token
      - CHELABASE_REST_INTERNAL_TOKEN_FILE=${CHELABASE_KEYS_DIR}/tokens/rest-internal.token
      - CHELABASE_DATA_KEYS_TOKEN_FILE=${CHELABASE_KEYS_DIR}/tokens/data-keys.token
      - CHELABASE_APP_AUTH_INTERNAL_TOKEN_FILE=${CHELABASE_KEYS_DIR}/tokens/app-auth.token
      - CHELABASE_APP_SESSIONS_INTERNAL_TOKEN_FILE=${CHELABASE_KEYS_DIR}/tokens/app-sessions.token
      - CHELABASE_PROXY_API_TOKEN_FILE=${CHELABASE_KEYS_DIR}/tokens/proxy-api.token
      - CHELABASE_STORCON_HOOK_TOKEN_FILE=${CHELABASE_KEYS_DIR}/tokens/storcon-hook.token
    # The default network for the apps, `control` for its TLS connections to computes, and
    # `compute` (P4): computes call its hooks listener (8083) as `orchestrator`.
    networks:
      default: {}
      control: {}
      compute: {}
    secrets:
      - {source: zitadel-admin-pat, target: "${CHELABASE_STACK_DIR}/zitadel/admin.pat"}
      - {source: secrets-key, target: "${CHELABASE_KEYS_DIR}/secrets/secrets.key"}
      - {source: internal-verify, target: "${CHELABASE_KEYS_DIR}/gateway/internal-verify.pem"}
      - {source: compute-jwt-private, target: "${CHELABASE_KEYS_DIR}/neon/compute-jwt.pem"}
      - {source: compute-jwt-public, target: "${CHELABASE_KEYS_DIR}/neon/compute-jwt.pub"}
      - {source: nats-orchestrator, target: "${CHELABASE_KEYS_DIR}/nats/orchestrator.password"}
      - {source: valkey-control, target: "${CHELABASE_KEYS_DIR}/valkey/control.password"}
      - {source: realtime-internal, target: "${CHELABASE_KEYS_DIR}/realtime/internal.token"}
      - {source: token-rest-internal, target: "${CHELABASE_KEYS_DIR}/tokens/rest-internal.token"}
      - {source: token-data-keys, target: "${CHELABASE_KEYS_DIR}/tokens/data-keys.token"}
      - {source: token-app-auth, target: "${CHELABASE_KEYS_DIR}/tokens/app-auth.token"}
      - {source: token-app-sessions, target: "${CHELABASE_KEYS_DIR}/tokens/app-sessions.token"}
      - {source: token-proxy-api, target: "${CHELABASE_KEYS_DIR}/tokens/proxy-api.token"}
      - {source: token-storcon-hook, target: "${CHELABASE_KEYS_DIR}/tokens/storcon-hook.token"}
    healthcheck:
      <<: *app-health
      test: ["CMD-SHELL", "curl -fsS http://127.0.0.1:8081/health && curl -fsS http://127.0.0.1:8083/health"]
    depends_on:
      metadata-db:
        condition: service_healthy
      nats:
        condition: service_healthy
      valkey:
        condition: service_healthy
      storage-controller:
        condition: service_healthy
      zitadel:
        condition: service_healthy

  worker:
    image: chelabase/worker:latest
    restart: unless-stopped
    # RT1 T1 (S1): its own credentials, from its own secrets below.
    environment:
      - CHELABASE_NATS_USER=worker
      - CHELABASE_NATS_PASSWORD_FILE=${CHELABASE_KEYS_DIR}/nats/worker.password
      - CHELABASE_NATS_INBOX_PREFIX=_INBOX_worker
      - CHELABASE_VALKEY_USER=control
      - CHELABASE_VALKEY_PASSWORD_FILE=${CHELABASE_KEYS_DIR}/valkey/control.password
      - CHELABASE_REALTIME_PG_PASSWORD_FILE=${CHELABASE_KEYS_DIR}/realtime/pg.password
      # The worker renews realtime's client pair with the sweep, and refreshes computes' storage tokens.
      - CHELABASE_REALTIME_TLS_DIR=${CHELABASE_KEYS_DIR}/realtime-tls
      - CHELABASE_STORAGE_TOKEN_REFRESH_SECS=${CHELABASE_STORAGE_TOKEN_REFRESH_SECS:-3600}
    # P4: it dials computes (compute_ctl) on the compute network.
    networks:
      default: {}
      compute: {}
    secrets:
      - {source: zitadel-admin-pat, target: "${CHELABASE_STACK_DIR}/zitadel/admin.pat"}
      - {source: secrets-key, target: "${CHELABASE_KEYS_DIR}/secrets/secrets.key"}
      - {source: compute-jwt-private, target: "${CHELABASE_KEYS_DIR}/neon/compute-jwt.pem"}
      - {source: compute-jwt-public, target: "${CHELABASE_KEYS_DIR}/neon/compute-jwt.pub"}
      - {source: nats-worker, target: "${CHELABASE_KEYS_DIR}/nats/worker.password"}
      - {source: valkey-control, target: "${CHELABASE_KEYS_DIR}/valkey/control.password"}
      - {source: realtime-pg, target: "${CHELABASE_KEYS_DIR}/realtime/pg.password"}
    healthcheck:
      <<: *app-health
      test: ["CMD", "curl", "-fsS", "http://127.0.0.1:8082/health"]
    depends_on:
      metadata-db:
        condition: service_healthy
      nats:
        condition: service_healthy
      valkey:
        condition: service_healthy
      storage-controller:
        condition: service_healthy
      pageserver:
        condition: service_healthy
      safekeeper1:
        condition: service_healthy
      safekeeper2:
        condition: service_healthy
      safekeeper3:
        condition: service_healthy
      register-safekeepers:
        condition: service_completed_successfully
      zitadel:
        condition: service_healthy

  # The front door. It listens on the stack's gateway port inside too (CHELABASE_GATEWAY_LISTEN)
  # and answers every host of its stack on the network (the overlay's aliases), so one URL works
  # from the host, from an app container and from the runner. It starts before its backends (502
  # until they come up).
  gateway:
    image: chelabase/gateway:latest
    restart: unless-stopped
    # RT1 T1 (S27): the bearers it sends to the orchestrator's internal listener.
    environment:
      - CHELABASE_DATA_KEYS_TOKEN_FILE=${CHELABASE_KEYS_DIR}/tokens/data-keys.token
      - CHELABASE_APP_SESSIONS_INTERNAL_TOKEN_FILE=${CHELABASE_KEYS_DIR}/tokens/app-sessions.token
    secrets:
      - {source: internal-signing, target: "${CHELABASE_KEYS_DIR}/gateway/internal-signing.pem"}
      - {source: app-jwt-public, target: "${CHELABASE_KEYS_DIR}/auth/app-jwt.pub"}
      - {source: token-data-keys, target: "${CHELABASE_KEYS_DIR}/tokens/data-keys.token"}
      - {source: token-app-sessions, target: "${CHELABASE_KEYS_DIR}/tokens/app-sessions.token"}
    healthcheck:
      <<: *app-health
      test: ["CMD", "curl", "-fsS", "http://127.0.0.1:${CHELABASE_GATEWAY_PORT}/_gateway/health"]
    depends_on:
      zitadel:
        condition: service_healthy

  # Studio's sign-in backend. On the compute network (P4: the app-users sync dials computes), so
  # computes reach it directly: only the gateway's X-Forwarded-For counts
  # (CHELABASE_AUTH_TRUSTED_PROXY=gateway, ruling (e)).
  auth:
    image: chelabase/auth:latest
    restart: unless-stopped
    # RT1 T1 (S27): the bearer it sends to the orchestrator's internal app routes.
    environment:
      - CHELABASE_APP_AUTH_INTERNAL_TOKEN_FILE=${CHELABASE_KEYS_DIR}/tokens/app-auth.token
    networks:
      default: {}
      compute: {}
    secrets:
      - {source: zitadel-admin-pat, target: "${CHELABASE_STACK_DIR}/zitadel/admin.pat"}
      - {source: zitadel-login-client-pat, target: "${CHELABASE_STACK_DIR}/zitadel/login-client.pat"}
      - {source: cookie, target: "${CHELABASE_KEYS_DIR}/auth/cookie.key"}
      - {source: app-jwt-private, target: "${CHELABASE_KEYS_DIR}/auth/app-jwt.key"}
      - {source: app-jwt-public, target: "${CHELABASE_KEYS_DIR}/auth/app-jwt.pub"}
      - {source: internal-verify, target: "${CHELABASE_KEYS_DIR}/gateway/internal-verify.pem"}
      - {source: compute-ca-cert, target: "${CHELABASE_KEYS_DIR}/compute-ca/ca.crt"}
      - {source: token-app-auth, target: "${CHELABASE_KEYS_DIR}/tokens/app-auth.token"}
    # auth has no health route: any HTTP answer (even a 404) means it is serving.
    healthcheck:
      <<: *app-health
      test: ["CMD", "curl", "-sS", "-o", "/dev/null", "http://127.0.0.1:8084/"]
    depends_on:
      zitadel:
        condition: service_healthy

  rest:
    image: chelabase/rest:latest
    restart: unless-stopped
    # RT1 T1 (S27): its internal bearer (both ways with the orchestrator).
    environment:
      - CHELABASE_REST_INTERNAL_TOKEN_FILE=${CHELABASE_KEYS_DIR}/tokens/rest-internal.token
    # P4: the data API dials computes on the compute network.
    networks:
      default: {}
      compute: {}
    secrets:
      - {source: internal-verify, target: "${CHELABASE_KEYS_DIR}/gateway/internal-verify.pem"}
      - {source: compute-ca-cert, target: "${CHELABASE_KEYS_DIR}/compute-ca/ca.crt"}
      - {source: token-rest-internal, target: "${CHELABASE_KEYS_DIR}/tokens/rest-internal.token"}
    # rest has no health route: any HTTP answer (even a 404) means it is serving.
    healthcheck:
      <<: *app-health
      test: ["CMD", "curl", "-sS", "-o", "/dev/null", "http://127.0.0.1:8085/"]
    depends_on:
      metadata-db:
        condition: service_healthy

  # RT1 T7: tickets and the one WebSocket per tab, behind the gateway (8087); 8088 serves only
  # /health. It reads demo.env for the OIDC audiences, as the gateway does, and verifies the
  # gateway's identity on ticket requests.
  realtime:
    image: chelabase/realtime:latest
    restart: unless-stopped
    # S1: its own credentials and secrets, from its own secrets below; Valkey TLS is platform
    # mode's (S7).
    environment:
      - CHELABASE_NATS_USER=realtime
      - CHELABASE_NATS_PASSWORD_FILE=${CHELABASE_KEYS_DIR}/nats/realtime.password
      - CHELABASE_NATS_INBOX_PREFIX=_INBOX_realtime
      - CHELABASE_VALKEY_USER=realtime
      - CHELABASE_VALKEY_PASSWORD_FILE=${CHELABASE_KEYS_DIR}/valkey/realtime.password
      - CHELABASE_VALKEY_TLS=off
      - CHELABASE_REALTIME_PG_PASSWORD_FILE=${CHELABASE_KEYS_DIR}/realtime/pg.password
      - CHELABASE_REALTIME_TICKET_KEY_FILE=${CHELABASE_KEYS_DIR}/realtime/ticket.key
      - CHELABASE_REALTIME_INTERNAL_TOKEN_FILE=${CHELABASE_KEYS_DIR}/realtime/internal.token
      - CHELABASE_REALTIME_TLS_DIR=${CHELABASE_KEYS_DIR}/realtime-tls
    # Realtime's replication connection dials the compute's `replication_host` on `control`
    # (from an address in the chelabase_realtime login rule); its check connections and the
    # compute's other listeners are reached on `compute`.
    networks:
      default: {}
      control: {}
      compute: {}
    secrets:
      - {source: internal-verify, target: "${CHELABASE_KEYS_DIR}/gateway/internal-verify.pem"}
      - {source: compute-ca-cert, target: "${CHELABASE_KEYS_DIR}/compute-ca/ca.crt"}
      - {source: nats-realtime, target: "${CHELABASE_KEYS_DIR}/nats/realtime.password"}
      - {source: valkey-realtime, target: "${CHELABASE_KEYS_DIR}/valkey/realtime.password"}
      - {source: realtime-pg, target: "${CHELABASE_KEYS_DIR}/realtime/pg.password"}
      - {source: realtime-ticket, target: "${CHELABASE_KEYS_DIR}/realtime/ticket.key"}
      - {source: realtime-internal, target: "${CHELABASE_KEYS_DIR}/realtime/internal.token"}
    healthcheck:
      <<: *app-health
      test: ["CMD", "curl", "-fsS", "http://127.0.0.1:8088/health"]
    depends_on:
      nats:
        condition: service_healthy
      valkey:
        condition: service_healthy

  studio:
    image: chelabase/studio:latest
    restart: unless-stopped
    environment:
      CHELABASE_STUDIO_PORT: "3000"
    healthcheck:
      <<: *app-health
      test: ["CMD", "curl", "-fsS", "-o", "/dev/null", "-H", "Host: ${CHELABASE_STUDIO_HOST_NAME}", "http://127.0.0.1:3000/"]

# Per-service key files (U10): each service lists the ones it reads under its own `secrets:`,
# with `target:` set to the path it expects, so a service sees exactly its files. Compose binds
# each host file read-only; a missing file fails `up`.
# RT1 T1 (R11, S1, S27): the generated service secrets (`chelabase workbench up` creates each once,
# 0600, never overwritten); a service gets its file's path as <NAME>_FILE in its own
# `environment:`, never through stack.env.
secrets:
  secrets-key: {file: "${CHELABASE_KEYS_DIR}/secrets/secrets.key"}
  internal-signing: {file: "${CHELABASE_KEYS_DIR}/gateway/internal-signing.pem"}
  internal-verify: {file: "${CHELABASE_KEYS_DIR}/gateway/internal-verify.pem"}
  cookie: {file: "${CHELABASE_KEYS_DIR}/auth/cookie.key"}
  app-jwt-private: {file: "${CHELABASE_KEYS_DIR}/auth/app-jwt.key"}
  app-jwt-public: {file: "${CHELABASE_KEYS_DIR}/auth/app-jwt.pub"}
  compute-jwt-private: {file: "${CHELABASE_KEYS_DIR}/neon/compute-jwt.pem"}
  compute-jwt-public: {file: "${CHELABASE_KEYS_DIR}/neon/compute-jwt.pub"}
  nats-orchestrator: {file: "${CHELABASE_KEYS_DIR}/nats/orchestrator.password"}
  nats-worker: {file: "${CHELABASE_KEYS_DIR}/nats/worker.password"}
  nats-realtime: {file: "${CHELABASE_KEYS_DIR}/nats/realtime.password"}
  nats-runner: {file: "${CHELABASE_KEYS_DIR}/nats/runner.password"}
  valkey-proxy: {file: "${CHELABASE_KEYS_DIR}/valkey/proxy.password"}
  valkey-control: {file: "${CHELABASE_KEYS_DIR}/valkey/control.password"}
  valkey-realtime: {file: "${CHELABASE_KEYS_DIR}/valkey/realtime.password"}
  valkey-runner: {file: "${CHELABASE_KEYS_DIR}/valkey/runner.password"}
  valkey-health: {file: "${CHELABASE_KEYS_DIR}/valkey/health.password"}
  realtime-pg: {file: "${CHELABASE_KEYS_DIR}/realtime/pg.password"}
  realtime-ticket: {file: "${CHELABASE_KEYS_DIR}/realtime/ticket.key"}
  realtime-internal: {file: "${CHELABASE_KEYS_DIR}/realtime/internal.token"}
  token-rest-internal: {file: "${CHELABASE_KEYS_DIR}/tokens/rest-internal.token"}
  token-data-keys: {file: "${CHELABASE_KEYS_DIR}/tokens/data-keys.token"}
  token-app-auth: {file: "${CHELABASE_KEYS_DIR}/tokens/app-auth.token"}
  token-app-sessions: {file: "${CHELABASE_KEYS_DIR}/tokens/app-sessions.token"}
  token-proxy-api: {file: "${CHELABASE_KEYS_DIR}/tokens/proxy-api.token"}
  token-storcon-hook: {file: "${CHELABASE_KEYS_DIR}/tokens/storcon-hook.token"}
  # Storage auth (user, 2026-10-16): the compute-JWT public key as SPKI PEM and the scoped
  # NeonJWTs the workbench signs with the pair (<keys>/neon/storage-tokens/). The runner sees
  # them at their own paths (scripts call the storage controller); the Neon containers read them
  # under /run.
  storage-pem: {file: "${CHELABASE_KEYS_DIR}/neon/compute-jwt.pub.pem"}
  storage-pageserver-api: {file: "${CHELABASE_KEYS_DIR}/neon/storage-tokens/pageserver-api.jwt"}
  storage-safekeeper-data: {file: "${CHELABASE_KEYS_DIR}/neon/storage-tokens/safekeeper-data.jwt"}
  storage-generations-api: {file: "${CHELABASE_KEYS_DIR}/neon/storage-tokens/generations-api.jwt"}
  storage-storcon-admin: {file: "${CHELABASE_KEYS_DIR}/neon/storage-tokens/storcon-admin.jwt"}
  # The runner's metrics token (scope metrics, minted by the workbench). A kept metrics.token
  # isn't checked against the current compute-JWT key: after a key rotation, re-mint it with
  # `chelabase neon mint-metrics-token`, then recreate the runner (a single-file mount keeps the
  # old file's inode, so a running runner never sees the new token). The command writes under
  # `CHELABASE_NEON_DIR` (default `.chelabase/neon` in the checkout): for a workbench stack, run
  # it with that stack's `CHELABASE_NEON_DIR`.
  storage-metrics: {file: "${CHELABASE_KEYS_DIR}/neon/storage-tokens/metrics.token"}
  # The platform CA's certificate alone (never ca.key): auth, rest and realtime verify every
  # compute's TLS against it (U15, CHELABASE_COMPUTE_CA_FILE).
  compute-ca-cert: {file: "${CHELABASE_KEYS_DIR}/compute-ca/ca.crt"}
  # The Zitadel PATs, the only state files an app opens (once, at startup, from the paths demo.env
  # gives: CHELABASE_ZITADEL_ADMIN_PAT_FILE, CHELABASE_AUTH_TOKEN_FILE), at their own paths, ro:
  # admin.pat for the orchestrator, the worker and auth, login-client.pat for auth. Zitadel writes
  # them on a fresh volume, so a missing one fails the app's create or start (no longer a warning
  # in the orchestrator or the worker): `workbench up`, `restart` and `test`'s recreate of
  # stale apps wait for the PATs before they create these apps, and `scripts/zitadel-reset.sh`
  # (which deletes them) returns only once Zitadel has rewritten both. A running app keeps the
  # file it started with.
  zitadel-admin-pat: {file: "${CHELABASE_STACK_DIR}/zitadel/admin.pat"}
  zitadel-login-client-pat: {file: "${CHELABASE_STACK_DIR}/zitadel/login-client.pat"}

networks:
  # Orchestrator, realtime and the test runner to computes (<project>_control). The workbench
  # overlay gives it a fixed subnet per stack from the registry's control slot; computes take
  # addresses from the upper /23 only.
  control: {}
  # RT1 T1 (P4, W14): the computes' own network (<project>_compute, CHELABASE_COMPUTE_NETWORK).
  # On it: what a compute needs (pageserver, safekeepers, the orchestrator's hooks listener) and
  # the clients that dial computes (proxy, rest, auth, worker, orchestrator, runner, realtime).
  # Never NATS, Valkey, a database, Zitadel, Mailpit, SeaweedFS, the storage broker or controller,
  # the gateway or Studio. Every listener of its members needs a credential or is public by
  # design (scripts/compute-network-e2e.sh audits each one).
  compute: {}

volumes:
  metadata_pg_data:
  nats_data:
  valkey_data:
  zitadel_pg_data:
  neon_seaweedfs_data:
  neon_pageserver_data:
  neon_safekeeper1_data:
  neon_safekeeper2_data:
  neon_safekeeper3_data:
  neon_storcon_pg_data:
  neon_proxy_tls:
