# A self-hosted Chelabase: the infra, Neon storage and proxy, and the app tier (orchestrator,
# worker, gateway, auth, identity, rest, realtime, storage, Studio), with their wiring: images,
# networks, volumes, secrets, healthchecks and dependencies.
#
#   cd infra/compose && cp .env.example .env && docker compose up -d
#   docker compose logs init-secrets          # the one-time setup code
#
# docker-compose.build.yml builds the images from this clone instead of pulling them
# (`docker compose -f docker-compose.yml -f docker-compose.build.yml up -d --build`).
#
# Two one-shots run first: `init-secrets` makes every key, password and token (chelabase-init's
# layout) in the named volume `secrets`, never overwriting one, and prints the setup code on the
# run that creates it; `init-bootstrap` sets up the identity service's database role and its
# members pool (its lock is in bootstrap/). Each service mounts only its own files from that volume
# (`volume.subpath`, read-only, U10) at /run/chelabase/secrets/<path> and reads them through its
# `*_FILE` settings or key paths; no secret is ever an environment value, an argument or in this
# file. Every value read from .env has a default here or fails `up` naming .env.
#
# The identity service (auth-replacement) is internal: no published port, no gateway route.
#
# Two services are published: the gateway (CHELABASE_HTTP_ADDR:CHELABASE_HTTP_PORT) and the
# proxy's Postgres and SQL-over-HTTP ports (CHELABASE_PROXY_ADDR, CHELABASE_PROXY_PORT and
# CHELABASE_PROXY_HTTP_PORT). Everything else talks over the project network by service name;
# computes get their own `compute` network.
#
# The workbench passes `-f docker-compose.yml -f docker-compose.workbench.yml --env-file
# <state>/env/stack.env`: the overlay runs the dev loop on this file (its host-built binaries,
# its keys dir and its fixed dev values) and turns the two one-shots off.
# scripts/tests/compose-overlay-equiv.sh checks the pair renders what it did before m8.

# --- Neon storage ---
# Pinned by digest; `chelabase workbench up` overrides these with a local `just neon-build` when
# present. The packages are public on ghcr.io (infra/neon/README.md).
x-neon-images:
  neon: &neon-image ${NEON_IMAGE:-ghcr.io/chelabase/neon-storage:31ad01be6a88-dev@sha256:51ed734c5f67aebc673467239c8254df3ec72b9756628dc7729ba9903cecde3d}
  # The image of the compute containers the worker starts (CHELABASE_COMPUTE_IMAGE); pinned here.
  compute: &compute-image ${COMPUTE_NODE_IMAGE:-ghcr.io/chelabase/neon-compute-v17:31ad01be6a88-dev@sha256:a174e0e4003517139e345246f67be6e6f68abec80e38a3fd3b9b93af541045c9}

# The S3 credentials for SeaweedFS, from their files: exported into the process environment by
# the entrypoint (never Compose's `environment:`, so `docker inspect` doesn't show them). The Neon
# services run as the image's user (1000:1000), the group of the S3 and storage-token files.
x-neon-s3-from-files: &neon-s3-from-files
  - /bin/sh
  - -c
  - >-
    set -e;
    export AWS_ACCESS_KEY_ID="$$(cat /run/chelabase/secrets/s3/access-key)";
    export AWS_SECRET_ACCESS_KEY="$$(cat /run/chelabase/secrets/s3/secret-key)";
    exec "$$@"
  - neon

# The orchestrator and the worker start as root only to join the Docker socket's group (its gid
# differs per host, so it is read from the socket) and the metadata password's (70), then run as
# the app user (10001, the owner of their secret files).
x-app-with-docker: &app-with-docker
  - /bin/sh
  - -c
  - >-
    exec setpriv --reuid=10001 --regid=10001 --groups="$$(stat -c %g /var/run/docker.sock),70" -- "$$@"
  - chelabase

x-app-health: &app-health
  interval: 2s
  timeout: 5s
  retries: 30
  start_period: 60s

# Every app's non-secret settings (the workbench's stack.env and demo.env, self-hosted): the
# public entry, service-name addresses and the paths of the key files each app mounts. A path is
# only a name: an app sees the files it mounts, nothing else.
x-app-env: &app-env
  CHELABASE_MODE: self-hosted
  CHELABASE_STACK: ${COMPOSE_PROJECT_NAME}
  CHELABASE_PUBLIC_SCHEME: ${CHELABASE_PUBLIC_SCHEME:-http}
  CHELABASE_STUDIO_HOST: ${CHELABASE_STUDIO_HOST:-studio.chelabase.localhost:8000}
  CHELABASE_API_HOST: ${CHELABASE_API_HOST:-api.chelabase.localhost:8000}
  CHELABASE_AUTH_HOST: ${CHELABASE_AUTH_HOST:-auth.chelabase.localhost:8000}
  CHELABASE_METADATA_DATABASE_URL: postgres://chelabase@metadata-db:5432/chelabase_metadata
  CHELABASE_NATS_URL: nats://nats:4222
  CHELABASE_VALKEY_URL: redis://valkey:6379
  CHELABASE_STORCON_URL: http://storage-controller:1234
  CHELABASE_SAFEKEEPER_HTTP: 1=http://safekeeper1:7676,2=http://safekeeper2:7676,3=http://safekeeper3:7676
  CHELABASE_INTERNAL_URL: http://orchestrator:8083
  CHELABASE_REST_INTERNAL_URL: http://rest:8086
  CHELABASE_ORCHESTRATOR_URL: http://orchestrator:8081
  CHELABASE_AUTH_URL: http://auth:8084
  CHELABASE_REST_URL: http://rest:8085
  CHELABASE_REALTIME_URL: http://realtime:8087
  # Object storage (m19): the gateway's upstream, and the orchestrator's way to its console
  # listener (Studio's storage routes).
  CHELABASE_STORAGE_URL: http://storage:8089
  CHELABASE_STORAGE_INTERNAL_URL: http://storage:8090
  # Edge functions (m4b): the gateway's upstream (the public listener, on the default network),
  # and the internal listener the orchestrator (bundle uploads) and the worker (invocations)
  # reach on the internal `functions-control` network.
  CHELABASE_FUNCTIONS_URL: http://functions-public:8091
  CHELABASE_FUNCTIONS_INTERNAL_URL: http://functions-control:8080
  CHELABASE_STUDIO_UPSTREAM: http://studio:3000
  CHELABASE_ORCHESTRATOR_ADDR: 0.0.0.0:8081
  CHELABASE_WORKER_HEALTH_ADDR: 0.0.0.0:8082
  CHELABASE_INTERNAL_ADDR: 0.0.0.0:8083
  CHELABASE_AUTH_ADDR: 0.0.0.0:8084
  CHELABASE_REST_ADDR: 0.0.0.0:8085
  CHELABASE_REST_INTERNAL_ADDR: 0.0.0.0:8086
  CHELABASE_REALTIME_ADDR: 0.0.0.0:8087
  CHELABASE_REALTIME_INTERNAL_ADDR: 0.0.0.0:8088
  CHELABASE_STORAGE_ADDR: 0.0.0.0:8089
  CHELABASE_STORAGE_INTERNAL_ADDR: 0.0.0.0:8090
  # Ruling (e): only the gateway's X-Forwarded-For counts (computes reach auth directly).
  CHELABASE_AUTH_TRUSTED_PROXY: gateway
  CHELABASE_CONTROL_PLANE_URI: http://orchestrator:8083
  CHELABASE_COMPUTE_IMAGE: *compute-image
  CHELABASE_COMPUTE_NETWORK: ${COMPOSE_PROJECT_NAME}_compute
  CHELABASE_COMPUTE_CONTROL_NETWORK: ${COMPOSE_PROJECT_NAME}_control
  CHELABASE_MEMBER_LOGIN_CIDRS: ${CHELABASE_ORCHESTRATOR_CONTROL_IP:-10.214.0.10}/32
  CHELABASE_REALTIME_LOGIN_CIDRS: ${CHELABASE_REALTIME_CONTROL_IP:-10.214.0.12}/32
  CHELABASE_STORAGE_TOKEN_REFRESH_SECS: ${CHELABASE_STORAGE_TOKEN_REFRESH_SECS:-3600}
  CHELABASE_SECRETS_KEY: /run/chelabase/secrets/secrets/secrets.key
  CHELABASE_INTERNAL_SIGNING_KEY: /run/chelabase/secrets/gateway/internal-signing.pem
  CHELABASE_INTERNAL_VERIFY_KEY: /run/chelabase/secrets/gateway/internal-verify.pem
  CHELABASE_AUTH_COOKIE_KEY: /run/chelabase/secrets/auth/cookie.key
  CHELABASE_APP_JWT_PRIVATE_KEY: /run/chelabase/secrets/auth/app-jwt.key
  CHELABASE_APP_JWT_PUBLIC_KEY: /run/chelabase/secrets/auth/app-jwt.pub
  # auth-replacement m5: the member JWT pair (auth signs; the gateway, the orchestrator and
  # realtime verify). Never the app-user pair: the two audiences stay apart.
  CHELABASE_MEMBER_JWT_PRIVATE_KEY: /run/chelabase/secrets/auth/member-jwt.key
  CHELABASE_MEMBER_JWT_PUBLIC_KEY: /run/chelabase/secrets/auth/member-jwt.pub
  CHELABASE_COMPUTE_JWT_DIR: /run/chelabase/secrets/neon
  CHELABASE_COMPUTE_CA_DIR: /run/chelabase/secrets/compute-ca
  CHELABASE_COMPUTE_CA_FILE: /run/chelabase/secrets/compute-ca/ca.crt
  CHELABASE_COMPUTE_TLS_DIR: /run/chelabase/secrets/orchestrator-tls
  CHELABASE_REALTIME_TLS_DIR: /run/chelabase/secrets/realtime-tls

services:
  # --- The one-shots -----------------------------------------------------------------------
  # Makes every secret (chelabase-init secrets), never overwriting one; reruns on each `up` and
  # changes nothing then. Starts as root only to give the `secrets` volume's root (a new named
  # volume is root's) to the app user and to copy .env (often 0600, the host user's) where that
  # user can read it; then runs as 10001 in the groups of the third-party readers (postgres 70;
  # Valkey and Neon 1000), so each file gets the owner and group the services read it as. It also
  # checks the entry settings (Compose can't derive a host's name and port, so .env carries them
  # twice). An install from before #126 keeps its retired files in the volume, untouched.
  # The setup code: `docker compose logs init-secrets` after the first run; to print it again,
  # `docker compose run --rm --no-deps --user 10001:10001 --entrypoint chelabase-init init-secrets setup-code --dir /var/lib/chelabase/secrets`
  # (the code is in the logs of the container that made it; a recreated init-secrets has none).
  init-secrets:
    image: ${CHELABASE_IMAGE_REPO:-ghcr.io/chelabase}/init:${CHELABASE_IMAGE_TAG:-ff5f35f85415@sha256:88b4b76616b55880528324b70db1d8de58bf7d382772a9650a1d58f7d70dd946}
    restart: "no"
    user: "0"
    network_mode: none
    environment:
      CHELABASE_PUBLIC_SCHEME: ${CHELABASE_PUBLIC_SCHEME:-http}
      CHELABASE_STUDIO_HOST: ${CHELABASE_STUDIO_HOST:-studio.chelabase.localhost:8000}
      CHELABASE_API_HOST: ${CHELABASE_API_HOST:-api.chelabase.localhost:8000}
      CHELABASE_AUTH_HOST: ${CHELABASE_AUTH_HOST:-auth.chelabase.localhost:8000}
      CHELABASE_STUDIO_HOST_NAME: ${CHELABASE_STUDIO_HOST_NAME:-studio.chelabase.localhost}
      CHELABASE_API_HOST_NAME: ${CHELABASE_API_HOST_NAME:-api.chelabase.localhost}
      CHELABASE_AUTH_HOST_NAME: ${CHELABASE_AUTH_HOST_NAME:-auth.chelabase.localhost}
      CHELABASE_PUBLIC_PORT: ${CHELABASE_PUBLIC_PORT:-8000}
      CHELABASE_PUBLIC_SECURE: ${CHELABASE_PUBLIC_SECURE:-false}
    entrypoint:
      - /bin/sh
      - -c
      - |
        set -eu
        bad=0
        # A host's name and port, as .env must also give them (the hosts are lowercase).
        check_host() { # <setting> <host> <name setting> <name>
          case "$$2" in \[*) return 0 ;; esac
          name="$${2%%:*}"
          if [ "$$name" = "$$2" ]; then port="$$default_port"; else port="$${2#*:}"; fi
          if [ "$$name" != "$$4" ]; then
            echo "init-secrets: $$3=$$4 in .env, but $$1=$$2: set $$3=$$name" >&2; bad=1
          fi
          if [ "$$port" != "$$CHELABASE_PUBLIC_PORT" ]; then
            echo "init-secrets: CHELABASE_PUBLIC_PORT=$$CHELABASE_PUBLIC_PORT in .env, but $$1=$$2: set CHELABASE_PUBLIC_PORT=$$port" >&2; bad=1
          fi
        }
        case "$$CHELABASE_PUBLIC_SCHEME" in
          http) secure=false; default_port=80 ;;
          https|"") secure=true; default_port=443 ;;
          *) echo "init-secrets: CHELABASE_PUBLIC_SCHEME in .env must be http or https" >&2; exit 1 ;;
        esac
        check_host CHELABASE_STUDIO_HOST "$$CHELABASE_STUDIO_HOST" CHELABASE_STUDIO_HOST_NAME "$$CHELABASE_STUDIO_HOST_NAME"
        check_host CHELABASE_API_HOST "$$CHELABASE_API_HOST" CHELABASE_API_HOST_NAME "$$CHELABASE_API_HOST_NAME"
        check_host CHELABASE_AUTH_HOST "$$CHELABASE_AUTH_HOST" CHELABASE_AUTH_HOST_NAME "$$CHELABASE_AUTH_HOST_NAME"
        [ "$$CHELABASE_PUBLIC_SECURE" = "$$secure" ] ||
          { echo "init-secrets: set CHELABASE_PUBLIC_SECURE=$$secure in .env (the scheme)" >&2; bad=1; }
        [ "$$bad" = 0 ] || exit 1
        S=/var/lib/chelabase/secrets
        [ "$$(stat -c %u:%g "$$S")" = 10001:10001 ] || chown 10001:10001 "$$S"
        chmod 0700 "$$S"
        if grep -q '^CHELABASE_SEED_' /run/chelabase/seeds.env; then
          case "$$(stat -c %a /run/chelabase/seeds.env)" in
            *00) ;;
            *) echo "init-secrets: warning: .env holds seeds and its group or others can read it: chmod 600 .env" >&2 ;;
          esac
        fi
        # The copy is in a tmpfs (gone when the run ends), in a dir of the app user's own.
        install -d -m 0700 -o 10001 -g 10001 /run/chelabase/tmp/init
        install -m 0600 -o 10001 -g 10001 /run/chelabase/seeds.env /run/chelabase/tmp/init/seeds.env
        exec setpriv --reuid=10001 --regid=10001 --groups=70,1000 -- /bin/sh -c "$$1"
      - init-secrets
      - |
        set -eu
        S=/var/lib/chelabase/secrets
        chelabase-init secrets --dir "$$S" --seeds /run/chelabase/tmp/init/seeds.env
        rm -f /run/chelabase/tmp/init/seeds.env
        # The bootstrap's dir (its lock) lives here too.
        for d in bootstrap; do
          [ -d "$$S/$$d" ] || mkdir -m 0700 "$$S/$$d"
        done
        # The object-store identities `storage` (bucket chelabase-storage only) and `functions`
        # (bucket chelabase-functions only: function bundles, edge-functions m1) beside Neon's `s3/`
        # pair (chelabase-init makes that one), and SeaweedFS's gRPC mutual TLS: one CA and a
        # server and a client certificate (P-256, ten years). Each is made only when missing, so
        # an upgraded install keeps every key it has and only gains these. Same owner, group and
        # mode as `s3/*`; the CA key stays here (0600) and is mounted nowhere.
        new_key() { # <file under $$S> <length>
          [ -s "$$S/$$1" ] && return 0
          install -d -m 0700 "$$S/$${1%/*}"
          ( umask 027; tr -dc 'A-Za-z0-9' </dev/urandom | head -c "$$2" >"$$S/$$1.tmp" )
          chgrp 1000 "$$S/$$1.tmp"
          mv -f "$$S/$$1.tmp" "$$S/$$1"
        }
        new_key storage-s3/access-key 20
        new_key storage-s3/secret-key 40
        new_key functions-s3/access-key 20
        new_key functions-s3/secret-key 40
        T="$$S/grpc-tls"
        install -d -m 0700 "$$T"
        ec="-newkey ec -pkeyopt ec_paramgen_curve:prime256v1 -nodes"
        if [ ! -s "$$T/ca.crt" ] || [ ! -s "$$T/ca.key" ]; then
          rm -f "$$T/server.crt" "$$T/client.crt"
          ( umask 077; openssl req -x509 $$ec -keyout "$$T/ca.key.tmp" -out "$$T/ca.crt.tmp" -days 3650 \
              -subj "/CN=chelabase-seaweedfs-grpc-ca" -addext basicConstraints=critical,CA:TRUE \
              -addext keyUsage=critical,keyCertSign,cRLSign 2>/dev/null )
          chmod 0644 "$$T/ca.crt.tmp"
          mv -f "$$T/ca.key.tmp" "$$T/ca.key"
          mv -f "$$T/ca.crt.tmp" "$$T/ca.crt"
        fi
        for n in server:serverAuth client:clientAuth; do
          f="$${n%%:*}"
          [ -s "$$T/$$f.crt" ] && [ -s "$$T/$$f.key" ] && continue
          ( umask 077
            printf 'basicConstraints=CA:FALSE\nkeyUsage=digitalSignature\nextendedKeyUsage=%s\nsubjectAltName=DNS:seaweedfs,DNS:localhost,IP:127.0.0.1\n' "$${n#*:}" >"$$T/$$f.ext"
            openssl req $$ec -keyout "$$T/$$f.key.tmp" -out "$$T/$$f.csr" -subj "/CN=seaweedfs-$$f" 2>/dev/null
            openssl x509 -req -in "$$T/$$f.csr" -CA "$$T/ca.crt" -CAkey "$$T/ca.key" -days 3650 -extfile "$$T/$$f.ext" \
              -set_serial "0x$$(od -An -N8 -tx1 /dev/urandom | tr -d ' \n')" -out "$$T/$$f.crt.tmp" 2>/dev/null
            rm -f "$$T/$$f.csr" "$$T/$$f.ext" )
          chgrp 1000 "$$T/$$f.key.tmp" "$$T/$$f.crt.tmp"
          chmod 0640 "$$T/$$f.key.tmp" "$$T/$$f.crt.tmp"
          mv -f "$$T/$$f.key.tmp" "$$T/$$f.key"
          mv -f "$$T/$$f.crt.tmp" "$$T/$$f.crt"
        done
        chgrp 1000 "$$T/ca.crt"
    volumes:
      - {type: volume, source: secrets, target: /var/lib/chelabase/secrets}
      # The install's .env, for its CHELABASE_SEED_* values (m12): a mount only, never an env
      # file. It must exist (`cp .env.example .env`).
      - type: bind
        source: ./.env
        target: /run/chelabase/seeds.env
        read_only: true
        bind: {create_host_path: false}
      - {type: tmpfs, target: /run/chelabase/tmp}

  # Sets up the identity service's database role and members pool once the orchestrator has
  # migrated the metadata database (chelabase-init bootstrap); retries readiness on its own and
  # is never restarted, so `up --wait` reports a failure. Writes only bootstrap/ (its lock).
  init-bootstrap:
    image: ${CHELABASE_IMAGE_REPO:-ghcr.io/chelabase}/init:${CHELABASE_IMAGE_TAG:-ff5f35f85415@sha256:88b4b76616b55880528324b70db1d8de58bf7d382772a9650a1d58f7d70dd946}
    restart: "no"
    group_add: ["70"]
    command: ["chelabase-init", "bootstrap", "--out", "/run/chelabase/secrets/bootstrap"]
    environment:
      CHELABASE_MODE: self-hosted
      CHELABASE_PUBLIC_SCHEME: ${CHELABASE_PUBLIC_SCHEME:-http}
      CHELABASE_STUDIO_HOST: ${CHELABASE_STUDIO_HOST:-studio.chelabase.localhost:8000}
      CHELABASE_API_HOST: ${CHELABASE_API_HOST:-api.chelabase.localhost:8000}
      CHELABASE_AUTH_HOST: ${CHELABASE_AUTH_HOST:-auth.chelabase.localhost:8000}
      CHELABASE_METADATA_DATABASE_URL: postgres://chelabase@metadata-db:5432/chelabase_metadata
      CHELABASE_METADATA_DATABASE_PASSWORD_FILE: /run/chelabase/secrets/db/metadata.password
      CHELABASE_ORCHESTRATOR_HEALTH_URL: http://orchestrator:8083/health
      # The identity step (auth-replacement m5): the chelabase_identity role and its password
      # (identity/db.password), the identity_admin functions, then the members pool through the
      # service's pool route, with the bootstrap's own token (identity lets it create a pool and
      # nothing else).
      CHELABASE_IDENTITY_URL: http://identity:8080
      CHELABASE_IDENTITY_DB_PASSWORD_FILE: /run/chelabase/secrets/identity/db.password
      CHELABASE_IDENTITY_TOKEN_FILE: /run/chelabase/secrets/tokens/bootstrap-identity.token
    volumes:
      - {type: volume, source: secrets, target: /run/chelabase/secrets/db/metadata.password, read_only: true, volume: {subpath: db/metadata.password}}
      - {type: volume, source: secrets, target: /run/chelabase/secrets/bootstrap, volume: {subpath: bootstrap}}
      - {type: volume, source: secrets, target: /run/chelabase/secrets/identity/db.password, read_only: true, volume: {subpath: identity/db.password}}
      - {type: volume, source: secrets, target: /run/chelabase/secrets/tokens/bootstrap-identity.token, read_only: true, volume: {subpath: tokens/bootstrap-identity.token}}
    depends_on:
      init-secrets:
        condition: service_completed_successfully
      orchestrator:
        condition: service_started
      identity:
        condition: service_healthy

  # --- Infra -------------------------------------------------------------------------------
  metadata-db:
    image: postgres:17.11-alpine@sha256:b0f9560a2de083e2cc7382e75f808c7381a32852a7ec49117deedb300e552b24
    restart: unless-stopped
    environment:
      POSTGRES_USER: chelabase
      POSTGRES_PASSWORD_FILE: /run/chelabase/secrets/db/metadata.password
      POSTGRES_DB: chelabase_metadata
    volumes:
      - metadata_pg_data:/var/lib/postgresql/data
      - {type: volume, source: secrets, target: /run/chelabase/secrets/db/metadata.password, read_only: true, volume: {subpath: db/metadata.password}}
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U chelabase -d chelabase_metadata"]
      interval: 5s
      timeout: 5s
      retries: 10
    depends_on:
      init-secrets:
        condition: service_completed_successfully

  nats:
    image: nats:2.15.0-alpine@sha256:ac8f88a6494bffc2c2a5289a0ca61cb28a9145c11ba5677cf24265d07f46d8d4
    restart: unless-stopped
    # RT1 T1 (R11): one account, one user per service with its own permissions and inbox prefix
    # (nats/nats.conf includes auth.conf: the users, bcrypt hashes only). No anonymous access.
    # Not on the compute network. Runs as root, which reads auth.conf (0600, the app user's).
    command: ["-c", "/etc/nats/nats.conf", "--jetstream", "--store_dir=/data", "-m", "8222"]
    volumes:
      - nats_data:/data
      - type: bind
        source: ./nats/nats.conf
        target: /etc/nats/nats.conf
        read_only: true
        bind: {create_host_path: false}
      - {type: volume, source: secrets, target: /etc/nats/auth.conf, read_only: true, volume: {subpath: nats/auth.conf}}
    healthcheck:
      test: ["CMD", "wget", "-qO-", "http://localhost:8222/healthz"]
      interval: 5s
      timeout: 5s
      retries: 10
    # NATS reads auth.conf at start only. An upgrade's init-secrets (a new image, so updated)
    # can re-render it with a new service's user (storage's, m19): Compose restarts NATS then.
    # A rerun of the same init-secrets restarts nothing.
    depends_on:
      init-secrets:
        condition: service_completed_successfully
        restart: true

  # Valkey (BSD-3-Clause, speaks the Redis protocol). Neon's proxy uses it for query cancel and
  # for the cache-clearing messages the control plane publishes on a password change; realtime
  # keeps its tickets and counters in it. RT1 T1 (P5, S6): ACL users only (`default` off), from
  # users.acl (SHA-256 hashes only). It runs as the image's user (999:1000), and reads its two
  # files through group 1000; nothing is persisted (`--save ""`: every key is short-lived). Not on
  # the compute network. TLS is a platform-mode setting.
  valkey:
    image: valkey/valkey:9.1.2-alpine@sha256:48332870af354a799964c0012ae1194a0bf2bf894eb508f945810596dc2d8d11
    restart: unless-stopped
    command: ["valkey-server", "--aclfile", "/etc/valkey/users.acl", "--save", "", "--appendonly", "no"]
    volumes:
      - valkey_data:/data
      - {type: volume, source: secrets, target: /etc/valkey/users.acl, read_only: true, volume: {subpath: valkey/users.acl}}
      - {type: volume, source: secrets, target: /run/valkey-health.password, read_only: true, volume: {subpath: valkey/health.password}}
    # Ruling (f): the healthcheck logs in as `health`, which may only PING.
    healthcheck:
      # The password goes through the environment (VALKEYCLI_AUTH), never valkey-cli's arguments.
      test: ["CMD-SHELL", "VALKEYCLI_AUTH=\"$$(cat /run/valkey-health.password)\" valkey-cli --no-auth-warning --user health ping | grep -qx PONG"]
      interval: 2s
      timeout: 5s
      retries: 30
    depends_on:
      init-secrets:
        condition: service_completed_successfully

  # --- Neon storage ------------------------------------------------------
  # Flags and health checks come from the old cheladb repo's core/docker/docker-compose.yml,
  # checked there against the pinned Neon source.

  # All-in-one SeaweedFS (master, volume, filer, S3) for pageserver layers and safekeeper WAL,
  # and for user objects (bucket `chelabase-storage`, written by the storage service).
  # and for function bundles (bucket `chelabase-functions`, written by the functions service).
  # Three S3 identities are rendered from their key files into a private file of the container
  # (SeaweedFS takes them only in that JSON; the key files hold no quote or backslash):
  #   neon       Read/Write/List/Tagging on bucket `neon` only (SeaweedFS reads `Action:bucket`)
  #   storage    the same on bucket `chelabase-storage` only
  #   functions  Read/Write/List on bucket `chelabase-functions` only
  # No admin identity exists: every bucket is made over loopback by `weed shell` (below).
  # Master (9333), volume (8080) and filer (8888) have no auth and bypass S3 IAM, and so do the
  # gRPC ports (+10000) of those three and of the S3 server (18333). The first three bind to and
  # advertise 127.0.0.1; S3 (8333) and its gRPC listen on the network, so every gRPC listener
  # requires a client certificate of the stack's CA (security.toml, written from the mounted
  # grpc-tls files; the paths are in it, no secret). The Iceberg and Lance catalog ports and the
  # embedded IAM API are off, so identities change only through the s3.json.
  # `weed server` stays the container's process (a crash restarts it); the bucket step is a
  # background loop that touches /tmp/buckets-ready once every bucket is listed.
  seaweedfs:
    image: chrislusf/seaweedfs:4.47@sha256:ce9e796f1fe6f06968f4c04bdaf8f678dad9c8acdfef3d244133d71bfa6bf882
    restart: unless-stopped
    entrypoint: ["/bin/sh", "-c"]
    command:
      - |
        set -e
        umask 077
        # The S3 identities' keys go from their files into s3.json through stdin and stdout only
        # (tr drops the newline), so no key is ever a program argument or a shell variable.
        key() { tr -d '\n' < "/run/chelabase/secrets/$$1"; }
        {
          printf '{"identities": [\n  {"name": "neon",\n   "credentials": [{"accessKey": "'
          key s3/access-key; printf '", "secretKey": "'; key s3/secret-key
          printf '"}],\n   "actions": ["Read:neon", "Write:neon", "List:neon", "Tagging:neon"]},\n'
          printf '  {"name": "storage",\n   "credentials": [{"accessKey": "'
          key storage-s3/access-key; printf '", "secretKey": "'; key storage-s3/secret-key
          printf '"}],\n   "actions": ["Read:chelabase-storage", "Write:chelabase-storage", "List:chelabase-storage", "Tagging:chelabase-storage"]},\n'
          printf '  {"name": "functions",\n   "credentials": [{"accessKey": "'
          key functions-s3/access-key; printf '", "secretKey": "'; key functions-s3/secret-key
          printf '"}],\n   "actions": ["Read:chelabase-functions", "Write:chelabase-functions", "List:chelabase-functions"]}]}\n'
        } > /tmp/s3.json
        D=/run/chelabase/secrets/grpc-tls
        mkdir -p /etc/seaweedfs
        {
          echo '[grpc]'; echo "ca = \"$$D/ca.crt\""
          for c in master volume filer s3; do
            printf '[grpc.%s]\ncert = "%s/server.crt"\nkey = "%s/server.key"\nclient_cert = "%s/client.crt"\nclient_key = "%s/client.key"\n' "$$c" "$$D" "$$D" "$$D" "$$D"
          done
          printf '[grpc.client]\ncert = "%s/client.crt"\nkey = "%s/client.key"\n' "$$D" "$$D"
        } > /etc/seaweedfs/security.toml
        # The bucket step: up to 40 tries of at most 10s + 2s (8 minutes; the healthcheck's
        # start_period covers it). On exhaustion it logs the last output and ends the container
        # (SIGTERM to weed, PID 1), so the restart policy retries and the reason is in the logs.
        # On success it stays as a `sleep` instead of exiting, so weed never has a zombie child.
        (
          i=0; out=
          while [ "$$i" -lt 40 ]; do
            out="$$(printf 's3.bucket.create -name neon\ns3.bucket.create -name chelabase-storage\ns3.bucket.create -name chelabase-functions\ns3.bucket.list\n' |
              timeout 10 weed shell -master=127.0.0.1:9333 -filer=127.0.0.1:8888 2>&1 || true)"
            if printf '%s' "$$out" | grep -qw neon && printf '%s' "$$out" | grep -qw chelabase-storage &&
              printf '%s' "$$out" | grep -qw chelabase-functions; then
              touch /tmp/buckets-ready; exec sleep 2147483647
            fi
            i=$$((i + 1)); sleep 2
          done
          echo "seaweedfs: buckets neon, chelabase-storage and chelabase-functions not created after 40 tries; last weed shell output:" >&2
          printf '%s\n' "$$out" >&2
          kill 1
        ) &
        exec weed server -ip=127.0.0.1 -ip.bind=127.0.0.1 -s3 -s3.ip.bind=0.0.0.0 -s3.iam=false -s3.port.iceberg=0 -s3.port.lance=0 -s3.config=/tmp/s3.json -dir=/data -volume.max=64 -master.volumeSizeLimitMB=1024
    volumes:
      - neon_seaweedfs_data:/data
      - {type: volume, source: secrets, target: /run/chelabase/secrets/s3/access-key, read_only: true, volume: {subpath: s3/access-key}}
      - {type: volume, source: secrets, target: /run/chelabase/secrets/s3/secret-key, read_only: true, volume: {subpath: s3/secret-key}}
      - {type: volume, source: secrets, target: /run/chelabase/secrets/storage-s3/access-key, read_only: true, volume: {subpath: storage-s3/access-key}}
      - {type: volume, source: secrets, target: /run/chelabase/secrets/storage-s3/secret-key, read_only: true, volume: {subpath: storage-s3/secret-key}}
      - {type: volume, source: secrets, target: /run/chelabase/secrets/functions-s3/access-key, read_only: true, volume: {subpath: functions-s3/access-key}}
      - {type: volume, source: secrets, target: /run/chelabase/secrets/functions-s3/secret-key, read_only: true, volume: {subpath: functions-s3/secret-key}}
      - {type: volume, source: secrets, target: /run/chelabase/secrets/grpc-tls/ca.crt, read_only: true, volume: {subpath: grpc-tls/ca.crt}}
      - {type: volume, source: secrets, target: /run/chelabase/secrets/grpc-tls/server.crt, read_only: true, volume: {subpath: grpc-tls/server.crt}}
      - {type: volume, source: secrets, target: /run/chelabase/secrets/grpc-tls/server.key, read_only: true, volume: {subpath: grpc-tls/server.key}}
      - {type: volume, source: secrets, target: /run/chelabase/secrets/grpc-tls/client.crt, read_only: true, volume: {subpath: grpc-tls/client.crt}}
      - {type: volume, source: secrets, target: /run/chelabase/secrets/grpc-tls/client.key, read_only: true, volume: {subpath: grpc-tls/client.key}}
    # Healthy = every bucket exists and S3 answers an unsigned request with its error document.
    healthcheck:
      test:
        - CMD-SHELL
        - |
          [ -e /tmp/buckets-ready ] && printf 'GET / HTTP/1.0\r\n\r\n' | nc -w 3 127.0.0.1 8333 | grep -q '<Code>AccessDenied</Code>'
      interval: 2s
      retries: 60
      start_period: 8m
    depends_on:
      init-secrets:
        condition: service_completed_successfully

  # Kept as the one-shot the Neon services wait on: seaweedfs is healthy once both buckets exist
  # (made inside it), so this only waits for that. It holds no S3 credential.
  create-bucket:
    image: *neon-image
    restart: "no"
    entrypoint: ["/bin/true"]
    depends_on:
      seaweedfs:
        condition: service_healthy

  storage-broker:
    image: *neon-image
    restart: unless-stopped
    command: ["storage_broker", "--listen-addr=0.0.0.0:50051"]
    healthcheck:
      test: ["CMD", "bash", "-c", "</dev/tcp/127.0.0.1/50051"]
      interval: 2s
      retries: 60

  # Three safekeepers, each with its WAL on its own volume: the storage controller runs without
  # --dev, which needs every timeline on 3 (RT1 T1, user). The worker reads each timeline's
  # commit LSN from their HTTP APIs (CHELABASE_SAFEKEEPER_HTTP, by service name). NeonJWT on the
  # WAL service and the HTTP API (the compute presents its tenant token, the pageserver and the
  # storage controller safekeeperdata); peers use safekeeperdata too. On the compute network:
  # computes stream WAL to them.
  safekeeper1:
    image: *neon-image
    restart: unless-stopped
    entrypoint: *neon-s3-from-files
    environment:
      AWS_DEFAULT_REGION: us-east-1
    command:
      - safekeeper
      - --id=1
      - -D
      - /data
      - --listen-pg=0.0.0.0:5454
      - --listen-http=0.0.0.0:7676
      - --advertise-pg=safekeeper1:5454
      - --availability-zone=az-1
      - --broker-endpoint=http://storage-broker:50051
      - "--remote-storage={endpoint='${CHELABASE_NEON_S3_ENDPOINT:-http://seaweedfs:8333}', bucket_name='neon', bucket_region='us-east-1', prefix_in_bucket='/safekeeper/'}"
      - --pg-auth-public-key-path=/run/storage-auth.pub.pem
      - --http-auth-public-key-path=/run/storage-auth.pub.pem
      - --auth-token-path=/run/safekeeper-data.jwt
    networks:
      default: {}
      compute: {}
    volumes:
      - neon_safekeeper1_data:/data
      - {type: volume, source: secrets, target: /run/chelabase/secrets/s3/access-key, read_only: true, volume: {subpath: s3/access-key}}
      - {type: volume, source: secrets, target: /run/chelabase/secrets/s3/secret-key, read_only: true, volume: {subpath: s3/secret-key}}
      - {type: volume, source: secrets, target: /run/storage-auth.pub.pem, read_only: true, volume: {subpath: neon/compute-jwt.pub.pem}}
      - {type: volume, source: secrets, target: /run/safekeeper-data.jwt, read_only: true, volume: {subpath: neon/storage-tokens/safekeeper-data.jwt}}
    healthcheck:
      test: ["CMD", "curl", "-fsS", "http://127.0.0.1:7676/v1/status"]
      interval: 2s
      retries: 60
    depends_on:
      storage-broker:
        condition: service_healthy
      create-bucket:
        condition: service_completed_successfully

  safekeeper2:
    image: *neon-image
    restart: unless-stopped
    entrypoint: *neon-s3-from-files
    environment:
      AWS_DEFAULT_REGION: us-east-1
    command:
      - safekeeper
      - --id=2
      - -D
      - /data
      - --listen-pg=0.0.0.0:5454
      - --listen-http=0.0.0.0:7676
      - --advertise-pg=safekeeper2:5454
      - --availability-zone=az-2
      - --broker-endpoint=http://storage-broker:50051
      - "--remote-storage={endpoint='${CHELABASE_NEON_S3_ENDPOINT:-http://seaweedfs:8333}', bucket_name='neon', bucket_region='us-east-1', prefix_in_bucket='/safekeeper/'}"
      - --pg-auth-public-key-path=/run/storage-auth.pub.pem
      - --http-auth-public-key-path=/run/storage-auth.pub.pem
      - --auth-token-path=/run/safekeeper-data.jwt
    networks:
      default: {}
      compute: {}
    volumes:
      - neon_safekeeper2_data:/data
      - {type: volume, source: secrets, target: /run/chelabase/secrets/s3/access-key, read_only: true, volume: {subpath: s3/access-key}}
      - {type: volume, source: secrets, target: /run/chelabase/secrets/s3/secret-key, read_only: true, volume: {subpath: s3/secret-key}}
      - {type: volume, source: secrets, target: /run/storage-auth.pub.pem, read_only: true, volume: {subpath: neon/compute-jwt.pub.pem}}
      - {type: volume, source: secrets, target: /run/safekeeper-data.jwt, read_only: true, volume: {subpath: neon/storage-tokens/safekeeper-data.jwt}}
    healthcheck:
      test: ["CMD", "curl", "-fsS", "http://127.0.0.1:7676/v1/status"]
      interval: 2s
      retries: 60
    depends_on:
      storage-broker:
        condition: service_healthy
      create-bucket:
        condition: service_completed_successfully

  safekeeper3:
    image: *neon-image
    restart: unless-stopped
    entrypoint: *neon-s3-from-files
    environment:
      AWS_DEFAULT_REGION: us-east-1
    command:
      - safekeeper
      - --id=3
      - -D
      - /data
      - --listen-pg=0.0.0.0:5454
      - --listen-http=0.0.0.0:7676
      - --advertise-pg=safekeeper3:5454
      - --availability-zone=az-3
      - --broker-endpoint=http://storage-broker:50051
      - "--remote-storage={endpoint='${CHELABASE_NEON_S3_ENDPOINT:-http://seaweedfs:8333}', bucket_name='neon', bucket_region='us-east-1', prefix_in_bucket='/safekeeper/'}"
      - --pg-auth-public-key-path=/run/storage-auth.pub.pem
      - --http-auth-public-key-path=/run/storage-auth.pub.pem
      - --auth-token-path=/run/safekeeper-data.jwt
    networks:
      default: {}
      compute: {}
    volumes:
      - neon_safekeeper3_data:/data
      - {type: volume, source: secrets, target: /run/chelabase/secrets/s3/access-key, read_only: true, volume: {subpath: s3/access-key}}
      - {type: volume, source: secrets, target: /run/chelabase/secrets/s3/secret-key, read_only: true, volume: {subpath: s3/secret-key}}
      - {type: volume, source: secrets, target: /run/storage-auth.pub.pem, read_only: true, volume: {subpath: neon/compute-jwt.pub.pem}}
      - {type: volume, source: secrets, target: /run/safekeeper-data.jwt, read_only: true, volume: {subpath: neon/storage-tokens/safekeeper-data.jwt}}
    healthcheck:
      test: ["CMD", "curl", "-fsS", "http://127.0.0.1:7676/v1/status"]
      interval: 2s
      retries: 60
    depends_on:
      storage-broker:
        condition: service_healthy
      create-bucket:
        condition: service_completed_successfully

  storcon-db:
    image: postgres:17.11-alpine@sha256:b0f9560a2de083e2cc7382e75f808c7381a32852a7ec49117deedb300e552b24
    restart: unless-stopped
    environment:
      POSTGRES_USER: storcon
      POSTGRES_PASSWORD_FILE: /run/chelabase/secrets/db/storcon.password
      POSTGRES_DB: storage_controller
    volumes:
      - neon_storcon_pg_data:/var/lib/postgresql/data
      - {type: volume, source: secrets, target: /run/chelabase/secrets/db/storcon.password, read_only: true, volume: {subpath: db/storcon.password}}
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U storcon -d storage_controller"]
      interval: 2s
      retries: 60
    depends_on:
      init-secrets:
        condition: service_completed_successfully

  # Strict mode (no --dev, RT1 T1 user decision): every caller presents a NeonJWT signed with the
  # compute-JWT key pair (PUBLIC_KEY, a public key, exported by the entrypoint); it presents
  # scoped tokens to the pageserver and the safekeepers, and the generated hook token to the
  # orchestrator. It reads each token from its mount itself (`--*-jwt-token-file`), so no
  # secret is in its environment or its arguments (fork round 4, F6). Its database connection
  # takes the password only inside the connection string: the entrypoint builds a key=value one
  # (the password single-quoted; the file holds no quote or backslash) into DATABASE_URL, which
  # the controller reads when --database-url is absent. Runs as the app user (the hook token's
  # owner) in groups 1000 (the storage tokens) and 70 (the storcon password).
  storage-controller:
    image: *neon-image
    restart: unless-stopped
    user: "10001:1000"
    group_add: ["70"]
    entrypoint:
      - /bin/sh
      - -c
      - >-
        set -e;
        export PUBLIC_KEY="$$(cat /run/storage-auth.pub.pem)";
        export DATABASE_URL="host=storcon-db port=5432 user=storcon dbname=storage_controller password='$$(cat /run/chelabase/secrets/db/storcon.password)'";
        exec storage_controller "$$@"
      - storage_controller
    command:
      - --listen=0.0.0.0:1234
      - --pageserver-jwt-token-file=/run/pageserver-api.jwt
      - --safekeeper-jwt-token-file=/run/safekeeper-data.jwt
      - --control-plane-jwt-token-file=/run/storcon-hook.token
      # Attachment changes (every tenant create, too) are pushed to the orchestrator's
      # internal listener, by service name; a tenant's reconcile waits until it answers.
      - --control-plane-url=http://orchestrator:8083/storcon
      # The controller creates and deletes each timeline on the safekeepers (all three).
      # Without these, the compute creates them implicitly and a deleted database, branch or
      # superseded timeline leaves its WAL on the safekeepers and in S3.
      - --timelines-onto-safekeepers
      - --timeline-safekeeper-count=3
    volumes:
      - {type: volume, source: secrets, target: /run/chelabase/secrets/db/storcon.password, read_only: true, volume: {subpath: db/storcon.password}}
      - {type: volume, source: secrets, target: /run/storcon-hook.token, read_only: true, volume: {subpath: tokens/storcon-hook.token}}
      - {type: volume, source: secrets, target: /run/storage-auth.pub.pem, read_only: true, volume: {subpath: neon/compute-jwt.pub.pem}}
      - {type: volume, source: secrets, target: /run/pageserver-api.jwt, read_only: true, volume: {subpath: neon/storage-tokens/pageserver-api.jwt}}
      - {type: volume, source: secrets, target: /run/safekeeper-data.jwt, read_only: true, volume: {subpath: neon/storage-tokens/safekeeper-data.jwt}}
    healthcheck:
      test: ["CMD", "curl", "-fsS", "http://127.0.0.1:1234/ready"]
      interval: 2s
      retries: 60
    depends_on:
      storcon-db:
        condition: service_healthy

  # Registers with the storage controller from metadata.json at startup. NeonJWT on its page
  # service and HTTP API (RT1 T1, user): computes present their tenant token, the storage
  # controller pageserverapi. Its upcalls carry generations_api, its WAL reads from the
  # safekeepers safekeeperdata (--auth-token-file). On the compute network: computes read pages.
  pageserver:
    image: *neon-image
    restart: unless-stopped
    entrypoint: *neon-s3-from-files
    environment:
      AWS_DEFAULT_REGION: us-east-1
    command:
      - /bin/sh
      - -c
      - |
        set -e
        mkdir -p /data/.neon
        echo 'id=1' > /data/.neon/identity.toml
        umask 077
        cat > /data/.neon/pageserver.toml <<EOT
        broker_endpoint='http://storage-broker:50051'
        pg_distrib_dir='/usr/local/'
        listen_pg_addr='0.0.0.0:6400'
        listen_http_addr='0.0.0.0:9898'
        http_auth_type='NeonJWT'
        pg_auth_type='NeonJWT'
        auth_validation_public_key_path='/run/storage-auth.pub.pem'
        control_plane_api='http://storage-controller:1234/upcall/v1/'
        control_plane_api_token='$$(cat /run/generations-api.jwt)'
        virtual_file_io_mode='buffered'
        remote_storage={ endpoint='${CHELABASE_NEON_S3_ENDPOINT:-http://seaweedfs:8333}', bucket_name='neon', bucket_region='us-east-1', prefix_in_bucket='/pageserver' }
        EOT
        echo '{"host":"pageserver","port":6400,"http_host":"pageserver","http_port":9898,"availability_zone_id":"az-1"}' > /data/.neon/metadata.json
        exec pageserver -D /data/.neon --auth-token-file=/run/safekeeper-data.jwt
    networks:
      default: {}
      compute: {}
    volumes:
      - neon_pageserver_data:/data
      - {type: volume, source: secrets, target: /run/chelabase/secrets/s3/access-key, read_only: true, volume: {subpath: s3/access-key}}
      - {type: volume, source: secrets, target: /run/chelabase/secrets/s3/secret-key, read_only: true, volume: {subpath: s3/secret-key}}
      - {type: volume, source: secrets, target: /run/storage-auth.pub.pem, read_only: true, volume: {subpath: neon/compute-jwt.pub.pem}}
      - {type: volume, source: secrets, target: /run/generations-api.jwt, read_only: true, volume: {subpath: neon/storage-tokens/generations-api.jwt}}
      - {type: volume, source: secrets, target: /run/safekeeper-data.jwt, read_only: true, volume: {subpath: neon/storage-tokens/safekeeper-data.jwt}}
    healthcheck:
      test: ["CMD", "curl", "-fsS", "http://127.0.0.1:9898/v1/status"]
      interval: 2s
      retries: 60
    depends_on:
      storage-broker:
        condition: service_healthy
      storage-controller:
        condition: service_healthy
      create-bucket:
        condition: service_completed_successfully

  # One-shot: registers the three safekeepers with the storage controller (with its admin
  # NeonJWT) and marks them Active; computes get them from the storage controller.
  register-safekeepers:
    image: *neon-image
    restart: "no"
    entrypoint: ["/bin/sh", "-c"]
    command:
      - |
        set -e
        S=http://storage-controller:1234
        # The bearer goes to curl in a header file (`-H @file`), never on its command line.
        umask 077
        H="$$(mktemp)"
        trap 'rm -f "$$H"' EXIT
        { printf 'Authorization: Bearer '; tr -d '\r\n' < /run/storcon-admin.jwt; echo; } > "$$H"
        for ID in 1 2 3; do
          curl -fsS -X POST -H 'Content-Type: application/json' -H "@$$H" \
            -d "{\"id\":$$ID,\"created_at\":\"2023-10-25T09:11:25Z\",\"updated_at\":\"2024-08-28T11:32:43Z\",\"region_id\":\"local\",\"host\":\"safekeeper$$ID\",\"port\":5454,\"http_port\":7676,\"https_port\":null,\"version\":5957,\"availability_zone_id\":\"az-$$ID\"}" \
            $$S/control/v1/safekeeper/$$ID
          curl -fsS -X POST -H 'Content-Type: application/json' -H "@$$H" \
            -d '{"scheduling_policy":"Active"}' $$S/control/v1/safekeeper/$$ID/scheduling_policy
        done
    volumes:
      - {type: volume, source: secrets, target: /run/storcon-admin.jwt, read_only: true, volume: {subpath: neon/storage-tokens/storcon-admin.jwt}}
    depends_on:
      storage-controller:
        condition: service_healthy
      safekeeper1:
        condition: service_healthy
      safekeeper2:
        condition: service_healthy
      safekeeper3:
        condition: service_healthy

  # Writes the proxy's TLS certificate: a local CA (made once, kept) and a certificate for
  # *.CHELABASE_PROXY_DOMAIN signed by it. The proxy routes a connection by its TLS server name
  # (<endpoint>.<domain>, the domain taken from the certificate's CN), so a changed domain issues
  # a new certificate from the same CA: clients keep trusting the CA they fetched. Clients verify
  # against the CA (`docker compose cp proxy:/tls/ca.crt proxy-ca.crt`). The proxy runs as the app
  # user and reads tls.key.
  proxy-tls:
    image: *neon-image
    restart: "no"
    user: "0"
    environment:
      CHELABASE_PROXY_DOMAIN: ${CHELABASE_PROXY_DOMAIN:-localtest.me}
    entrypoint: ["/bin/sh", "-c"]
    command:
      - |
        set -e
        cd /tls
        owner="10001:10001"
        domain="$$CHELABASE_PROXY_DOMAIN"
        # A lowercase DNS name with at least one dot (the certificate is *.<domain>).
        if ! printf '%s' "$$domain" | grep -Eqx '([a-z0-9]([a-z0-9-]*[a-z0-9])?\.)+[a-z0-9]([a-z0-9-]*[a-z0-9])?'; then
          echo "proxy-tls: CHELABASE_PROXY_DOMAIN=$$domain in .env is not a lowercase DNS name with a dot (e.g. db.example.com)" >&2
          exit 1
        fi
        if [ -s tls.crt ] && [ "$$(openssl x509 -in tls.crt -noout -subject -nameopt RFC2253)" = "subject=CN=*.$$domain" ]; then
          chown "$$owner" tls.key tls.crt ca.crt
          echo "certificate for *.$$domain exists"; exit 0
        fi
        [ -s ca.key ] || openssl req -x509 -newkey ec -pkeyopt ec_paramgen_curve:P-256 -nodes \
          -keyout ca.key -out ca.crt -days 3650 -subj "/CN=Chelabase local CA"
        openssl req -newkey ec -pkeyopt ec_paramgen_curve:P-256 -nodes -keyout tls.key -out tls.csr \
          -subj "/CN=*.$$domain"
        printf 'subjectAltName=DNS:*.%s\n' "$$domain" > ext.cnf
        openssl x509 -req -in tls.csr -CA ca.crt -CAkey ca.key -CAcreateserial -days 825 \
          -extfile ext.cnf -out tls.crt
        rm -f tls.csr ext.cnf
        chown "$$owner" tls.key tls.crt ca.crt
        chmod 600 ca.key tls.key
        echo "issued a certificate for *.$$domain"
    volumes: ["neon_proxy_tls:/tls"]
    network_mode: none

  # Neon's proxy. Clients connect to <endpoint-id>.<CHELABASE_PROXY_DOMAIN> (default
  # localtest.me, which resolves to loopback): Postgres wire on 4432 and SQL over HTTP on 4444,
  # published on CHELABASE_PROXY_ADDR (default 127.0.0.1) at CHELABASE_PROXY_PORT (default 5432)
  # and CHELABASE_PROXY_HTTP_PORT (default 4444). The orchestrator's connection details name the
  # same host and ports. It asks the orchestrator's internal listener for role secrets and
  # compute addresses, and reaches computes on the compute network. Role secrets are cached for at
  # most a minute, and dropped at once when the control plane publishes /password_updated to
  # Valkey.
  # RT1 T1 (S6, S27): it logs in to Valkey as the `proxy` ACL user and calls the orchestrator
  # with its generated token, each read from its file. Runs as the app user (their owner).
  proxy:
    image: *neon-image
    restart: unless-stopped
    user: "10001:10001"
    entrypoint:
      - /bin/sh
      - -c
      - >-
        exec proxy --redis-plain=redis://proxy@valkey:6379 --redis-plain-password-file=/run/valkey-proxy.password --control-plane-token-file=/run/proxy-api.token "$$@"
      - proxy
    command:
      - --auth-backend=control-plane
      - --auth-endpoint=http://orchestrator:8083/proxy/api/v1
      - --proxy=0.0.0.0:4432
      - --wss=0.0.0.0:4444
      # The proxy takes the endpoint domain from the certificate's CN.
      - --tls-cert=/tls/tls.crt
      - --tls-key=/tls/tls.key
      - --project-info-cache=size=10000,ttl=1m,max_roles=64,gc_interval=60m
      - --redis-auth-type=plain
    # 5432, the Postgres default, so clients need no port; it is free beside a workbench (4432,
    # 4500-4599). Move it when the host runs its own Postgres.
    ports:
      - "${CHELABASE_PROXY_ADDR:-127.0.0.1}:${CHELABASE_PROXY_PORT:-5432}:4432"
      - "${CHELABASE_PROXY_ADDR:-127.0.0.1}:${CHELABASE_PROXY_HTTP_PORT:-4444}:4444"
    networks:
      default: {}
      compute: {}
    volumes:
      - neon_proxy_tls:/tls:ro
      - {type: volume, source: secrets, target: /run/valkey-proxy.password, read_only: true, volume: {subpath: valkey/proxy.password}}
      - {type: volume, source: secrets, target: /run/proxy-api.token, read_only: true, volume: {subpath: tokens/proxy-api.token}}
    healthcheck:
      test: ["CMD", "bash", "-c", "</dev/tcp/127.0.0.1/4432"]
      interval: 2s
      retries: 60
    depends_on:
      proxy-tls:
        condition: service_completed_successfully
      # The proxy exits if it can't reach Redis at startup.
      valkey:
        condition: service_healthy

  # --- The app tier ---------------------------------------------------------------------------
  # The release images (infra/images), as the app user 10001. Each app's own credentials come
  # from its own files (by <NAME>_FILE); listeners bind 0.0.0.0 inside and every URL is a service
  # name. The gateway is the one way in from the host for HTTP (the proxy for Postgres). CHELABASE_IMAGE_REPO and
  # CHELABASE_IMAGE_TAG pick the images (docker-compose.build.yml builds them from the clone).

  # The identity service (auth-replacement; Better Auth behind its own JSON API). Internal only: on the project network, no published port, no
  # gateway route. auth, the orchestrator, the worker and the bootstrap call it, each with its
  # own bearer (tokens/<caller>-identity.token), which it checks per route.
  # Its database is the metadata server's, as `chelabase_identity`: no CREATE on the database and
  # no grant on Chelabase's schemas; it owns only its pool schemas (identity_members,
  # identity_app_<hex>), made through identity_admin's SECURITY DEFINER functions. The bootstrap
  # makes the role and sets its password from identity/db.password (so the service answers its
  # health route before that, and its first database call waits for the bootstrap). The service
  # takes its database URL only from a file: the entrypoint writes it from the password file
  # (base64url, checked) into a private tmpfs. Outgoing mail: .env's CHELABASE_SMTP_* (the
  # password from the host file CHELABASE_SMTP_PASSWORD_PATH: uid 10001, mode 0600).
  # Its image is a pinned release image like the apps' (CHELABASE_IMAGE_REPO and
  # CHELABASE_IMAGE_TAG pick it too).
  identity:
    image: ${CHELABASE_IMAGE_REPO:-ghcr.io/chelabase}/identity:${CHELABASE_IMAGE_TAG:-ff5f35f85415@sha256:6f6292e2e788f3ec527837e1c99f358365bd709d742e470a45715d86737eabf5}
    restart: unless-stopped
    user: "10001:10001"
    read_only: true
    entrypoint:
      - /bin/sh
      - -c
      - |
        set -eu
        umask 077
        pw=""
        IFS= read -r pw <"$$CHELABASE_IDENTITY_DB_PASSWORD_FILE" || [ -n "$$pw" ]
        case "$$pw" in
          "" | *[!A-Za-z0-9_-]*)
            echo "identity: $$CHELABASE_IDENTITY_DB_PASSWORD_FILE must hold one base64url line" >&2
            exit 1 ;;
        esac
        # The user info is one argument: no password is ever in this file's text.
        printf 'postgres://%s@%s/%s\n' "$$CHELABASE_IDENTITY_DB_USER:$$pw" \
          "$$CHELABASE_IDENTITY_DB_HOST" "$$CHELABASE_IDENTITY_DB_NAME" >/run/identity/database.url
        unset pw
        export CHELABASE_IDENTITY_DATABASE_URL_FILE=/run/identity/database.url
        exec "$$@"
      - identity
    command: ["node", "src/main.ts"]
    environment:
      CHELABASE_IDENTITY_HOST: 0.0.0.0
      CHELABASE_IDENTITY_PORT: "8080"
      CHELABASE_IDENTITY_DB_USER: chelabase_identity
      CHELABASE_IDENTITY_DB_HOST: metadata-db:5432
      CHELABASE_IDENTITY_DB_NAME: chelabase_metadata
      CHELABASE_IDENTITY_DB_PASSWORD_FILE: /run/chelabase/secrets/identity/db.password
      CHELABASE_IDENTITY_SECRET_FILE: /run/chelabase/secrets/identity/secret
      CHELABASE_IDENTITY_AUTH_TOKEN_FILE: /run/chelabase/secrets/tokens/auth-identity.token
      CHELABASE_IDENTITY_ORCHESTRATOR_TOKEN_FILE: /run/chelabase/secrets/tokens/orchestrator-identity.token
      CHELABASE_IDENTITY_WORKER_TOKEN_FILE: /run/chelabase/secrets/tokens/worker-identity.token
      CHELABASE_IDENTITY_BOOTSTRAP_TOKEN_FILE: /run/chelabase/secrets/tokens/bootstrap-identity.token
      CHELABASE_IDENTITY_POOL_CACHE_SIZE: ${CHELABASE_IDENTITY_POOL_CACHE_SIZE:-256}
      # Optional SMTP (unset: no email; codes go back to the caller only).
      CHELABASE_SMTP_HOST: ${CHELABASE_SMTP_HOST:-}
      CHELABASE_SMTP_PORT: ${CHELABASE_SMTP_PORT:-}
      CHELABASE_SMTP_TLS: ${CHELABASE_SMTP_TLS:-}
      CHELABASE_SMTP_USER: ${CHELABASE_SMTP_USER:-}
      CHELABASE_SMTP_FROM: ${CHELABASE_SMTP_FROM:-}
      CHELABASE_SMTP_PASSWORD_FILE: ${CHELABASE_SMTP_USER:+/run/chelabase/smtp.password}
    volumes:
      - {type: volume, source: secrets, target: /run/chelabase/secrets/identity/secret, read_only: true, volume: {subpath: identity/secret}}
      - {type: volume, source: secrets, target: /run/chelabase/secrets/identity/db.password, read_only: true, volume: {subpath: identity/db.password}}
      - {type: volume, source: secrets, target: /run/chelabase/secrets/tokens/auth-identity.token, read_only: true, volume: {subpath: tokens/auth-identity.token}}
      - {type: volume, source: secrets, target: /run/chelabase/secrets/tokens/orchestrator-identity.token, read_only: true, volume: {subpath: tokens/orchestrator-identity.token}}
      - {type: volume, source: secrets, target: /run/chelabase/secrets/tokens/worker-identity.token, read_only: true, volume: {subpath: tokens/worker-identity.token}}
      - {type: volume, source: secrets, target: /run/chelabase/secrets/tokens/bootstrap-identity.token, read_only: true, volume: {subpath: tokens/bootstrap-identity.token}}
      - type: bind
        source: ${CHELABASE_SMTP_PASSWORD_PATH:-/dev/null}
        target: /run/chelabase/smtp.password
        read_only: true
        bind: {create_host_path: false}
      - {type: tmpfs, target: /tmp}
    # The entrypoint writes the database URL here as uid 10001: a long-form tmpfs mount is
    # root's, so this one is set with its owner.
    tmpfs:
      - /run/identity:uid=10001,gid=10001,mode=0700
    healthcheck:
      <<: *app-health
      test: ["CMD", "node", "-e", "fetch('http://127.0.0.1:8080/health').then(r=>process.exit(r.ok?0:1),()=>process.exit(1))"]
    depends_on:
      init-secrets:
        condition: service_completed_successfully
      metadata-db:
        condition: service_healthy

  orchestrator:
    image: ${CHELABASE_IMAGE_REPO:-ghcr.io/chelabase}/orchestrator:${CHELABASE_IMAGE_TAG:-ff5f35f85415@sha256:8ec1df0075b15389d73c21a8e91c2e649b47ba861fdcfa4ccba644407adb71a1}
    restart: unless-stopped
    user: "0"
    entrypoint: *app-with-docker
    command: ["orchestrator"]
    # RT1 T1 (S1, S27): its own credentials, from its own files below.
    environment:
      <<: *app-env
      CHELABASE_METADATA_DATABASE_PASSWORD_FILE: /run/chelabase/secrets/db/metadata.password
      CHELABASE_SETUP_CODE_FILE: /run/chelabase/secrets/setup/setup.code
      # Where clients reach the proxy (the connection details): <endpoint>.<domain> on the
      # proxy's published ports, and the name of the CA file the docs fetch it to.
      CHELABASE_PROXY_DOMAIN: ${CHELABASE_PROXY_DOMAIN:-localtest.me}
      CHELABASE_PROXY_PG_PORT: ${CHELABASE_PROXY_PORT:-5432}
      CHELABASE_PROXY_HTTP_PORT: ${CHELABASE_PROXY_HTTP_PORT:-4444}
      CHELABASE_PROXY_CA_FILE: ${CHELABASE_PROXY_CA_FILE:-proxy-ca.crt}
      # .env's tunables (blank = the service's default).
      CHELABASE_BRANCH_ROLE_CAP: ${CHELABASE_BRANCH_ROLE_CAP:-}
      CHELABASE_BRANCH_DATABASE_CAP: ${CHELABASE_BRANCH_DATABASE_CAP:-}
      CHELABASE_BRANCH_DATA_API_DATABASE_CAP: ${CHELABASE_BRANCH_DATA_API_DATABASE_CAP:-}
      CHELABASE_PASSWORD_STRENGTH: ${CHELABASE_PASSWORD_STRENGTH:-}
      CHELABASE_APP_REFRESH_TTL_SECS: ${CHELABASE_APP_REFRESH_TTL_SECS:-}
      CHELABASE_MEMBER_SESSION_CHECK_SECS: ${CHELABASE_MEMBER_SESSION_CHECK_SECS:-}
      CHELABASE_NATS_USER: orchestrator
      CHELABASE_NATS_PASSWORD_FILE: /run/chelabase/secrets/nats/orchestrator.password
      CHELABASE_NATS_INBOX_PREFIX: _INBOX_orchestrator
      CHELABASE_VALKEY_USER: control
      CHELABASE_VALKEY_PASSWORD_FILE: /run/chelabase/secrets/valkey/control.password
      CHELABASE_REALTIME_INTERNAL_TOKEN_FILE: /run/chelabase/secrets/realtime/internal.token
      CHELABASE_REST_INTERNAL_TOKEN_FILE: /run/chelabase/secrets/tokens/rest-internal.token
      CHELABASE_DATA_KEYS_TOKEN_FILE: /run/chelabase/secrets/tokens/data-keys.token
      CHELABASE_APP_AUTH_INTERNAL_TOKEN_FILE: /run/chelabase/secrets/tokens/app-auth.token
      CHELABASE_APP_SESSIONS_INTERNAL_TOKEN_FILE: /run/chelabase/secrets/tokens/app-sessions.token
      CHELABASE_STORAGE_INTERNAL_TOKEN_FILE: /run/chelabase/secrets/tokens/storage-internal.token
      # Edge functions (m4b): its bearer for the functions service's bundle uploads.
      CHELABASE_ORCHESTRATOR_FUNCTIONS_TOKEN_FILE: /run/chelabase/secrets/tokens/orchestrator-functions.token
      CHELABASE_PROXY_API_TOKEN_FILE: /run/chelabase/secrets/tokens/proxy-api.token
      CHELABASE_STORCON_HOOK_TOKEN_FILE: /run/chelabase/secrets/tokens/storcon-hook.token
      # auth-replacement m5: its identity bearer.
      CHELABASE_IDENTITY_URL: http://identity:8080
      CHELABASE_IDENTITY_TOKEN_FILE: /run/chelabase/secrets/tokens/orchestrator-identity.token
      # object-storage m18: where storage webhook URLs may point (checked at registration). Blank:
      # https to public addresses only.
      CHELABASE_WEBHOOKS_ALLOW_HOSTS: ${CHELABASE_WEBHOOKS_ALLOW_HOSTS:-}
      CHELABASE_WEBHOOKS_ALLOW_HTTP: ${CHELABASE_WEBHOOKS_ALLOW_HTTP:-}
    # The default network for the apps, `control` for its TLS connections to computes (a static
    # address in the member-login rule), and `compute` (P4): computes call its hooks listener
    # (8083) as `orchestrator`. `functions-control` (m4b): the functions service's internal
    # listener, for bundle uploads.
    networks:
      default: {}
      control:
        ipv4_address: ${CHELABASE_ORCHESTRATOR_CONTROL_IP:-10.214.0.10}
      compute: {}
      functions-control: {}
    volumes:
      - {type: volume, source: secrets, target: /run/chelabase/secrets/secrets/secrets.key, read_only: true, volume: {subpath: secrets/secrets.key}}
      - {type: volume, source: secrets, target: /run/chelabase/secrets/gateway/internal-verify.pem, read_only: true, volume: {subpath: gateway/internal-verify.pem}}
      - {type: volume, source: secrets, target: /run/chelabase/secrets/neon/compute-jwt.pem, read_only: true, volume: {subpath: neon/compute-jwt.pem}}
      - {type: volume, source: secrets, target: /run/chelabase/secrets/neon/compute-jwt.pub, read_only: true, volume: {subpath: neon/compute-jwt.pub}}
      - {type: volume, source: secrets, target: /run/chelabase/secrets/nats/orchestrator.password, read_only: true, volume: {subpath: nats/orchestrator.password}}
      - {type: volume, source: secrets, target: /run/chelabase/secrets/valkey/control.password, read_only: true, volume: {subpath: valkey/control.password}}
      - {type: volume, source: secrets, target: /run/chelabase/secrets/realtime/internal.token, read_only: true, volume: {subpath: realtime/internal.token}}
      - {type: volume, source: secrets, target: /run/chelabase/secrets/tokens/rest-internal.token, read_only: true, volume: {subpath: tokens/rest-internal.token}}
      - {type: volume, source: secrets, target: /run/chelabase/secrets/tokens/data-keys.token, read_only: true, volume: {subpath: tokens/data-keys.token}}
      - {type: volume, source: secrets, target: /run/chelabase/secrets/tokens/app-auth.token, read_only: true, volume: {subpath: tokens/app-auth.token}}
      - {type: volume, source: secrets, target: /run/chelabase/secrets/tokens/app-sessions.token, read_only: true, volume: {subpath: tokens/app-sessions.token}}
      - {type: volume, source: secrets, target: /run/chelabase/secrets/tokens/storage-internal.token, read_only: true, volume: {subpath: tokens/storage-internal.token}}
      - {type: volume, source: secrets, target: /run/chelabase/secrets/tokens/orchestrator-functions.token, read_only: true, volume: {subpath: tokens/orchestrator-functions.token}}
      - {type: volume, source: secrets, target: /run/chelabase/secrets/tokens/proxy-api.token, read_only: true, volume: {subpath: tokens/proxy-api.token}}
      - {type: volume, source: secrets, target: /run/chelabase/secrets/tokens/storcon-hook.token, read_only: true, volume: {subpath: tokens/storcon-hook.token}}
      - {type: volume, source: secrets, target: /run/chelabase/secrets/tokens/orchestrator-identity.token, read_only: true, volume: {subpath: tokens/orchestrator-identity.token}}
      - {type: volume, source: secrets, target: /run/chelabase/secrets/auth/member-jwt.pub, read_only: true, volume: {subpath: auth/member-jwt.pub}}
      - {type: volume, source: secrets, target: /run/chelabase/secrets/orchestrator-tls, read_only: true, volume: {subpath: orchestrator-tls}}
      - {type: volume, source: secrets, target: /run/chelabase/secrets/db/metadata.password, read_only: true, volume: {subpath: db/metadata.password}}
      - {type: volume, source: secrets, target: /run/chelabase/secrets/setup/setup.code, read_only: true, volume: {subpath: setup/setup.code}}
      - {type: bind, source: /var/run/docker.sock, target: /var/run/docker.sock}
    healthcheck:
      <<: *app-health
      test: ["CMD-SHELL", "curl -fsS http://127.0.0.1:8081/health && curl -fsS http://127.0.0.1:8083/health"]
    depends_on:
      init-secrets:
        condition: service_completed_successfully
      metadata-db:
        condition: service_healthy
      nats:
        condition: service_healthy
      valkey:
        condition: service_healthy
      storage-controller:
        condition: service_healthy

  worker:
    image: ${CHELABASE_IMAGE_REPO:-ghcr.io/chelabase}/worker:${CHELABASE_IMAGE_TAG:-ff5f35f85415@sha256:7fa37425c4f01539103e6cb75fadecd043e7dac67e05e525fec6a75ee002e6be}
    restart: unless-stopped
    user: "0"
    entrypoint: *app-with-docker
    command: ["worker"]
    # RT1 T1 (S1): its own credentials, from its own files below. It issues each compute's
    # certificate with the compute CA and renews the two client pairs (rw); it starts computes
    # through the Docker socket.
    environment:
      <<: *app-env
      CHELABASE_METADATA_DATABASE_PASSWORD_FILE: /run/chelabase/secrets/db/metadata.password
      CHELABASE_NATS_USER: worker
      CHELABASE_NATS_PASSWORD_FILE: /run/chelabase/secrets/nats/worker.password
      CHELABASE_NATS_INBOX_PREFIX: _INBOX_worker
      CHELABASE_VALKEY_USER: control
      CHELABASE_VALKEY_PASSWORD_FILE: /run/chelabase/secrets/valkey/control.password
      CHELABASE_REALTIME_PG_PASSWORD_FILE: /run/chelabase/secrets/realtime/pg.password
      # .env's tunables (blank = the service's default).
      CHELABASE_DB_OWNER_SUPERUSER: ${CHELABASE_DB_OWNER_SUPERUSER:-}
      CHELABASE_BRANCH_ROLE_CAP: ${CHELABASE_BRANCH_ROLE_CAP:-}
      CHELABASE_BRANCH_DATABASE_CAP: ${CHELABASE_BRANCH_DATABASE_CAP:-}
      CHELABASE_PASSWORD_STRENGTH: ${CHELABASE_PASSWORD_STRENGTH:-}
      CHELABASE_APP_USERS_RECONCILE_SECS: ${CHELABASE_APP_USERS_RECONCILE_SECS:-}
      CHELABASE_MEMBER_ROLES_SWEEP_SECS: ${CHELABASE_MEMBER_ROLES_SWEEP_SECS:-}
      CHELABASE_WORKER_REMOVE_ORPHANS: ${CHELABASE_WORKER_REMOVE_ORPHANS:-}
      # auth-replacement m5: its identity bearer (pool lifecycle, the users sync).
      CHELABASE_IDENTITY_URL: http://identity:8080
      CHELABASE_IDENTITY_TOKEN_FILE: /run/chelabase/secrets/tokens/worker-identity.token
      # Edge functions (m4b): its bearer for the functions service's invocations (cron and
      # events, m7 and m8).
      CHELABASE_WORKER_FUNCTIONS_TOKEN_FILE: /run/chelabase/secrets/tokens/worker-functions.token
      # object-storage m8: the sweep reads and deletes unreferenced blobs as the `storage`
      # identity (bucket chelabase-storage only).
      CHELABASE_STORAGE_BACKEND: seaweedfs
      CHELABASE_STORAGE_S3_ENDPOINT: http://seaweedfs:8333
      CHELABASE_STORAGE_S3_BUCKET: chelabase-storage
      CHELABASE_STORAGE_S3_ACCESS_KEY_FILE: /run/chelabase/secrets/storage-s3/access-key
      CHELABASE_STORAGE_S3_SECRET_KEY_FILE: /run/chelabase/secrets/storage-s3/secret-key
      CHELABASE_STORAGE_SWEEP_GRACE_SECS: ${CHELABASE_STORAGE_SWEEP_GRACE_SECS:-}
      CHELABASE_STORAGE_SWEEP_SECS: ${CHELABASE_STORAGE_SWEEP_SECS:-}
      CHELABASE_STORAGE_SWEEP_DRY_RUN: ${CHELABASE_STORAGE_SWEEP_DRY_RUN:-}
      # object-storage m18: where it delivers storage webhooks (checked again on each delivery).
      # Blank: https to public addresses only.
      CHELABASE_WEBHOOKS_ALLOW_HOSTS: ${CHELABASE_WEBHOOKS_ALLOW_HOSTS:-}
      CHELABASE_WEBHOOKS_ALLOW_HTTP: ${CHELABASE_WEBHOOKS_ALLOW_HTTP:-}
    # P4: it dials computes (compute_ctl) on the compute network. `functions-control` (m4b): the
    # functions service's internal listener, for invocations.
    networks:
      default: {}
      compute: {}
      functions-control: {}
    volumes:
      - {type: volume, source: secrets, target: /run/chelabase/secrets/secrets/secrets.key, read_only: true, volume: {subpath: secrets/secrets.key}}
      - {type: volume, source: secrets, target: /run/chelabase/secrets/neon/compute-jwt.pem, read_only: true, volume: {subpath: neon/compute-jwt.pem}}
      - {type: volume, source: secrets, target: /run/chelabase/secrets/neon/compute-jwt.pub, read_only: true, volume: {subpath: neon/compute-jwt.pub}}
      - {type: volume, source: secrets, target: /run/chelabase/secrets/nats/worker.password, read_only: true, volume: {subpath: nats/worker.password}}
      - {type: volume, source: secrets, target: /run/chelabase/secrets/valkey/control.password, read_only: true, volume: {subpath: valkey/control.password}}
      - {type: volume, source: secrets, target: /run/chelabase/secrets/realtime/pg.password, read_only: true, volume: {subpath: realtime/pg.password}}
      - {type: volume, source: secrets, target: /run/chelabase/secrets/tokens/worker-identity.token, read_only: true, volume: {subpath: tokens/worker-identity.token}}
      - {type: volume, source: secrets, target: /run/chelabase/secrets/tokens/worker-functions.token, read_only: true, volume: {subpath: tokens/worker-functions.token}}
      - {type: volume, source: secrets, target: /run/chelabase/secrets/compute-ca, volume: {subpath: compute-ca}}
      - {type: volume, source: secrets, target: /run/chelabase/secrets/orchestrator-tls, volume: {subpath: orchestrator-tls}}
      - {type: volume, source: secrets, target: /run/chelabase/secrets/realtime-tls, volume: {subpath: realtime-tls}}
      - {type: volume, source: secrets, target: /run/chelabase/secrets/db/metadata.password, read_only: true, volume: {subpath: db/metadata.password}}
      - {type: volume, source: secrets, target: /run/chelabase/secrets/storage-s3/access-key, read_only: true, volume: {subpath: storage-s3/access-key}}
      - {type: volume, source: secrets, target: /run/chelabase/secrets/storage-s3/secret-key, read_only: true, volume: {subpath: storage-s3/secret-key}}
      - {type: bind, source: /var/run/docker.sock, target: /var/run/docker.sock}
    healthcheck:
      <<: *app-health
      test: ["CMD", "curl", "-fsS", "http://127.0.0.1:8082/health"]
    depends_on:
      init-secrets:
        condition: service_completed_successfully
      metadata-db:
        condition: service_healthy
      nats:
        condition: service_healthy
      valkey:
        condition: service_healthy
      storage-controller:
        condition: service_healthy
      pageserver:
        condition: service_healthy
      safekeeper1:
        condition: service_healthy
      safekeeper2:
        condition: service_healthy
      safekeeper3:
        condition: service_healthy
      register-safekeepers:
        condition: service_completed_successfully

  # The front door for HTTP, published on CHELABASE_HTTP_ADDR:CHELABASE_HTTP_PORT. It listens on the
  # public port inside too and answers every host on the network (the aliases), so one URL works
  # from the host and from a container when the hosts are plain http. The auth host names the
  # member tokens' issuer only: the gateway serves nothing there.
  # Liveness only in its healthcheck (`/_gateway/ready` waits for its member verify key).
  gateway:
    image: ${CHELABASE_IMAGE_REPO:-ghcr.io/chelabase}/gateway:${CHELABASE_IMAGE_TAG:-ff5f35f85415@sha256:2b04d608e2a237c3526184554e5940c64a1a510df9263b95bd986a2388c6070f}
    restart: unless-stopped
    # RT1 T1 (S27): the bearers it sends to the orchestrator's internal listener.
    environment:
      <<: *app-env
      CHELABASE_GATEWAY_LISTEN: 0.0.0.0:${CHELABASE_PUBLIC_PORT:-8000}
      CHELABASE_GATEWAY_TRUSTED_PROXIES: ${CHELABASE_GATEWAY_TRUSTED_PROXIES:-}
      CHELABASE_DATA_KEYS_TOKEN_FILE: /run/chelabase/secrets/tokens/data-keys.token
      CHELABASE_APP_SESSIONS_INTERNAL_TOKEN_FILE: /run/chelabase/secrets/tokens/app-sessions.token
    ports:
      - "${CHELABASE_HTTP_ADDR:-127.0.0.1}:${CHELABASE_HTTP_PORT:-${CHELABASE_PUBLIC_PORT:-8000}}:${CHELABASE_PUBLIC_PORT:-8000}"
    # #183: also on the runtime's `functions` network as `gateway-functions`, the address of the
    # functions' `env.CHELABASE` binding (always on the API host; it grants nothing by itself).
    networks:
      default:
        aliases:
          - ${CHELABASE_STUDIO_HOST_NAME:-studio.chelabase.localhost}
          - ${CHELABASE_API_HOST_NAME:-api.chelabase.localhost}
          - ${CHELABASE_AUTH_HOST_NAME:-auth.chelabase.localhost}
      functions:
        aliases: [gateway-functions]
    volumes:
      - {type: volume, source: secrets, target: /run/chelabase/secrets/gateway/internal-signing.pem, read_only: true, volume: {subpath: gateway/internal-signing.pem}}
      - {type: volume, source: secrets, target: /run/chelabase/secrets/auth/app-jwt.pub, read_only: true, volume: {subpath: auth/app-jwt.pub}}
      - {type: volume, source: secrets, target: /run/chelabase/secrets/auth/member-jwt.pub, read_only: true, volume: {subpath: auth/member-jwt.pub}}
      - {type: volume, source: secrets, target: /run/chelabase/secrets/tokens/data-keys.token, read_only: true, volume: {subpath: tokens/data-keys.token}}
      - {type: volume, source: secrets, target: /run/chelabase/secrets/tokens/app-sessions.token, read_only: true, volume: {subpath: tokens/app-sessions.token}}
    healthcheck:
      <<: *app-health
      test: ["CMD", "curl", "-fsS", "http://127.0.0.1:${CHELABASE_PUBLIC_PORT:-8000}/_gateway/health"]
    depends_on:
      init-bootstrap:
        condition: service_completed_successfully

  # Studio's sign-in backend. On the compute network (P4: the app-users sync dials computes), so
  # computes reach it directly: only the gateway's X-Forwarded-For counts
  # (CHELABASE_AUTH_TRUSTED_PROXY=gateway, ruling (e)).
  auth:
    image: ${CHELABASE_IMAGE_REPO:-ghcr.io/chelabase}/auth:${CHELABASE_IMAGE_TAG:-ff5f35f85415@sha256:c03b174c91351140e8ec7775fe23ed078a4b169d7f25607ef51f104f1da198e5}
    restart: unless-stopped
    # RT1 T1 (S27): the bearer it sends to the orchestrator's internal app routes.
    environment:
      <<: *app-env
      CHELABASE_APP_AUTH_INTERNAL_TOKEN_FILE: /run/chelabase/secrets/tokens/app-auth.token
      # .env's tunables (blank = the service's default).
      CHELABASE_REQUIRE_EMAIL_VERIFICATION: ${CHELABASE_REQUIRE_EMAIL_VERIFICATION:-}
      CHELABASE_APP_ACCESS_TTL_SECS: ${CHELABASE_APP_ACCESS_TTL_SECS:-}
      CHELABASE_MEMBER_ACCESS_TTL_SECS: ${CHELABASE_MEMBER_ACCESS_TTL_SECS:-}
      # auth-replacement m5: its identity bearer (member and app-user flows).
      CHELABASE_IDENTITY_URL: http://identity:8080
      CHELABASE_IDENTITY_TOKEN_FILE: /run/chelabase/secrets/tokens/auth-identity.token
    networks:
      default: {}
      compute: {}
    volumes:
      - {type: volume, source: secrets, target: /run/chelabase/secrets/auth/cookie.key, read_only: true, volume: {subpath: auth/cookie.key}}
      - {type: volume, source: secrets, target: /run/chelabase/secrets/auth/app-jwt.key, read_only: true, volume: {subpath: auth/app-jwt.key}}
      - {type: volume, source: secrets, target: /run/chelabase/secrets/auth/app-jwt.pub, read_only: true, volume: {subpath: auth/app-jwt.pub}}
      - {type: volume, source: secrets, target: /run/chelabase/secrets/auth/member-jwt.key, read_only: true, volume: {subpath: auth/member-jwt.key}}
      - {type: volume, source: secrets, target: /run/chelabase/secrets/auth/member-jwt.pub, read_only: true, volume: {subpath: auth/member-jwt.pub}}
      - {type: volume, source: secrets, target: /run/chelabase/secrets/gateway/internal-verify.pem, read_only: true, volume: {subpath: gateway/internal-verify.pem}}
      - {type: volume, source: secrets, target: /run/chelabase/secrets/compute-ca/ca.crt, read_only: true, volume: {subpath: compute-ca/ca.crt}}
      - {type: volume, source: secrets, target: /run/chelabase/secrets/tokens/app-auth.token, read_only: true, volume: {subpath: tokens/app-auth.token}}
      - {type: volume, source: secrets, target: /run/chelabase/secrets/tokens/auth-identity.token, read_only: true, volume: {subpath: tokens/auth-identity.token}}
    healthcheck:
      <<: *app-health
      test: ["CMD", "curl", "-fsS", "http://127.0.0.1:8084/health"]
    depends_on:
      init-bootstrap:
        condition: service_completed_successfully

  rest:
    image: ${CHELABASE_IMAGE_REPO:-ghcr.io/chelabase}/rest:${CHELABASE_IMAGE_TAG:-ff5f35f85415@sha256:e9142b67ee349bbb2ce9e472c6dd06e643126c3bc2731fc0396092590972e680}
    restart: unless-stopped
    # RT1 T1 (S27): its internal bearer (both ways with the orchestrator).
    environment:
      <<: *app-env
      CHELABASE_REST_INTERNAL_TOKEN_FILE: /run/chelabase/secrets/tokens/rest-internal.token
    # P4: the data API dials computes on the compute network.
    networks:
      default: {}
      compute: {}
    volumes:
      - {type: volume, source: secrets, target: /run/chelabase/secrets/gateway/internal-verify.pem, read_only: true, volume: {subpath: gateway/internal-verify.pem}}
      - {type: volume, source: secrets, target: /run/chelabase/secrets/compute-ca/ca.crt, read_only: true, volume: {subpath: compute-ca/ca.crt}}
      - {type: volume, source: secrets, target: /run/chelabase/secrets/tokens/rest-internal.token, read_only: true, volume: {subpath: tokens/rest-internal.token}}
    # rest has no health route: any HTTP answer (even a 404) means it is serving.
    healthcheck:
      <<: *app-health
      test: ["CMD", "curl", "-sS", "-o", "/dev/null", "http://127.0.0.1:8085/"]
    depends_on:
      init-secrets:
        condition: service_completed_successfully
      metadata-db:
        condition: service_healthy

  # RT1 T7: tickets and the one WebSocket per tab, behind the gateway (8087); 8088 serves only
  # /health, which waits for the OIDC audiences. It verifies the gateway's identity on ticket
  # requests.
  realtime:
    image: ${CHELABASE_IMAGE_REPO:-ghcr.io/chelabase}/realtime:${CHELABASE_IMAGE_TAG:-ff5f35f85415@sha256:e35a465a48236090bdacd229fe3d8a2b8eded12092671aabed68988a410716b9}
    restart: unless-stopped
    # S1: its own credentials, from its own files below; Valkey TLS is platform mode's (S7).
    environment:
      <<: *app-env
      CHELABASE_NATS_USER: realtime
      CHELABASE_NATS_PASSWORD_FILE: /run/chelabase/secrets/nats/realtime.password
      CHELABASE_NATS_INBOX_PREFIX: _INBOX_realtime
      CHELABASE_VALKEY_USER: realtime
      CHELABASE_VALKEY_PASSWORD_FILE: /run/chelabase/secrets/valkey/realtime.password
      CHELABASE_VALKEY_TLS: "off"
      CHELABASE_REALTIME_PG_PASSWORD_FILE: /run/chelabase/secrets/realtime/pg.password
      CHELABASE_REALTIME_TICKET_KEY_FILE: /run/chelabase/secrets/realtime/ticket.key
      CHELABASE_REALTIME_INTERNAL_TOKEN_FILE: /run/chelabase/secrets/realtime/internal.token
    # Realtime's replication connection dials the compute's `replication_host` on `control`
    # (from its static address, in the chelabase_realtime login rule); its check connections and
    # the compute's other listeners are reached on `compute`.
    networks:
      default: {}
      control:
        ipv4_address: ${CHELABASE_REALTIME_CONTROL_IP:-10.214.0.12}
      compute: {}
    volumes:
      - {type: volume, source: secrets, target: /run/chelabase/secrets/gateway/internal-verify.pem, read_only: true, volume: {subpath: gateway/internal-verify.pem}}
      - {type: volume, source: secrets, target: /run/chelabase/secrets/compute-ca/ca.crt, read_only: true, volume: {subpath: compute-ca/ca.crt}}
      - {type: volume, source: secrets, target: /run/chelabase/secrets/nats/realtime.password, read_only: true, volume: {subpath: nats/realtime.password}}
      - {type: volume, source: secrets, target: /run/chelabase/secrets/valkey/realtime.password, read_only: true, volume: {subpath: valkey/realtime.password}}
      - {type: volume, source: secrets, target: /run/chelabase/secrets/realtime/pg.password, read_only: true, volume: {subpath: realtime/pg.password}}
      - {type: volume, source: secrets, target: /run/chelabase/secrets/realtime/ticket.key, read_only: true, volume: {subpath: realtime/ticket.key}}
      - {type: volume, source: secrets, target: /run/chelabase/secrets/realtime/internal.token, read_only: true, volume: {subpath: realtime/internal.token}}
      - {type: volume, source: secrets, target: /run/chelabase/secrets/realtime-tls, read_only: true, volume: {subpath: realtime-tls}}
      - {type: volume, source: secrets, target: /run/chelabase/secrets/auth/member-jwt.pub, read_only: true, volume: {subpath: auth/member-jwt.pub}}
    healthcheck:
      <<: *app-health
      test: ["CMD", "curl", "-fsS", "http://127.0.0.1:8088/health"]
    depends_on:
      nats:
        condition: service_healthy
      valkey:
        condition: service_healthy
      init-bootstrap:
        condition: service_completed_successfully

  # Object storage (m19; the service is m5's): files in buckets behind the gateway at /storage/v1
  # (8089), and the console's listener for the orchestrator only (8090, behind its bearer, both
  # ways as rest's). It verifies the gateway's identity, dials computes on the compute network
  # (as `authenticator` for callers' sessions and as `chelabase_storage`, its own login, whose
  # connection info it asks the orchestrator for), keeps blobs in SeaweedFS's bucket
  # chelabase-storage as the `storage` identity, and listens on NATS as `storage` (cache events)
  # and publishes object events there (webhooks, which the worker delivers). It runs its binary
  # directly as the image's user (10001, the owner of its files), on a read-only root.
  # Its image is a release image like the apps', pinned the same way (CHELABASE_IMAGE_REPO and
  # CHELABASE_IMAGE_TAG pick it too).
  storage:
    image: ${CHELABASE_IMAGE_REPO:-ghcr.io/chelabase}/storage:${CHELABASE_IMAGE_TAG:-ff5f35f85415@sha256:0831e74428b6bae3ee34e752f53af0609a2fe3c82b3a4abbe5fc0aba2d77420c}
    restart: unless-stopped
    read_only: true
    environment:
      <<: *app-env
      CHELABASE_STORAGE_INTERNAL_TOKEN_FILE: /run/chelabase/secrets/tokens/storage-internal.token
      # m9: its own NATS user (cache events in; object events out, m18).
      CHELABASE_NATS_USER: storage
      CHELABASE_NATS_PASSWORD_FILE: /run/chelabase/secrets/nats/storage.password
      CHELABASE_NATS_INBOX_PREFIX: _INBOX_storage
      CHELABASE_STORAGE_BACKEND: seaweedfs
      CHELABASE_STORAGE_S3_ENDPOINT: http://seaweedfs:8333
      CHELABASE_STORAGE_S3_BUCKET: chelabase-storage
      CHELABASE_STORAGE_S3_ACCESS_KEY_FILE: /run/chelabase/secrets/storage-s3/access-key
      CHELABASE_STORAGE_S3_SECRET_KEY_FILE: /run/chelabase/secrets/storage-s3/secret-key
      # .env's tunables (blank = the service's default; m7).
      CHELABASE_STORAGE_MAX_CONNECTIONS: ${CHELABASE_STORAGE_MAX_CONNECTIONS:-}
      CHELABASE_STORAGE_MAX_INFLIGHT_BYTES: ${CHELABASE_STORAGE_MAX_INFLIGHT_BYTES:-}
      CHELABASE_STORAGE_BODY_IDLE_SECS: ${CHELABASE_STORAGE_BODY_IDLE_SECS:-}
    networks:
      default: {}
      compute: {}
    volumes:
      - {type: volume, source: secrets, target: /run/chelabase/secrets/gateway/internal-verify.pem, read_only: true, volume: {subpath: gateway/internal-verify.pem}}
      - {type: volume, source: secrets, target: /run/chelabase/secrets/compute-ca/ca.crt, read_only: true, volume: {subpath: compute-ca/ca.crt}}
      - {type: volume, source: secrets, target: /run/chelabase/secrets/tokens/storage-internal.token, read_only: true, volume: {subpath: tokens/storage-internal.token}}
      - {type: volume, source: secrets, target: /run/chelabase/secrets/nats/storage.password, read_only: true, volume: {subpath: nats/storage.password}}
      - {type: volume, source: secrets, target: /run/chelabase/secrets/storage-s3/access-key, read_only: true, volume: {subpath: storage-s3/access-key}}
      - {type: volume, source: secrets, target: /run/chelabase/secrets/storage-s3/secret-key, read_only: true, volume: {subpath: storage-s3/secret-key}}
    healthcheck:
      <<: *app-health
      test: ["CMD", "curl", "-fsS", "-o", "/dev/null", "http://127.0.0.1:8089/health"]
    depends_on:
      init-secrets:
        condition: service_completed_successfully
      nats:
        condition: service_healthy
      seaweedfs:
        condition: service_healthy

  # No settings and no secrets: the image fetches /auth/v1/studio-config through the gateway, on
  # Studio's host.
  studio:
    image: ${CHELABASE_IMAGE_REPO:-ghcr.io/chelabase}/studio:${CHELABASE_IMAGE_TAG:-ff5f35f85415@sha256:0c092c1fb9f54b0ac79a77bf668f207efb907818688c7d7c7a09d9e30624ee11}
    restart: unless-stopped
    environment:
      CHELABASE_STUDIO_PORT: "3000"
    healthcheck:
      <<: *app-health
      test: ["CMD", "curl", "-fsS", "-o", "/dev/null", "-H", "Host: ${CHELABASE_STUDIO_HOST_NAME:-studio.chelabase.localhost}", "http://127.0.0.1:3000/"]

  # Edge functions (m4b): runs a branch's functions in the runtime and serves their bundles. Its
  # public listener (8091) takes the gateway's /functions/v1 calls on the default network; its
  # internal one (8080) serves bundles to the runtime on `functions` and takes the orchestrator's
  # bundle uploads and the worker's invocations, each with its own bearer, on `functions-control`.
  # Each listener binds the service's alias on its networks only (plus loopback for the
  # healthcheck), never 0.0.0.0. It reads the metadata database (resolutions, secrets, the
  # run-as key) and the bundles bucket as the `functions` S3 identity, and listens for
  # `chelabase.fn.changed.*` as its own NATS user.
  functions:
    image: ${CHELABASE_IMAGE_REPO:-ghcr.io/chelabase}/functions:${CHELABASE_IMAGE_TAG:-unpublished}
    restart: unless-stopped
    read_only: true
    environment:
      <<: *app-env
      CHELABASE_FUNCTIONS_ADDR: functions-public:8091,127.0.0.1:8091
      # The internal listener in two sides (#181): bundle GETs for the runtime, uploads and
      # invocations for the orchestrator and the worker.
      CHELABASE_FUNCTIONS_INTERNAL_ADDR: functions-internal:8080
      CHELABASE_FUNCTIONS_CONTROL_ADDR: functions-control:8080
      CHELABASE_FUNCTIONS_RUNTIME_URL: http://functions-runtime:8080
      CHELABASE_METADATA_DATABASE_PASSWORD_FILE: /run/chelabase/secrets/db/metadata.password
      CHELABASE_NATS_USER: functions
      CHELABASE_NATS_PASSWORD_FILE: /run/chelabase/secrets/nats/functions.password
      CHELABASE_NATS_INBOX_PREFIX: _INBOX_functions
      CHELABASE_ORCHESTRATOR_FUNCTIONS_TOKEN_FILE: /run/chelabase/secrets/tokens/orchestrator-functions.token
      CHELABASE_WORKER_FUNCTIONS_TOKEN_FILE: /run/chelabase/secrets/tokens/worker-functions.token
      CHELABASE_STORAGE_BACKEND: seaweedfs
      CHELABASE_STORAGE_S3_ENDPOINT: http://seaweedfs:8333
      CHELABASE_STORAGE_S3_BUCKET: chelabase-functions
      CHELABASE_STORAGE_S3_ACCESS_KEY_FILE: /run/chelabase/secrets/functions-s3/access-key
      CHELABASE_STORAGE_S3_SECRET_KEY_FILE: /run/chelabase/secrets/functions-s3/secret-key
      # .env's tunables (blank = the service's default).
      CHELABASE_FUNCTIONS_TIMEOUT_MS: ${CHELABASE_FUNCTIONS_TIMEOUT_MS:-}
    networks:
      default:
        aliases: [functions-public]
      functions:
        aliases: [functions-internal]
      functions-control:
        aliases: [functions-control]
    volumes:
      - {type: volume, source: secrets, target: /run/chelabase/secrets/secrets/secrets.key, read_only: true, volume: {subpath: secrets/secrets.key}}
      - {type: volume, source: secrets, target: /run/chelabase/secrets/gateway/internal-verify.pem, read_only: true, volume: {subpath: gateway/internal-verify.pem}}
      - {type: volume, source: secrets, target: /run/chelabase/secrets/db/metadata.password, read_only: true, volume: {subpath: db/metadata.password}}
      - {type: volume, source: secrets, target: /run/chelabase/secrets/nats/functions.password, read_only: true, volume: {subpath: nats/functions.password}}
      - {type: volume, source: secrets, target: /run/chelabase/secrets/tokens/orchestrator-functions.token, read_only: true, volume: {subpath: tokens/orchestrator-functions.token}}
      - {type: volume, source: secrets, target: /run/chelabase/secrets/tokens/worker-functions.token, read_only: true, volume: {subpath: tokens/worker-functions.token}}
      - {type: volume, source: secrets, target: /run/chelabase/secrets/functions-s3/access-key, read_only: true, volume: {subpath: functions-s3/access-key}}
      - {type: volume, source: secrets, target: /run/chelabase/secrets/functions-s3/secret-key, read_only: true, volume: {subpath: functions-s3/secret-key}}
    healthcheck:
      <<: *app-health
      test: ["CMD", "curl", "-fsS", "-o", "/dev/null", "http://127.0.0.1:8091/health"]
    depends_on:
      init-secrets:
        condition: service_completed_successfully
      metadata-db:
        condition: service_healthy
      nats:
        condition: service_healthy
      seaweedfs:
        condition: service_healthy

  # Edge functions (m1): workerd running member bundles, loaded by hash through its Worker Loader
  # from the functions service's internal listener (`functions-internal:8080`), its only peer on
  # the internal `functions` network. Its outbound is `functions-egress` alone, and workerd's
  # `egress` service lets user code reach public addresses only
  # (infra/functions-runtime/config.capnp). It never shares a network with the orchestrator or
  # the worker. No secret, no published port, no volume; non-root on a read-only root with every
  # capability dropped. workerd runs all isolates on one thread, so a bundle in a busy loop stalls
  # the others: the image's watchdog probes a trivial worker every 2s and after 3 failures ends
  # the container, which `always` restarts. Its image isn't published yet: build it with
  # `docker buildx bake -f infra/images/docker-bake.hcl functions-runtime` and set
  # CHELABASE_IMAGE_REPO=chelabase and CHELABASE_IMAGE_TAG=latest.
  functions-runtime:
    image: ${CHELABASE_IMAGE_REPO:-ghcr.io/chelabase}/functions-runtime:${CHELABASE_IMAGE_TAG:-unpublished}
    # #183: the functions' `env.CHELABASE` binding reaches the gateway's alias on `functions` at
    # its listening port, always on the API host.
    command: ["/usr/local/bin/workerd", "serve", "--experimental",
              "--external-addr", "chelabase-api=gateway-functions:${CHELABASE_PUBLIC_PORT:-8000}",
              "/etc/functions-runtime/config.capnp"]
    environment:
      CHELABASE_API_HOST: ${CHELABASE_API_HOST:-api.chelabase.localhost:8000}
    restart: always
    user: "65532:65532"
    read_only: true
    cap_drop: [ALL]
    security_opt: ["no-new-privileges:true"]
    mem_limit: ${CHELABASE_FUNCTIONS_RUNTIME_MEMORY:-1g}
    pids_limit: 256
    networks:
      functions: {}
      functions-egress: {}
    healthcheck:
      test: ["CMD", "/usr/local/bin/busybox", "wget", "-q", "-T", "2", "-O", "/dev/null", "http://127.0.0.1:9090/"]
      interval: 5s
      timeout: 3s
      retries: 3
      start_period: 10s

networks:
  # Orchestrator and realtime to computes (<project>_control), with static addresses for the
  # login rules; computes take addresses from the upper /23 only. Change it in .env when it
  # overlaps a network of the host (the workbench gives each stack its own).
  control:
    ipam:
      config:
        - subnet: ${CHELABASE_CONTROL_SUBNET:-10.214.0.0/22}
          ip_range: ${CHELABASE_CONTROL_COMPUTE_RANGE:-10.214.2.0/23}
  # RT1 T1 (P4, W14): the computes' own network (<project>_compute, CHELABASE_COMPUTE_NETWORK).
  # On it: what a compute needs (pageserver, safekeepers, the orchestrator's hooks listener) and
  # the clients that dial computes (proxy, rest, auth, worker, orchestrator, runner, realtime,
  # storage).
  # Never NATS, Valkey, a database, identity, Mailpit, SeaweedFS, the storage broker or controller,
  # the gateway or Studio. Every listener of its members needs a credential or is public by
  # design (scripts/compute-network-e2e.sh audits each one).
  compute: {}
  # Edge functions (m1): the functions service and the runtime, and the gateway's alias for the
  # runtime's `env.CHELABASE` binding (#183); nothing else, no route out.
  functions:
    internal: true
  # Edge functions (m4b): the orchestrator and the worker to the functions service's internal
  # listener; never the runtime. No route out.
  functions-control:
    internal: true
  # The runtime's only way out (workerd allows public addresses only); nothing else is on it.
  functions-egress: {}

volumes:
  # Every key, password and token, chelabase-init's layout (plus bootstrap/). Never delete it
  # while the databases' volumes exist: stored passwords can't
  # be decrypted without secrets/secrets.key, and the databases keep their first passwords.
  secrets:
  metadata_pg_data:
  nats_data:
  valkey_data:
  neon_seaweedfs_data:
  neon_pageserver_data:
  neon_safekeeper1_data:
  neon_safekeeper2_data:
  neon_safekeeper3_data:
  neon_storcon_pg_data:
  neon_proxy_tls:
