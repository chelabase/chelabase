# A Chelabase workbench stack (W2): the infra, Neon storage and proxy, Zitadel, Mailpit and the app
# tier (orchestrator, worker, gateway, auth, rest, Studio; docs and landing under the `sites`
# profile; the test runner under the `runner` profile).
#
# One file, any project: there is no `name:`. Every caller goes through `chelabase workbench`,
# which passes `-p <project> -f <checkout>/infra/compose/docker-compose.yml
# --env-file <state>/env/stack.env`; stack.env is rendered from .env.example plus the stack's own
# values (its slug, ports, host names, paths, uid/gid, the workbench image).
#
# Reachable from the host only through the gateway's port and the proxy's Postgres port, each on
# 127.0.0.1 and ::1. Everything else talks over the project network by service name.

# --- Neon storage ---
# Pinned by digest; `chelabase workbench up` overrides these with a local `just neon-build` when
# present. The packages are public on ghcr.io (infra/neon/README.md).
x-neon-images:
  neon: &neon-image ${NEON_IMAGE:-ghcr.io/chelabase/neon-storage:629166ceef60-dev@sha256:75794bed0c2fe5d447964735edb3eac21e55c45562a00c344fb4bb1a88509419}
  # The image of the compute containers the worker starts (CHELABASE_COMPUTE_IMAGE); pinned here.
  compute: ${COMPUTE_NODE_IMAGE:-ghcr.io/chelabase/neon-compute-v17:629166ceef60-dev@sha256:281c47327e04fbc5db58f3d9a24a2ced0c74e0d03907260f2c6290f6db3e436b}

# S3 credentials for SeaweedFS. Local dev only.
x-neon-s3-env: &neon-s3-env
  AWS_ACCESS_KEY_ID: chelabase-dev
  AWS_SECRET_ACCESS_KEY: chelabase-dev-secret
  AWS_DEFAULT_REGION: us-east-1

# --- The app tier's shared parts ---
# Every path is mounted at its own host path (the checkout, the shared machine keys under
# <main>/.chelabase, the stack's state dir), so the file paths in demo.env mean the same thing
# inside and outside the containers.
x-workbench: &workbench
  image: ${CHELABASE_WORKBENCH_IMAGE:?set by chelabase workbench (stack.env)}
  user: "${CHELABASE_UID:?set by chelabase workbench (stack.env)}:${CHELABASE_GID:?set by chelabase workbench (stack.env)}"
  working_dir: ${CHELABASE_CHECKOUT:?set by chelabase workbench (stack.env)}
  restart: unless-stopped

# stack.env is always rendered before the CLI calls Compose (it is the --env-file too, and the
# `:?` settings above fail without it), so it is not marked required here: `docker compose
# config` must render a stack offline from the fixture alone.
x-stack-env: &stack-env
  path: ${CHELABASE_STACK_DIR:?set by chelabase workbench (stack.env)}/env/stack.env
  required: false
x-demo-env: &demo-env
  path: ${CHELABASE_STACK_DIR}/zitadel/demo.env
  required: false

x-checkout-ro: &checkout-ro
  type: bind
  source: ${CHELABASE_CHECKOUT}
  target: ${CHELABASE_CHECKOUT}
  read_only: true
x-checkout-rw: &checkout-rw
  type: bind
  source: ${CHELABASE_CHECKOUT}
  target: ${CHELABASE_CHECKOUT}
# Machine keys, one file at its own path per service that reads it (U10): a service sees exactly
# the key files it reads and nothing else under the keys dir. `.chelabase` inside every checkout
# mount is masked first (an empty tmpfs; on the main stack the keys dir is that directory), then
# the narrow mounts go on top (Docker applies mounts by target depth). A missing file fails the
# start (create_host_path: false) instead of Docker making a directory.
# Both masks are read-only tmpfs. The first covers the keys dir itself: in a worktree
# `<checkout>/.chelabase` is a symlink to it, Docker follows the link, and it orders mounts by the
# unresolved target depth, so a mask at the link's path would tie with the key mounts and hide
# them; a mask at the (shallower) keys dir never does. The second covers `<checkout>/.chelabase`
# when that is a different directory; the CLI sets CHELABASE_CHECKOUT_MASK to its path then, and
# the default (the keys dir) makes it the same mount point as the first, which Compose merges.
x-keys-mask: &keys-mask
  type: tmpfs
  target: ${CHELABASE_KEYS_DIR:?set by chelabase workbench (stack.env)}
  read_only: true
x-checkout-mask: &checkout-mask
  type: tmpfs
  target: ${CHELABASE_CHECKOUT_MASK:-${CHELABASE_KEYS_DIR}}
  read_only: true
x-key-secrets: &key-secrets
  type: bind
  source: ${CHELABASE_KEYS_DIR}/secrets/secrets.key
  target: ${CHELABASE_KEYS_DIR}/secrets/secrets.key
  read_only: true
  bind: {create_host_path: false}
x-key-internal-signing: &key-internal-signing
  type: bind
  source: ${CHELABASE_KEYS_DIR}/gateway/internal-signing.pem
  target: ${CHELABASE_KEYS_DIR}/gateway/internal-signing.pem
  read_only: true
  bind: {create_host_path: false}
x-key-internal-verify: &key-internal-verify
  type: bind
  source: ${CHELABASE_KEYS_DIR}/gateway/internal-verify.pem
  target: ${CHELABASE_KEYS_DIR}/gateway/internal-verify.pem
  read_only: true
  bind: {create_host_path: false}
x-key-cookie: &key-cookie
  type: bind
  source: ${CHELABASE_KEYS_DIR}/auth/cookie.key
  target: ${CHELABASE_KEYS_DIR}/auth/cookie.key
  read_only: true
  bind: {create_host_path: false}
x-key-app-jwt-private: &key-app-jwt-private
  type: bind
  source: ${CHELABASE_KEYS_DIR}/auth/app-jwt.key
  target: ${CHELABASE_KEYS_DIR}/auth/app-jwt.key
  read_only: true
  bind: {create_host_path: false}
x-key-app-jwt-public: &key-app-jwt-public
  type: bind
  source: ${CHELABASE_KEYS_DIR}/auth/app-jwt.pub
  target: ${CHELABASE_KEYS_DIR}/auth/app-jwt.pub
  read_only: true
  bind: {create_host_path: false}
x-key-compute-jwt-private: &key-compute-jwt-private
  type: bind
  source: ${CHELABASE_KEYS_DIR}/neon/compute-jwt.pem
  target: ${CHELABASE_KEYS_DIR}/neon/compute-jwt.pem
  read_only: true
  bind: {create_host_path: false}
x-key-compute-jwt-public: &key-compute-jwt-public
  type: bind
  source: ${CHELABASE_KEYS_DIR}/neon/compute-jwt.pub
  target: ${CHELABASE_KEYS_DIR}/neon/compute-jwt.pub
  read_only: true
  bind: {create_host_path: false}
# The platform CA's certificate alone (never ca.key): auth and rest verify every compute's TLS
# against it (U15, CHELABASE_COMPUTE_CA_FILE).
x-key-compute-ca-cert: &key-compute-ca-cert
  type: bind
  source: ${CHELABASE_KEYS_DIR}/compute-ca/ca.crt
  target: ${CHELABASE_KEYS_DIR}/compute-ca/ca.crt
  read_only: true
  bind: {create_host_path: false}
# The platform CA (ca.crt, ca.key): the worker issues each compute's server certificate (rw);
# the runner reads it, ro (R-T9a, the live tests that check computes' certificates).
x-keys-compute-ca-rw: &keys-compute-ca-rw
  type: bind
  source: ${CHELABASE_KEYS_DIR}/compute-ca
  target: ${CHELABASE_KEYS_DIR}/compute-ca
  bind: {create_host_path: false}
x-keys-compute-ca-ro: &keys-compute-ca-ro
  type: bind
  source: ${CHELABASE_KEYS_DIR}/compute-ca
  target: ${CHELABASE_KEYS_DIR}/compute-ca
  read_only: true
  bind: {create_host_path: false}
# The orchestrator's client pair. The directory itself is mounted, never `current` or a file, so
# the worker's atomic swap of the `current` symlink is visible to the readers.
x-keys-orchestrator-tls-rw: &keys-orchestrator-tls-rw
  type: bind
  source: ${CHELABASE_KEYS_DIR}/orchestrator-tls
  target: ${CHELABASE_KEYS_DIR}/orchestrator-tls
  bind: {create_host_path: false}
x-keys-orchestrator-tls-ro: &keys-orchestrator-tls-ro
  type: bind
  source: ${CHELABASE_KEYS_DIR}/orchestrator-tls
  target: ${CHELABASE_KEYS_DIR}/orchestrator-tls
  read_only: true
  bind: {create_host_path: false}
x-state: &state
  type: bind
  source: ${CHELABASE_STACK_DIR}
  target: ${CHELABASE_STACK_DIR}
x-docker-sock: &docker-sock
  type: bind
  source: /var/run/docker.sock
  target: /var/run/docker.sock

x-app-health: &app-health
  interval: 2s
  timeout: 5s
  retries: 30
  start_period: 60s

services:
  metadata-db:
    image: postgres:17.11-alpine@sha256:b0f9560a2de083e2cc7382e75f808c7381a32852a7ec49117deedb300e552b24
    restart: unless-stopped
    environment:
      POSTGRES_USER: chelabase
      POSTGRES_PASSWORD: chelabase
      POSTGRES_DB: chelabase_metadata
    volumes:
      - metadata_pg_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U chelabase -d chelabase_metadata"]
      interval: 5s
      timeout: 5s
      retries: 10

  nats:
    image: nats:2.15.0-alpine@sha256:ac8f88a6494bffc2c2a5289a0ca61cb28a9145c11ba5677cf24265d07f46d8d4
    restart: unless-stopped
    command: ["--jetstream", "--store_dir=/data", "-m", "8222"]
    volumes:
      - nats_data:/data
    healthcheck:
      test: ["CMD", "wget", "-qO-", "http://localhost:8222/healthz"]
      interval: 5s
      timeout: 5s
      retries: 10

  # Valkey (BSD-3-Clause, speaks the Redis protocol). Neon's proxy uses it for query cancel and
  # for the cache-clearing messages the control plane publishes on a password change. Local dev:
  # no auth, internal to the stack's network. Platform mode needs auth and TLS.
  valkey:
    image: valkey/valkey:9.1.2-alpine@sha256:48332870af354a799964c0012ae1194a0bf2bf894eb508f945810596dc2d8d11
    restart: unless-stopped
    volumes: ["valkey_data:/data"]
    healthcheck:
      test: ["CMD", "valkey-cli", "ping"]
      interval: 2s
      timeout: 5s
      retries: 30

  zitadel-db:
    image: postgres:17.11-alpine@sha256:b0f9560a2de083e2cc7382e75f808c7381a32852a7ec49117deedb300e552b24
    restart: unless-stopped
    environment:
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgres
    volumes:
      - zitadel_pg_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres"]
      interval: 5s
      timeout: 5s
      retries: 10

  # Zitadel v4: sign-in pages are Studio's own (/login …), served by auth. FirstInstance writes
  # admin.pat and login-client.pat once, on a fresh zitadel_pg_data volume, into the stack's
  # state dir.
  zitadel:
    image: ghcr.io/zitadel/zitadel:v4.19.1@sha256:f98935f56505ec6fa3e6523261cd1b8ace0c622e16da4a45acd493cb472f003f
    restart: unless-stopped
    command: start-from-init --masterkey "MasterkeyNeedsToHave32Characters" --tlsMode ${CHELABASE_ZITADEL_TLS_MODE:?set by chelabase workbench (stack.env)}
    environment:
      ZITADEL_DATABASE_POSTGRES_HOST: zitadel-db
      ZITADEL_DATABASE_POSTGRES_PORT: 5432
      ZITADEL_DATABASE_POSTGRES_DATABASE: zitadel
      ZITADEL_DATABASE_POSTGRES_USER_USERNAME: zitadel
      ZITADEL_DATABASE_POSTGRES_USER_PASSWORD: zitadel
      ZITADEL_DATABASE_POSTGRES_USER_SSL_MODE: disable
      ZITADEL_DATABASE_POSTGRES_ADMIN_USERNAME: postgres
      ZITADEL_DATABASE_POSTGRES_ADMIN_PASSWORD: postgres
      ZITADEL_DATABASE_POSTGRES_ADMIN_SSL_MODE: disable
      # Zitadel's public address is the stack's auth host (CHELABASE_AUTH_HOST), set apart here:
      # its name, the public port and whether the scheme is https. stack.env carries them (and
      # the TLS mode above); there are no defaults here.
      ZITADEL_EXTERNALSECURE: "${CHELABASE_PUBLIC_SECURE:?set by chelabase workbench (stack.env)}"
      ZITADEL_EXTERNALDOMAIN: "${CHELABASE_AUTH_HOST_NAME:?set by chelabase workbench (stack.env)}"
      ZITADEL_EXTERNALPORT: "${CHELABASE_PUBLIC_PORT:?set by chelabase workbench (stack.env)}"
      # The TLS mode is `disabled` or `external` (TLS ends at the gateway), so Zitadel serves
      # plain HTTP; `zitadel ready` (the healthcheck) reads this, not the start flag.
      ZITADEL_TLS_ENABLED: "false"
      # Zitadel's own registration is off: sign-up goes only through Chelabase's rules. (A volume
      # made before this setting gets it from `chelabase dev bootstrap`.)
      ZITADEL_DEFAULTINSTANCE_LOGINPOLICY_ALLOWREGISTER: "false"
      ZITADEL_FIRSTINSTANCE_PATPATH: /zitadel-bootstrap/admin.pat
      ZITADEL_FIRSTINSTANCE_ORG_MACHINE_MACHINE_USERNAME: chelabase-bootstrap
      ZITADEL_FIRSTINSTANCE_ORG_MACHINE_MACHINE_NAME: Chelabase Bootstrap
      ZITADEL_FIRSTINSTANCE_ORG_MACHINE_PAT_EXPIRATIONDATE: "2099-01-01T00:00:00Z"
      ZITADEL_FIRSTINSTANCE_ORG_HUMAN_PASSWORDCHANGEREQUIRED: "false"
      ZITADEL_FIRSTINSTANCE_LOGINCLIENTPATPATH: /zitadel-bootstrap/login-client.pat
      ZITADEL_FIRSTINSTANCE_ORG_LOGINCLIENT_MACHINE_USERNAME: login-client
      ZITADEL_FIRSTINSTANCE_ORG_LOGINCLIENT_MACHINE_NAME: Chelabase auth
      ZITADEL_FIRSTINSTANCE_ORG_LOGINCLIENT_PAT_EXPIRATIONDATE: "2099-01-01T00:00:00Z"
      ZITADEL_DEFAULTINSTANCE_FEATURES_LOGINV2_REQUIRED: "true"
      # The login UI is Studio, at its public origin (scheme and CHELABASE_STUDIO_HOST).
      ZITADEL_DEFAULTINSTANCE_FEATURES_LOGINV2_BASEURI: "${CHELABASE_PUBLIC_SCHEME:?set by chelabase workbench (stack.env)}://${CHELABASE_STUDIO_HOST:?set by chelabase workbench (stack.env)}/"
      ZITADEL_OIDC_DEFAULTLOGINURLV2: "${CHELABASE_PUBLIC_SCHEME}://${CHELABASE_STUDIO_HOST}/login?authRequest="
      ZITADEL_OIDC_DEFAULTLOGOUTURLV2: "${CHELABASE_PUBLIC_SCHEME}://${CHELABASE_STUDIO_HOST}/logout?post_logout_redirect="
      # Actions call the orchestrator by service name (a private address on the stack network,
      # allowed); loopback and link-local stay blocked.
      ZITADEL_HTTPCLIENT_DENYLIST: "localhost,0.0.0.0/8,127.0.0.0/8,169.254.0.0/16,::1/128"
    depends_on:
      zitadel-db:
        condition: service_healthy
    volumes:
      - type: bind
        source: ${CHELABASE_STACK_DIR}/zitadel
        target: /zitadel-bootstrap
    # The image has no shell or HTTP client; `zitadel ready` asks its own /debug/ready.
    healthcheck:
      test: ["CMD", "/app/zitadel", "ready"]
      interval: 5s
      timeout: 5s
      retries: 60
      start_period: 30s

  # Local mail catcher: Zitadel's emails (invites, resets, verification codes) land here; its UI
  # is the stack's mail host, through the gateway.
  mailpit:
    image: axllent/mailpit:v1.31.3@sha256:ed9b00c609e77e99c79b93f1178255ebc271868920f2c69a8d166bd5634ed10d
    restart: unless-stopped
    environment:
      # Zitadel needs SMTP credentials (it can't handle an empty password), so
      # accept any user/password over plain SMTP. Local dev only.
      MP_SMTP_AUTH_ACCEPT_ANY: "true"
      MP_SMTP_AUTH_ALLOW_INSECURE: "true"
    # `mailpit readyz` asks the server's /readyz (the image has no HTTP client of its own).
    healthcheck:
      test: ["CMD", "/mailpit", "readyz"]
      interval: 2s
      timeout: 5s
      retries: 30

  # --- Neon storage ------------------------------------------------------
  # Flags and health checks come from the old cheladb repo's core/docker/docker-compose.yml,
  # checked there against the pinned Neon source.

  # All-in-one SeaweedFS (master, volume, filer, S3) for pageserver layers and safekeeper WAL.
  seaweedfs:
    image: chrislusf/seaweedfs:4.47@sha256:ce9e796f1fe6f06968f4c04bdaf8f678dad9c8acdfef3d244133d71bfa6bf882
    restart: unless-stopped
    entrypoint: ["/bin/sh", "-c"]
    command:
      - |
        cat > /tmp/s3.json <<EOT
        {"identities": [{"name": "neon",
          "credentials": [{"accessKey": "chelabase-dev", "secretKey": "chelabase-dev-secret"}],
          "actions": ["Admin", "Read", "Write", "List", "Tagging"]}]}
        EOT
        exec weed server -s3 -s3.config=/tmp/s3.json -dir=/data -volume.max=64 -master.volumeSizeLimitMB=1024
    volumes:
      - neon_seaweedfs_data:/data
    healthcheck:
      test: ["CMD", "nc", "-z", "127.0.0.1", "8333"]
      interval: 2s
      retries: 60

  create-bucket:
    image: *neon-image
    restart: "no"
    environment: *neon-s3-env
    entrypoint: ["/bin/sh", "-c"]
    command:
      - |
        for i in $$(seq 60); do
          aws --endpoint-url http://seaweedfs:8333 s3 mb s3://neon 2>/dev/null ||
            aws --endpoint-url http://seaweedfs:8333 s3 ls s3://neon >/dev/null && exit 0
          sleep 2
        done
        exit 1
    depends_on:
      seaweedfs:
        condition: service_healthy

  storage-broker:
    image: *neon-image
    restart: unless-stopped
    command: ["storage_broker", "--listen-addr=0.0.0.0:50051"]
    healthcheck:
      test: ["CMD", "bash", "-c", "</dev/tcp/127.0.0.1/50051"]
      interval: 2s
      retries: 60

  # One safekeeper keeps WAL on one disk; enough for local dev. The worker reads each
  # timeline's commit LSN from its HTTP API (CHELABASE_SAFEKEEPER_HTTP, by service name).
  safekeeper1:
    image: *neon-image
    restart: unless-stopped
    environment: *neon-s3-env
    command:
      - safekeeper
      - --id=1
      - -D
      - /data
      - --listen-pg=0.0.0.0:5454
      - --listen-http=0.0.0.0:7676
      - --advertise-pg=safekeeper1:5454
      - --availability-zone=az-1
      - --broker-endpoint=http://storage-broker:50051
      - "--remote-storage={endpoint='http://seaweedfs:8333', bucket_name='neon', bucket_region='us-east-1', prefix_in_bucket='/safekeeper/'}"
    volumes:
      - neon_safekeeper1_data:/data
    healthcheck:
      test: ["CMD", "curl", "-fsS", "http://127.0.0.1:7676/v1/status"]
      interval: 2s
      retries: 60
    depends_on:
      storage-broker:
        condition: service_healthy
      create-bucket:
        condition: service_completed_successfully

  storcon-db:
    image: postgres:17.11-alpine@sha256:b0f9560a2de083e2cc7382e75f808c7381a32852a7ec49117deedb300e552b24
    restart: unless-stopped
    environment:
      # Local dev only.
      POSTGRES_USER: storcon
      POSTGRES_PASSWORD: storcon
      POSTGRES_DB: storage_controller
    volumes:
      - neon_storcon_pg_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U storcon -d storage_controller"]
      interval: 2s
      retries: 60

  storage-controller:
    image: *neon-image
    restart: unless-stopped
    command:
      - storage_controller
      # --dev: no JWT auth between storage components. Their ports stay on the stack's network.
      - --dev
      - --listen=0.0.0.0:1234
      # Attachment changes (every tenant create, too) are pushed to the orchestrator's
      # internal listener, by service name; a tenant's reconcile waits until it answers. The
      # token is local dev only.
      - --control-plane-url=http://orchestrator:8083/storcon
      - --control-plane-jwt-token=${CHELABASE_STORCON_HOOK_TOKEN:-chelabase-dev-storcon-hook}
      - --database-url=postgresql://storcon:storcon@storcon-db:5432/storage_controller
      # The controller creates and deletes each timeline on the safekeepers (one, here). Without
      # these, the compute creates them implicitly and a deleted database, branch or superseded
      # timeline leaves its WAL on the safekeeper and in S3. Count 1: the default 3 needs three.
      - --timelines-onto-safekeepers
      - --timeline-safekeeper-count=1
    healthcheck:
      test: ["CMD", "curl", "-fsS", "http://127.0.0.1:1234/ready"]
      interval: 2s
      retries: 60
    depends_on:
      storcon-db:
        condition: service_healthy

  # Registers with the storage controller from metadata.json at startup.
  pageserver:
    image: *neon-image
    restart: unless-stopped
    environment: *neon-s3-env
    entrypoint: ["/bin/sh", "-c"]
    command:
      - |
        set -e
        mkdir -p /data/.neon
        echo 'id=1' > /data/.neon/identity.toml
        cat > /data/.neon/pageserver.toml <<EOT
        broker_endpoint='http://storage-broker:50051'
        pg_distrib_dir='/usr/local/'
        listen_pg_addr='0.0.0.0:6400'
        listen_http_addr='0.0.0.0:9898'
        control_plane_api='http://storage-controller:1234/upcall/v1/'
        virtual_file_io_mode='buffered'
        remote_storage={ endpoint='http://seaweedfs:8333', bucket_name='neon', bucket_region='us-east-1', prefix_in_bucket='/pageserver' }
        EOT
        echo '{"host":"pageserver","port":6400,"http_host":"pageserver","http_port":9898,"availability_zone_id":"az-1"}' > /data/.neon/metadata.json
        exec pageserver -D /data/.neon
    volumes:
      - neon_pageserver_data:/data
    healthcheck:
      test: ["CMD", "curl", "-fsS", "http://127.0.0.1:9898/v1/status"]
      interval: 2s
      retries: 60
    depends_on:
      storage-broker:
        condition: service_healthy
      storage-controller:
        condition: service_healthy
      create-bucket:
        condition: service_completed_successfully

  # One-shot: registers the safekeepers with the storage controller and marks them Active.
  register-safekeepers:
    image: *neon-image
    restart: "no"
    entrypoint: ["/bin/sh", "-c"]
    command:
      - |
        set -e
        S=http://storage-controller:1234
        for ID in 1; do
          curl -fsS -X POST -H 'Content-Type: application/json' \
            -d "{\"id\":$$ID,\"created_at\":\"2023-10-25T09:11:25Z\",\"updated_at\":\"2024-08-28T11:32:43Z\",\"region_id\":\"local\",\"host\":\"safekeeper$$ID\",\"port\":5454,\"http_port\":7676,\"https_port\":null,\"version\":5957,\"availability_zone_id\":\"az-$$ID\"}" \
            $$S/control/v1/safekeeper/$$ID
          curl -fsS -X POST -H 'Content-Type: application/json' \
            -d '{"scheduling_policy":"Active"}' $$S/control/v1/safekeeper/$$ID/scheduling_policy
        done
    depends_on:
      storage-controller:
        condition: service_healthy
      safekeeper1:
        condition: service_healthy

  # Writes the proxy's TLS certificate once: a local CA and a *.localtest.me certificate signed
  # by it. Clients verify against the CA; `chelabase workbench up` copies it to
  # <state>/neon/proxy-ca.crt.
  proxy-tls:
    image: *neon-image
    restart: "no"
    user: "0"
    entrypoint: ["/bin/sh", "-c"]
    command:
      - |
        set -e
        cd /tls
        if [ -s tls.crt ] && openssl x509 -in tls.crt -noout -subject | grep -qF '*.localtest.me'; then
          echo "certificate for *.localtest.me exists"; exit 0
        fi
        [ -s ca.key ] || openssl req -x509 -newkey ec -pkeyopt ec_paramgen_curve:P-256 -nodes \
          -keyout ca.key -out ca.crt -days 3650 -subj "/CN=Chelabase local CA"
        openssl req -newkey ec -pkeyopt ec_paramgen_curve:P-256 -nodes -keyout tls.key -out tls.csr \
          -subj "/CN=*.localtest.me"
        printf 'subjectAltName=DNS:*.localtest.me\n' > ext.cnf
        openssl x509 -req -in tls.csr -CA ca.crt -CAkey ca.key -CAcreateserial -days 825 \
          -extfile ext.cnf -out tls.crt
        rm -f tls.csr ext.cnf
        chown 1000:1000 tls.key tls.crt ca.crt
        chmod 600 ca.key tls.key
        echo "issued a certificate for *.localtest.me"
    volumes: ["neon_proxy_tls:/tls"]
    network_mode: none

  # Neon's proxy. Clients connect to <endpoint-id>.localtest.me (which resolves to 127.0.0.1):
  # Postgres wire on the stack's proxy port (4432 inside); WebSocket and SQL over HTTP on 4444,
  # inside the stack's network only. It asks the orchestrator's internal listener for role
  # secrets and compute addresses, and reaches computes on this network. Role secrets are cached
  # for at most a minute, and dropped at once when the control plane publishes
  # /password_updated to Valkey.
  proxy:
    image: *neon-image
    restart: unless-stopped
    command:
      - proxy
      - --auth-backend=control-plane
      - --auth-endpoint=http://orchestrator:8083/proxy/api/v1
      - --proxy=0.0.0.0:4432
      - --wss=0.0.0.0:4444
      # The proxy takes the endpoint domain from the certificate's CN.
      - --tls-cert=/tls/tls.crt
      - --tls-key=/tls/tls.key
      - --project-info-cache=size=10000,ttl=1m,max_roles=64,gc_interval=60m
      - --redis-auth-type=plain
      - --redis-plain=redis://valkey:6379
    environment:
      NEON_PROXY_TO_CONTROLPLANE_TOKEN: ${CHELABASE_PROXY_API_TOKEN:-chelabase-dev-proxy-api}
    ports:
      - "127.0.0.1:${CHELABASE_PROXY_PORT:?set by chelabase workbench (stack.env)}:4432"
      - "[::1]:${CHELABASE_PROXY_PORT}:4432"
    volumes: ["neon_proxy_tls:/tls:ro"]
    healthcheck:
      test: ["CMD", "bash", "-c", "</dev/tcp/127.0.0.1/4432"]
      interval: 2s
      retries: 60
    depends_on:
      proxy-tls:
        condition: service_completed_successfully
      # The proxy exits if it can't reach Redis at startup.
      valkey:
        condition: service_healthy

  # --- The app tier: the checkout's host-built debug binaries in the workbench image ---------
  # Listeners bind 0.0.0.0 inside and every URL is a service name (stack.env). The gateway is the
  # one way in from the host.

  orchestrator:
    <<: *workbench
    command: ["${CHELABASE_CHECKOUT}/target/debug/orchestrator"]
    env_file:
      - *stack-env
      - *demo-env
      - path: ${CHELABASE_STACK_DIR}/zitadel/actions.env
        required: false
    environment:
      # Connection strings name the proxy's published port on the host.
      - CHELABASE_PROXY_PG_PORT=${CHELABASE_PROXY_PORT}
      # Bare names: taken from the caller's env, unset when it has none. The runner's live tests
      # recreate the orchestrator with these to exercise the settings (roles_live).
      - CHELABASE_PASSWORD_STRENGTH
      - CHELABASE_BRANCH_DATABASE_CAP
    group_add: ["${CHELABASE_DOCKER_GID:?set by chelabase workbench (stack.env)}"]
    # On both networks: the default one for the apps, `control` (static address) for its TLS
    # connections to computes.
    networks:
      default: {}
      control:
        ipv4_address: ${CHELABASE_ORCHESTRATOR_CONTROL_IP:?set by chelabase workbench (stack.env)}
    volumes:
      - *checkout-ro
      - *keys-mask
      - *checkout-mask
      - *key-secrets
      - *key-internal-verify
      - *key-compute-jwt-private
      - *key-compute-jwt-public
      - *keys-orchestrator-tls-ro
      - *state
      - *docker-sock
    healthcheck:
      <<: *app-health
      test: ["CMD-SHELL", "curl -fsS http://127.0.0.1:8081/health && curl -fsS http://127.0.0.1:8083/health"]
    depends_on:
      metadata-db:
        condition: service_healthy
      nats:
        condition: service_healthy
      valkey:
        condition: service_healthy
      storage-controller:
        condition: service_healthy
      zitadel:
        condition: service_healthy

  worker:
    <<: *workbench
    command: ["${CHELABASE_CHECKOUT}/target/debug/worker"]
    env_file:
      - *stack-env
      - *demo-env
    group_add: ["${CHELABASE_DOCKER_GID}"]
    volumes:
      - *checkout-ro
      - *keys-mask
      - *checkout-mask
      - *key-secrets
      - *key-compute-jwt-private
      - *key-compute-jwt-public
      - *keys-compute-ca-rw
      - *keys-orchestrator-tls-rw
      - *state
      - *docker-sock
    healthcheck:
      <<: *app-health
      test: ["CMD", "curl", "-fsS", "http://127.0.0.1:8082/health"]
    depends_on:
      metadata-db:
        condition: service_healthy
      nats:
        condition: service_healthy
      valkey:
        condition: service_healthy
      storage-controller:
        condition: service_healthy
      pageserver:
        condition: service_healthy
      safekeeper1:
        condition: service_healthy
      register-safekeepers:
        condition: service_completed_successfully
      zitadel:
        condition: service_healthy

  # The front door. It listens on the stack's gateway port inside too (CHELABASE_GATEWAY_LISTEN)
  # and answers every host of its stack on the network (the aliases), so one URL works from the
  # host, from an app container and from the runner. It starts before its backends (502 until
  # they come up).
  gateway:
    <<: *workbench
    command: ["${CHELABASE_CHECKOUT}/target/debug/gateway"]
    env_file:
      - *stack-env
      - *demo-env
    ports:
      - "127.0.0.1:${CHELABASE_GATEWAY_PORT:?set by chelabase workbench (stack.env)}:${CHELABASE_GATEWAY_PORT}"
      - "[::1]:${CHELABASE_GATEWAY_PORT}:${CHELABASE_GATEWAY_PORT}"
    networks:
      default:
        aliases:
          - ${CHELABASE_STUDIO_HOST_NAME:?set by chelabase workbench (stack.env)}
          - ${CHELABASE_API_HOST_NAME:?set by chelabase workbench (stack.env)}
          - ${CHELABASE_AUTH_HOST_NAME}
          - ${CHELABASE_MAIL_HOST_NAME:?set by chelabase workbench (stack.env)}
          - ${CHELABASE_DOCS_HOST_NAME:?set by chelabase workbench (stack.env)}
          - ${CHELABASE_LANDING_HOST_NAME:?set by chelabase workbench (stack.env)}
    volumes:
      - *checkout-ro
      - *keys-mask
      - *checkout-mask
      - *key-internal-signing
      - *key-app-jwt-public
      - *state
    healthcheck:
      <<: *app-health
      test: ["CMD", "curl", "-fsS", "http://127.0.0.1:${CHELABASE_GATEWAY_PORT}/_gateway/health"]
    depends_on:
      zitadel:
        condition: service_healthy
      mailpit:
        condition: service_healthy

  # Studio's sign-in backend. Only the gateway reaches it (CHELABASE_AUTH_TRUSTED_PROXY).
  auth:
    <<: *workbench
    command: ["${CHELABASE_CHECKOUT}/target/debug/auth"]
    env_file:
      - *stack-env
      - *demo-env
    volumes:
      - *checkout-ro
      - *keys-mask
      - *checkout-mask
      - *key-cookie
      - *key-app-jwt-private
      - *key-app-jwt-public
      - *key-internal-verify
      - *key-compute-ca-cert
      - *state
    # auth has no health route: any HTTP answer (even a 404) means it is serving.
    healthcheck:
      <<: *app-health
      test: ["CMD", "curl", "-sS", "-o", "/dev/null", "http://127.0.0.1:8084/"]
    depends_on:
      zitadel:
        condition: service_healthy

  rest:
    <<: *workbench
    command: ["${CHELABASE_CHECKOUT}/target/debug/rest"]
    env_file:
      - *stack-env
      - *demo-env
    volumes:
      - *checkout-ro
      - *keys-mask
      - *checkout-mask
      - *key-internal-verify
      - *key-compute-ca-cert
      - *state
    # rest has no health route: any HTTP answer (even a 404) means it is serving.
    healthcheck:
      <<: *app-health
      test: ["CMD", "curl", "-sS", "-o", "/dev/null", "http://127.0.0.1:8085/"]
    depends_on:
      metadata-db:
        condition: service_healthy

  # Vite dev servers from the checkout (read-write: Vite's cache lives under node_modules), bound
  # to 0.0.0.0 (CHELABASE_*_BIND) and reached through the gateway; HMR goes through it too.
  studio:
    <<: *workbench
    command: ["pnpm", "--filter", "@chelabase/studio", "dev"]
    env_file:
      - *stack-env
      - path: ${CHELABASE_STACK_DIR}/studio.env
        required: false
    environment:
      CHELABASE_STUDIO_PORT: "3000"
    volumes:
      - *checkout-rw
      - *keys-mask
      - *checkout-mask
    healthcheck:
      <<: *app-health
      test: ["CMD", "curl", "-fsS", "-o", "/dev/null", "-H", "Host: ${CHELABASE_STUDIO_HOST_NAME}", "http://127.0.0.1:3000/"]

  docs:
    <<: *workbench
    profiles: ["sites"]
    command: ["pnpm", "--filter", "@chelabase/docs", "dev"]
    env_file:
      - *stack-env
    volumes:
      - *checkout-rw
      - *keys-mask
      - *checkout-mask
    healthcheck:
      <<: *app-health
      test: ["CMD", "curl", "-fsS", "-o", "/dev/null", "-H", "Host: ${CHELABASE_DOCS_HOST_NAME}", "http://127.0.0.1:3001/"]

  landing:
    <<: *workbench
    profiles: ["sites"]
    command: ["pnpm", "--filter", "@chelabase/landing", "dev"]
    env_file:
      - *stack-env
    volumes:
      - *checkout-rw
      - *keys-mask
      - *checkout-mask
    healthcheck:
      <<: *app-health
      test: ["CMD", "curl", "-fsS", "-o", "/dev/null", "-H", "Host: ${CHELABASE_LANDING_HOST_NAME}", "http://127.0.0.1:3002/"]

  # The test runner (`chelabase workbench test` / `run`, through `compose run --rm`): live tests
  # and e2e scripts on the stack's network, by service name. The CLI points CHELABASE_NEXTEST_BIN
  # at the host's cargo-nextest.
  runner:
    <<: *workbench
    profiles: ["runner"]
    restart: "no"
    entrypoint: []
    env_file:
      - *stack-env
      - *demo-env
    environment:
      # Bare names: a live test's own input, taken from the caller's env (unset when it has none),
      # e.g. `CHELABASE_LIVE_ENDPOINT=ep-… just workbench test -p chelabase-neon …`.
      - CHELABASE_LIVE_ENDPOINT
    group_add: ["${CHELABASE_DOCKER_GID}"]
    # The static address is in the member-login rule's address list.
    networks:
      default: {}
      control:
        ipv4_address: ${CHELABASE_RUNNER_CONTROL_IP:?set by chelabase workbench (stack.env)}
    volumes:
      - *checkout-rw
      - *keys-mask
      - *checkout-mask
      - *key-secrets
      - *key-compute-jwt-private
      - *key-compute-jwt-public
      - *key-app-jwt-private
      - *key-app-jwt-public
      - *keys-compute-ca-ro
      - *keys-orchestrator-tls-ro
      - *state
      - *docker-sock
      - type: bind
        source: ${CHELABASE_NEXTEST_BIN:-/usr/local/bin/cargo-nextest}
        target: /usr/local/bin/cargo-nextest
        read_only: true

networks:
  # Orchestrator and test runner to computes (<project>_control). A fixed subnet per stack from
  # the registry's control slot; computes take addresses from the upper /23 only.
  control:
    ipam:
      config:
        - subnet: ${CHELABASE_CONTROL_SUBNET:?set by chelabase workbench (stack.env)}
          ip_range: ${CHELABASE_CONTROL_COMPUTE_RANGE:?set by chelabase workbench (stack.env)}

volumes:
  metadata_pg_data:
  nats_data:
  valkey_data:
  zitadel_pg_data:
  neon_seaweedfs_data:
  neon_pageserver_data:
  neon_safekeeper1_data:
  neon_storcon_pg_data:
  neon_proxy_tls:
