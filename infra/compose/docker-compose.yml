# A Chelabase workbench stack (W2): the infra, Neon storage and proxy, Zitadel, Mailpit and the app
# tier (orchestrator, worker, gateway, auth, rest, Studio; docs and landing under the `sites`
# profile; the test runner under the `runner` profile).
#
# One file, any project: there is no `name:`. Every caller goes through `chelabase workbench`,
# which passes `-p <project> -f <checkout>/infra/compose/docker-compose.yml
# --env-file <state>/env/stack.env`; stack.env is rendered from .env.example plus the stack's own
# values (its slug, ports, host names, paths, uid/gid, the workbench image).
#
# Reachable from the host only through the gateway's port and the proxy's Postgres port, each on
# 127.0.0.1 and ::1. Everything else talks over the project network by service name; computes get
# their own `compute` network (see `networks:` at the end). NATS, Valkey and the storage services
# require credentials (RT1 T1).

# --- Neon storage ---
# Pinned by digest; `chelabase workbench up` overrides these with a local `just neon-build` when
# present. The packages are public on ghcr.io (infra/neon/README.md).
x-neon-images:
  neon: &neon-image ${NEON_IMAGE:-ghcr.io/chelabase/neon-storage:629166ceef60-dev@sha256:75794bed0c2fe5d447964735edb3eac21e55c45562a00c344fb4bb1a88509419}
  # The image of the compute containers the worker starts (CHELABASE_COMPUTE_IMAGE); pinned here.
  compute: ${COMPUTE_NODE_IMAGE:-ghcr.io/chelabase/neon-compute-v17:629166ceef60-dev@sha256:281c47327e04fbc5db58f3d9a24a2ced0c74e0d03907260f2c6290f6db3e436b}

# The Neon services that read the stack's 0600 secrets run as the stack's uid:gid (the files'
# owner), whatever the host uid is; the image's own user (uid 1000) can read them only when the
# host uid happens to be 1000. Those without a data volume set `user:`; the pageserver and the
# safekeepers start as root only to hand their data volume (created by the image as 1000:1000)
# to the stack's uid once, then drop to it before anything else runs.
x-neon-as-stack-user: &neon-as-stack-user
  - /bin/sh
  - -c
  - >-
    set -e;
    [ "$$(stat -c %u:%g /data)" = "${CHELABASE_UID}:${CHELABASE_GID}" ] ||
    chown -R "${CHELABASE_UID}:${CHELABASE_GID}" /data;
    exec setpriv --reuid="${CHELABASE_UID}" --regid="${CHELABASE_GID}" --clear-groups -- "$$@"
  - neon

# S3 credentials for SeaweedFS. Local dev only.
x-neon-s3-env: &neon-s3-env
  AWS_ACCESS_KEY_ID: chelabase-dev
  AWS_SECRET_ACCESS_KEY: chelabase-dev-secret
  AWS_DEFAULT_REGION: us-east-1

# --- The app tier's shared parts ---
# Every path is mounted at its own host path (the checkout, the shared machine keys under
# <main>/.chelabase, the stack's state dir), so the file paths in demo.env mean the same thing
# inside and outside the containers.
x-workbench: &workbench
  image: ${CHELABASE_WORKBENCH_IMAGE:?set by chelabase workbench (stack.env)}
  user: "${CHELABASE_UID:?set by chelabase workbench (stack.env)}:${CHELABASE_GID:?set by chelabase workbench (stack.env)}"
  working_dir: ${CHELABASE_CHECKOUT:?set by chelabase workbench (stack.env)}
  restart: unless-stopped

# stack.env is always rendered before the CLI calls Compose (it is the --env-file too, and the
# `:?` settings above fail without it), so it is not marked required here: `docker compose
# config` must render a stack offline from the fixture alone.
x-stack-env: &stack-env
  path: ${CHELABASE_STACK_DIR:?set by chelabase workbench (stack.env)}/env/stack.env
  required: false
x-demo-env: &demo-env
  path: ${CHELABASE_STACK_DIR}/zitadel/demo.env
  required: false

x-checkout-ro: &checkout-ro
  type: bind
  source: ${CHELABASE_CHECKOUT}
