language: "bash"

# The lifecycle lives in the justfile: it loads the worktree's slot first (ports, project, and
# CHELADB_SHARED_DIR so the shared tier's mounts name the same paths from every worktree).
tasks:
  up:
    command: "just"
    args: ["deps-up"]
    options:
      cache: false
      runFromWorkspaceRoot: true
  down:
    command: "just"
    args: ["deps-down"]
    options:
      cache: false
      runFromWorkspaceRoot: true
  ps:
    command: "just"
    args: ["deps-ps"]
    options:
      cache: false
      runFromWorkspaceRoot: true
