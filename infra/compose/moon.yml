language: "bash"

# The lifecycle lives in the justfile: `just workbench …` manages this checkout's stack.
tasks:
  up:
    command: "just"
    args: ["workbench", "up"]
    options:
      cache: false
      runFromWorkspaceRoot: true
  down:
    command: "just"
    args: ["workbench", "down"]
    options:
      cache: false
      runFromWorkspaceRoot: true
  ps:
    command: "just"
    args: ["workbench", "status"]
    options:
      cache: false
      runFromWorkspaceRoot: true
