language: "bash"

# The lifecycle lives in the justfile (it refuses while another worktree holds the stack: just live).
tasks:
  up:
    command: "just"
    args: ["deps-up"]
    options:
      cache: false
      runFromWorkspaceRoot: true
  down:
    command: "just"
    args: ["deps-down"]
    options:
      cache: false
      runFromWorkspaceRoot: true
  ps:
    command: "just"
    args: ["deps-ps"]
    options:
      cache: false
      runFromWorkspaceRoot: true
