# The workbench overlay on docker-compose.yml: everything only the dev loop needs. Every
# `chelabase workbench` compose call passes `-f docker-compose.yml -f docker-compose.workbench.yml`
# (base first), so the pair is one stack; scripts/tests/compose-overlay-equiv.sh checks it renders
# what it did before the base file became the self-hosted install (m8).
#
# Here: the workbench image, uid/gid and working dir of the app tier (`x-workbench`), its commands
# (the checkout's host-built debug binaries, the Vite dev servers), the Docker group, the env
# files from the stack's state dir, every checkout and state-dir mount, the stack's published
# ports, its control subnet and static addresses, the gateway's host aliases, and the dev-only
# services: Mailpit, the sites (profile `sites`) and the test runner (profile `runner`).
#
# The base file is the self-hosted install: its secrets come from the `secrets` volume that
# init-secrets fills, its services run as the images' users, and it has no fixed credential. A
# workbench stack keeps what it had: its keys dir and state dir (per-service files as Compose
# secrets, the top-level `secrets:` below), the stack's uid:gid, and the fixed dev values its
# volumes were made with (the database passwords, the S3 keys). So this
# file turns the two one-shots off (profile `self-hosted`, never activated) and sets back, with
# `!override` (replace the base's value) and `!reset` (drop it), every key the base changed:
# environment, user, entrypoint, command, volumes, depends_on, group_add, ports and networks.
#
# Compose merges this file into the base one key by key: maps (environment, networks,
# depends_on) merge, lists of mounts merge by target, and scalars (image, command) replace.
# YAML anchors can't cross files: the ones below are this file's own.

# The Neon services that read the stack's 0600 secrets run as the stack's uid:gid (the files'
# owner), whatever the host uid is; the image's own user (uid 1000) can read them only when the
# host uid happens to be 1000. Those without a data volume set `user:`; the pageserver and the
# safekeepers start as root only to hand their data volume (created by the image as 1000:1000)
# to the stack's uid once, then drop to it before anything else runs.
x-neon-as-stack-user: &neon-as-stack-user
  - /bin/sh
  - -c
  - >-
    set -e;
    [ "$$(stat -c %u:%g /data)" = "${CHELABASE_UID}:${CHELABASE_GID}" ] ||
    chown -R "${CHELABASE_UID}:${CHELABASE_GID}" /data;
    exec setpriv --reuid="${CHELABASE_UID}" --regid="${CHELABASE_GID}" --clear-groups -- "$$@"
  - neon

# S3 credentials for SeaweedFS: the workbench's fixed dev values (its volumes hold data written
# with them). Local dev only.
x-neon-s3-env: &neon-s3-env
  AWS_ACCESS_KEY_ID: chelabase-dev
  AWS_SECRET_ACCESS_KEY: chelabase-dev-secret
  AWS_DEFAULT_REGION: us-east-1

# --- The app tier's shared parts ---
# Every path is mounted at its own host path (the checkout, the shared machine keys under
# <main>/.chelabase), so the file paths in the env files mean the same thing inside and outside
# the containers. No app opens a file of the stack's state dir; its env files (stack.env,
# studio.env) are read by Compose on the host, at create time, and need no mount. Only the runner
# mounts the whole state dir (`x-state`).
x-workbench: &workbench
  image: ${CHELABASE_WORKBENCH_IMAGE:?set by chelabase workbench (stack.env)}
  user: "${CHELABASE_UID:?set by chelabase workbench (stack.env)}:${CHELABASE_GID:?set by chelabase workbench (stack.env)}"
  working_dir: ${CHELABASE_CHECKOUT:?set by chelabase workbench (stack.env)}
  restart: unless-stopped

# stack.env is always rendered before the CLI calls Compose (it is the --env-file too, and the
# `:?` settings above fail without it), so it is not marked required here: `docker compose
# config` must render a stack offline from the fixture alone.
x-stack-env: &stack-env
  path: ${CHELABASE_STACK_DIR:?set by chelabase workbench (stack.env)}/env/stack.env
  required: false

x-checkout-ro: &checkout-ro
  type: bind
  source: ${CHELABASE_CHECKOUT}
  target: ${CHELABASE_CHECKOUT}
  read_only: true
x-checkout-rw: &checkout-rw
  type: bind
  source: ${CHELABASE_CHECKOUT}
  target: ${CHELABASE_CHECKOUT}
# Machine keys, one file at its own path per service that reads it (U10): a service sees exactly
# the key files it reads and nothing else under the keys dir. `.chelabase` inside every checkout
# mount is masked first (an empty tmpfs; on the main stack the keys dir is that directory), then
# the narrow mounts go on top (Docker applies mounts by target depth): the per-service key files
# are Compose secrets (the base file's `secrets:`), the directory pairs below stay bind mounts.
# Both masks are read-only tmpfs. The first covers the keys dir itself: in a worktree
# `<checkout>/.chelabase` is a symlink to it, Docker follows the link, and it orders mounts by the
# unresolved target depth, so a mask at the link's path would tie with the key mounts and hide
# them; a mask at the (shallower) keys dir never does. The second covers `<checkout>/.chelabase`
# when that is a different directory; the CLI sets CHELABASE_CHECKOUT_MASK to its path then, and
# the default (the keys dir) makes it the same mount point as the first, which Compose merges.
x-keys-mask: &keys-mask
  type: tmpfs
  target: ${CHELABASE_KEYS_DIR:?set by chelabase workbench (stack.env)}
  read_only: true
x-checkout-mask: &checkout-mask
  type: tmpfs
  target: ${CHELABASE_CHECKOUT_MASK:-${CHELABASE_KEYS_DIR}}
  read_only: true
# The platform CA (ca.crt, ca.key): the worker issues each compute's server certificate (rw);
# the runner reads it, ro (R-T9a, the live tests that check computes' certificates).
x-keys-compute-ca-rw: &keys-compute-ca-rw
  type: bind
  source: ${CHELABASE_KEYS_DIR}/compute-ca
  target: ${CHELABASE_KEYS_DIR}/compute-ca
  bind: {create_host_path: false}
x-keys-compute-ca-ro: &keys-compute-ca-ro
  type: bind
  source: ${CHELABASE_KEYS_DIR}/compute-ca
  target: ${CHELABASE_KEYS_DIR}/compute-ca
  read_only: true
  bind: {create_host_path: false}
# The orchestrator's client pair. The directory itself is mounted, never `current` or a file, so
# the worker's atomic swap of the `current` symlink is visible to the readers.
x-keys-orchestrator-tls-rw: &keys-orchestrator-tls-rw
  type: bind
  source: ${CHELABASE_KEYS_DIR}/orchestrator-tls
  target: ${CHELABASE_KEYS_DIR}/orchestrator-tls
  bind: {create_host_path: false}
x-keys-orchestrator-tls-ro: &keys-orchestrator-tls-ro
  type: bind
  source: ${CHELABASE_KEYS_DIR}/orchestrator-tls
  target: ${CHELABASE_KEYS_DIR}/orchestrator-tls
  read_only: true
  bind: {create_host_path: false}
# Realtime's client pair (CN chelabase-realtime), same shape as the orchestrator's: the worker
# renews it (rw), realtime and the runner read it (ro).
x-keys-realtime-tls-rw: &keys-realtime-tls-rw
  type: bind
  source: ${CHELABASE_KEYS_DIR}/realtime-tls
  target: ${CHELABASE_KEYS_DIR}/realtime-tls
  bind: {create_host_path: false}
x-keys-realtime-tls-ro: &keys-realtime-tls-ro
  type: bind
  source: ${CHELABASE_KEYS_DIR}/realtime-tls
  target: ${CHELABASE_KEYS_DIR}/realtime-tls
  read_only: true
  bind: {create_host_path: false}
# The stack's whole state dir, read-write at its own path: the runner's alone (the test harness,
# which has the Docker socket anyway). It runs nextest archives from test/, curl with
# CURL_HOME=runner/, `docker compose` with stack.env and the env files to recreate apps
# (roles_live), `dev token` (bootstrap/dev-member.json, and its kept session beside it), reads
# proxy-ca.crt and studio.env, and writes into the dir (upgrade-e2e.env). No app mounts it.
x-state: &state
  type: bind
  source: ${CHELABASE_STACK_DIR}
  target: ${CHELABASE_STACK_DIR}
x-docker-sock: &docker-sock
  type: bind
  source: /var/run/docker.sock
  target: /var/run/docker.sock

x-app-health: &app-health
  interval: 2s
  timeout: 5s
  retries: 30
  start_period: 60s

services:
  # The self-hosted install's one-shots: the workbench makes its secrets and runs its bootstrap
  # itself (`chelabase workbench up`), so these never run here.
  init-secrets:
    profiles: ["self-hosted"]
  init-bootstrap:
    profiles: ["self-hosted"]

  # The workbench's fixed dev passwords (its volumes were made with them).
  metadata-db:
    environment: !override
      POSTGRES_USER: chelabase
      POSTGRES_PASSWORD: chelabase
      POSTGRES_DB: chelabase_metadata
    volumes: !override
      - metadata_pg_data:/var/lib/postgresql/data
    depends_on: !reset {}

  storcon-db:
    environment: !override
      # Local dev only.
      POSTGRES_USER: storcon
      POSTGRES_PASSWORD: storcon
      POSTGRES_DB: storage_controller
    volumes: !override
      - neon_storcon_pg_data:/var/lib/postgresql/data
    depends_on: !reset {}

  # SeaweedFS runs the base file's command: its identities and its gRPC TLS files come from key
  # files, here Compose secrets from the stack's state dir (the CLI writes the fixed dev values of
  # `storage` and a per-stack CA with server and client certificates there, beside Neon's `s3/`
  # pair), so none of them is in `docker inspect`. create-bucket is the base file's one-shot.
  seaweedfs:
    volumes: !override
      - neon_seaweedfs_data:/data
    secrets:
      - {source: s3-neon-access-key, target: /run/chelabase/secrets/s3/access-key}
      - {source: s3-neon-secret-key, target: /run/chelabase/secrets/s3/secret-key}
      - {source: s3-storage-access-key, target: /run/chelabase/secrets/storage-s3/access-key}
      - {source: s3-storage-secret-key, target: /run/chelabase/secrets/storage-s3/secret-key}
      - {source: grpc-tls-ca, target: /run/chelabase/secrets/grpc-tls/ca.crt}
      - {source: grpc-tls-server-crt, target: /run/chelabase/secrets/grpc-tls/server.crt}
      - {source: grpc-tls-server-key, target: /run/chelabase/secrets/grpc-tls/server.key}
      - {source: grpc-tls-client-crt, target: /run/chelabase/secrets/grpc-tls/client.crt}
      - {source: grpc-tls-client-key, target: /run/chelabase/secrets/grpc-tls/client.key}
    depends_on: !reset {}

  safekeeper1:
    user: "0"
    entrypoint: *neon-as-stack-user
    environment: *neon-s3-env
    volumes: !override
      - neon_safekeeper1_data:/data
    secrets:
      - {source: storage-pem, target: /run/storage-auth.pub.pem}
      - {source: storage-safekeeper-data, target: /run/safekeeper-data.jwt}
  safekeeper2:
    user: "0"
    entrypoint: *neon-as-stack-user
    environment: *neon-s3-env
    volumes: !override
      - neon_safekeeper2_data:/data
    secrets:
      - {source: storage-pem, target: /run/storage-auth.pub.pem}
      - {source: storage-safekeeper-data, target: /run/safekeeper-data.jwt}
  safekeeper3:
    user: "0"
    entrypoint: *neon-as-stack-user
    environment: *neon-s3-env
    volumes: !override
      - neon_safekeeper3_data:/data
    secrets:
      - {source: storage-pem, target: /run/storage-auth.pub.pem}
      - {source: storage-safekeeper-data, target: /run/safekeeper-data.jwt}

  storage-controller:
    user: "${CHELABASE_UID}:${CHELABASE_GID}"
    group_add: !reset []
    entrypoint: !override
      - /bin/sh
      - -c
      - >-
        set -e;
        export PUBLIC_KEY="$$(cat /run/storage-auth.pub.pem)";
        exec storage_controller "$$@"
      - storage_controller
    command: !override
      - --listen=0.0.0.0:1234
      - --pageserver-jwt-token-file=/run/pageserver-api.jwt
      - --safekeeper-jwt-token-file=/run/safekeeper-data.jwt
      - --control-plane-jwt-token-file=/run/storcon-hook.token
      - --control-plane-url=http://orchestrator:8083/storcon
      - --database-url=postgresql://storcon:storcon@storcon-db:5432/storage_controller
      - --timelines-onto-safekeepers
      - --timeline-safekeeper-count=3
    volumes: !reset []
    secrets:
      - {source: token-storcon-hook, target: /run/storcon-hook.token}
      - {source: storage-pem, target: /run/storage-auth.pub.pem}
      - {source: storage-pageserver-api, target: /run/pageserver-api.jwt}
      - {source: storage-safekeeper-data, target: /run/safekeeper-data.jwt}

  pageserver:
    user: "0"
    entrypoint: *neon-as-stack-user
    environment: *neon-s3-env
    volumes: !override
      - neon_pageserver_data:/data
    secrets:
      - {source: storage-pem, target: /run/storage-auth.pub.pem}
      - {source: storage-generations-api, target: /run/generations-api.jwt}
      - {source: storage-safekeeper-data, target: /run/safekeeper-data.jwt}

  register-safekeepers:
    user: "${CHELABASE_UID}:${CHELABASE_GID}"
    volumes: !reset []
    secrets:
      - {source: storage-storcon-admin, target: /run/storcon-admin.jwt}

  # `chelabase workbench up` copies the CA to <state>/neon/proxy-ca.crt. Always *.localtest.me
  # (the base's CHELABASE_PROXY_DOMAIN is a self-hosted setting).
  proxy-tls:
    environment: !reset {}
    command: !override
      - |
        set -e
        cd /tls
        # The proxy runs as the stack's uid (it reads the stack's 0600 secrets too).
        owner="${CHELABASE_UID}:${CHELABASE_GID}"
        if [ -s tls.crt ] && openssl x509 -in tls.crt -noout -subject | grep -qF '*.localtest.me'; then
          chown "$$owner" tls.key tls.crt ca.crt
          echo "certificate for *.localtest.me exists"; exit 0
        fi
        [ -s ca.key ] || openssl req -x509 -newkey ec -pkeyopt ec_paramgen_curve:P-256 -nodes \
          -keyout ca.key -out ca.crt -days 3650 -subj "/CN=Chelabase local CA"
        openssl req -newkey ec -pkeyopt ec_paramgen_curve:P-256 -nodes -keyout tls.key -out tls.csr \
          -subj "/CN=*.localtest.me"
        printf 'subjectAltName=DNS:*.localtest.me\n' > ext.cnf
        openssl x509 -req -in tls.csr -CA ca.crt -CAkey ca.key -CAcreateserial -days 825 \
          -extfile ext.cnf -out tls.crt
        rm -f tls.csr ext.cnf
        chown "$$owner" tls.key tls.crt ca.crt
        chmod 600 ca.key tls.key
        echo "issued a certificate for *.localtest.me"

  # NATS's config from the checkout and the users the workbench renders into the stack's state
  # dir (bcrypt hashes only).
  nats:
    depends_on: !reset {}
    volumes: !override
      - nats_data:/data
      - type: bind
        source: ${CHELABASE_CHECKOUT}/infra/compose/nats/nats.conf
        target: /etc/nats/nats.conf
        read_only: true
        bind: {create_host_path: false}
      - type: bind
        source: ${CHELABASE_STACK_DIR}/nats/auth.conf
        target: /etc/nats/auth.conf
        read_only: true
        bind: {create_host_path: false}

  # Valkey's ACL users, rendered by the workbench into the stack's state dir (SHA-256 hashes
  # only). It runs as the stack's uid to read that 0600 file.
  valkey:
    user: "${CHELABASE_UID}:${CHELABASE_GID}"
    depends_on: !reset {}
    volumes: !override
      - valkey_data:/data
      - type: bind
        source: ${CHELABASE_STACK_DIR}/valkey/users.acl
        target: /etc/valkey/users.acl
        read_only: true
        bind: {create_host_path: false}
    secrets:
      - {source: valkey-health, target: /run/valkey-health.password}

  # Local mail catcher: identity's emails (invites, resets, verification codes) land here; its UI
  # is the stack's mail host, through the gateway.
  mailpit:
    image: axllent/mailpit:v1.31.3@sha256:ed9b00c609e77e99c79b93f1178255ebc271868920f2c69a8d166bd5634ed10d
    restart: unless-stopped
    environment:
      # Accept any user/password over plain SMTP. Local dev only.
      MP_SMTP_AUTH_ACCEPT_ANY: "true"
      MP_SMTP_AUTH_ALLOW_INSECURE: "true"
    # `mailpit readyz` asks the server's /readyz (the image has no HTTP client of its own).
    healthcheck:
      test: ["CMD", "/mailpit", "readyz"]
      interval: 2s
      timeout: 5s
      retries: 30

  # The proxy's Postgres port on the stack's proxy port, loopback only.
  proxy:
    user: "${CHELABASE_UID}:${CHELABASE_GID}"
    volumes: !override
      - neon_proxy_tls:/tls:ro
    secrets:
      - {source: valkey-proxy, target: /run/valkey-proxy.password}
      - {source: token-proxy-api, target: /run/proxy-api.token}
    # Replaces the base's (its SQL-over-HTTP port too: a stack reaches 4444 inside only).
    ports: !override
      - "127.0.0.1:${CHELABASE_PROXY_PORT:?set by chelabase workbench (stack.env)}:4432"
      - "[::1]:${CHELABASE_PROXY_PORT}:4432"

  # --- The app tier: the checkout's host-built debug binaries in the workbench image ---------

  # The identity service from the checkout's TypeScript sources (Node runs them directly; no
  # build), on the workbench image. It keeps the base's entrypoint (the database URL into a
  # private tmpfs from the password file), healthcheck, read-only root and networks (default
  # only, no port). No env file: it reads only the settings below. Its mail goes to Mailpit, in
  # plain SMTP. `up` starts it with the front tier and waits for it before the bootstrap; a
  # change to its sources needs `just workbench restart identity`.
  identity:
    <<: *workbench
    command: ["node", "${CHELABASE_CHECKOUT}/services/identity/src/main.ts"]
    environment: !override
      - CHELABASE_IDENTITY_HOST=0.0.0.0
      - CHELABASE_IDENTITY_PORT=8080
      - CHELABASE_IDENTITY_DB_USER=chelabase_identity
      - CHELABASE_IDENTITY_DB_HOST=metadata-db:5432
      - CHELABASE_IDENTITY_DB_NAME=chelabase_metadata
      - CHELABASE_IDENTITY_DB_PASSWORD_FILE=${CHELABASE_KEYS_DIR}/identity/db.password
      - CHELABASE_IDENTITY_SECRET_FILE=${CHELABASE_KEYS_DIR}/identity/secret
      - CHELABASE_IDENTITY_AUTH_TOKEN_FILE=${CHELABASE_KEYS_DIR}/tokens/auth-identity.token
      - CHELABASE_IDENTITY_ORCHESTRATOR_TOKEN_FILE=${CHELABASE_KEYS_DIR}/tokens/orchestrator-identity.token
      - CHELABASE_IDENTITY_WORKER_TOKEN_FILE=${CHELABASE_KEYS_DIR}/tokens/worker-identity.token
      - CHELABASE_IDENTITY_BOOTSTRAP_TOKEN_FILE=${CHELABASE_KEYS_DIR}/tokens/bootstrap-identity.token
      - CHELABASE_SMTP_HOST=mailpit
      - CHELABASE_SMTP_PORT=1025
      - CHELABASE_SMTP_TLS=none
      - CHELABASE_SMTP_FROM=noreply@${CHELABASE_AUTH_HOST_NAME:?set by chelabase workbench (stack.env)}
    volumes: !override
      - *checkout-ro
      - *keys-mask
      - *checkout-mask
      - {type: tmpfs, target: /tmp}
    tmpfs: !override
      - /run/identity:uid=${CHELABASE_UID},gid=${CHELABASE_GID},mode=0700
    secrets:
      - {source: identity-secret, target: "${CHELABASE_KEYS_DIR}/identity/secret"}
      - {source: identity-db-password, target: "${CHELABASE_KEYS_DIR}/identity/db.password"}
      - {source: token-auth-identity, target: "${CHELABASE_KEYS_DIR}/tokens/auth-identity.token"}
      - {source: token-orchestrator-identity, target: "${CHELABASE_KEYS_DIR}/tokens/orchestrator-identity.token"}
      - {source: token-worker-identity, target: "${CHELABASE_KEYS_DIR}/tokens/worker-identity.token"}
      - {source: token-bootstrap-identity, target: "${CHELABASE_KEYS_DIR}/tokens/bootstrap-identity.token"}
    depends_on: !override
      metadata-db:
        condition: service_healthy
      mailpit:
        condition: service_healthy

  # Each app: its env files and its own variables (`environment: !override` drops the base's
  # self-hosted settings, which would win over the env files), its key files as Compose secrets at
  # their keys-dir paths (`volumes: !override` drops the base's `secrets` volume mounts), and the
  # dependencies it had (no one-shots).
  orchestrator:
    <<: *workbench
    entrypoint: !reset []
    command: ["${CHELABASE_CHECKOUT}/target/debug/orchestrator"]
    env_file:
      - *stack-env
    environment: !override
      # RT1 T1 (S1, S27): its own credentials, from its own secrets below.
      - CHELABASE_NATS_USER=orchestrator
      - CHELABASE_NATS_PASSWORD_FILE=${CHELABASE_KEYS_DIR}/nats/orchestrator.password
      - CHELABASE_NATS_INBOX_PREFIX=_INBOX_orchestrator
      - CHELABASE_VALKEY_USER=control
      - CHELABASE_VALKEY_PASSWORD_FILE=${CHELABASE_KEYS_DIR}/valkey/control.password
      - CHELABASE_REALTIME_INTERNAL_TOKEN_FILE=${CHELABASE_KEYS_DIR}/realtime/internal.token
      - CHELABASE_REST_INTERNAL_TOKEN_FILE=${CHELABASE_KEYS_DIR}/tokens/rest-internal.token
      - CHELABASE_DATA_KEYS_TOKEN_FILE=${CHELABASE_KEYS_DIR}/tokens/data-keys.token
      - CHELABASE_APP_AUTH_INTERNAL_TOKEN_FILE=${CHELABASE_KEYS_DIR}/tokens/app-auth.token
      - CHELABASE_APP_SESSIONS_INTERNAL_TOKEN_FILE=${CHELABASE_KEYS_DIR}/tokens/app-sessions.token
      - CHELABASE_STORAGE_INTERNAL_TOKEN_FILE=${CHELABASE_KEYS_DIR}/tokens/storage-internal.token
      - CHELABASE_PROXY_API_TOKEN_FILE=${CHELABASE_KEYS_DIR}/tokens/proxy-api.token
      - CHELABASE_STORCON_HOOK_TOKEN_FILE=${CHELABASE_KEYS_DIR}/tokens/storcon-hook.token
      - CHELABASE_IDENTITY_URL=http://identity:8080
      - CHELABASE_IDENTITY_TOKEN_FILE=${CHELABASE_KEYS_DIR}/tokens/orchestrator-identity.token
      # #126: the setup code the dev member's claim (and a first sign-up) needs; the stack's own.
      - CHELABASE_SETUP_CODE_FILE=${CHELABASE_STACK_DIR}/setup/setup.code
      # Connection strings name the proxy's published port on the host.
      - CHELABASE_PROXY_PG_PORT=${CHELABASE_PROXY_PORT}
      # Bare names: taken from the caller's env, unset when it has none. The runner's live tests
      # recreate the orchestrator with these to exercise the settings (roles_live).
      - CHELABASE_PASSWORD_STRENGTH
      - CHELABASE_BRANCH_DATABASE_CAP
      # Who may log in as chelabase_realtime (the compute spec's hba): realtime and the runner.
      - CHELABASE_REALTIME_LOGIN_CIDRS=${CHELABASE_REALTIME_LOGIN_CIDRS:?set by chelabase workbench (stack.env)}
    group_add: ["${CHELABASE_DOCKER_GID:?set by chelabase workbench (stack.env)}"]
    # Its static address on `control`, for its TLS connections to computes.
    networks:
      control:
        ipv4_address: ${CHELABASE_ORCHESTRATOR_CONTROL_IP:?set by chelabase workbench (stack.env)}
    volumes: !override
      - *checkout-ro
      - *keys-mask
      - *checkout-mask
      - *keys-orchestrator-tls-ro
      - *docker-sock
    secrets:
      - {source: secrets-key, target: "${CHELABASE_KEYS_DIR}/secrets/secrets.key"}
      - {source: internal-verify, target: "${CHELABASE_KEYS_DIR}/gateway/internal-verify.pem"}
      - {source: compute-jwt-private, target: "${CHELABASE_KEYS_DIR}/neon/compute-jwt.pem"}
      - {source: compute-jwt-public, target: "${CHELABASE_KEYS_DIR}/neon/compute-jwt.pub"}
      - {source: nats-orchestrator, target: "${CHELABASE_KEYS_DIR}/nats/orchestrator.password"}
      - {source: valkey-control, target: "${CHELABASE_KEYS_DIR}/valkey/control.password"}
      - {source: realtime-internal, target: "${CHELABASE_KEYS_DIR}/realtime/internal.token"}
      - {source: token-rest-internal, target: "${CHELABASE_KEYS_DIR}/tokens/rest-internal.token"}
      - {source: token-data-keys, target: "${CHELABASE_KEYS_DIR}/tokens/data-keys.token"}
      - {source: token-app-auth, target: "${CHELABASE_KEYS_DIR}/tokens/app-auth.token"}
      - {source: token-app-sessions, target: "${CHELABASE_KEYS_DIR}/tokens/app-sessions.token"}
      - {source: token-storage-internal, target: "${CHELABASE_KEYS_DIR}/tokens/storage-internal.token"}
      - {source: token-proxy-api, target: "${CHELABASE_KEYS_DIR}/tokens/proxy-api.token"}
      - {source: stack-setup-code, target: "${CHELABASE_STACK_DIR}/setup/setup.code"}
      - {source: token-storcon-hook, target: "${CHELABASE_KEYS_DIR}/tokens/storcon-hook.token"}
      - {source: token-orchestrator-identity, target: "${CHELABASE_KEYS_DIR}/tokens/orchestrator-identity.token"}
      - {source: member-jwt-public, target: "${CHELABASE_KEYS_DIR}/auth/member-jwt.pub"}
    depends_on: !override
      metadata-db:
        condition: service_healthy
      nats:
        condition: service_healthy
      valkey:
        condition: service_healthy
      storage-controller:
        condition: service_healthy

  worker:
    <<: *workbench
    entrypoint: !reset []
    command: ["${CHELABASE_CHECKOUT}/target/debug/worker"]
    env_file:
      - *stack-env
    environment: !override
      # RT1 T1 (S1): its own credentials, from its own secrets below.
      - CHELABASE_NATS_USER=worker
      - CHELABASE_NATS_PASSWORD_FILE=${CHELABASE_KEYS_DIR}/nats/worker.password
      - CHELABASE_NATS_INBOX_PREFIX=_INBOX_worker
      - CHELABASE_VALKEY_USER=control
      - CHELABASE_VALKEY_PASSWORD_FILE=${CHELABASE_KEYS_DIR}/valkey/control.password
      - CHELABASE_REALTIME_PG_PASSWORD_FILE=${CHELABASE_KEYS_DIR}/realtime/pg.password
      # The worker renews realtime's client pair with the sweep, and refreshes computes' storage tokens.
      - CHELABASE_REALTIME_TLS_DIR=${CHELABASE_KEYS_DIR}/realtime-tls
      - CHELABASE_STORAGE_TOKEN_REFRESH_SECS=${CHELABASE_STORAGE_TOKEN_REFRESH_SECS:-3600}
      - CHELABASE_REALTIME_LOGIN_CIDRS=${CHELABASE_REALTIME_LOGIN_CIDRS:?set by chelabase workbench (stack.env)}
      # object-storage m8: the storage sweep reads and deletes user blobs as the `storage` identity.
      - CHELABASE_STORAGE_BACKEND=seaweedfs
      - CHELABASE_STORAGE_S3_ENDPOINT=http://seaweedfs:8333
      - CHELABASE_STORAGE_S3_BUCKET=chelabase-storage
      - CHELABASE_STORAGE_S3_ACCESS_KEY_FILE=/run/chelabase/secrets/storage-s3/access-key
      - CHELABASE_STORAGE_S3_SECRET_KEY_FILE=/run/chelabase/secrets/storage-s3/secret-key
      - CHELABASE_STORAGE_SWEEP_GRACE_SECS=${CHELABASE_STORAGE_SWEEP_GRACE_SECS:-}
      - CHELABASE_STORAGE_SWEEP_SECS=${CHELABASE_STORAGE_SWEEP_SECS:-}
      - CHELABASE_STORAGE_SWEEP_DRY_RUN=${CHELABASE_STORAGE_SWEEP_DRY_RUN:-}
      - CHELABASE_IDENTITY_URL=http://identity:8080
      - CHELABASE_IDENTITY_TOKEN_FILE=${CHELABASE_KEYS_DIR}/tokens/worker-identity.token
    group_add: ["${CHELABASE_DOCKER_GID}"]
    volumes: !override
      - *checkout-ro
      - *keys-mask
      - *checkout-mask
      - *keys-compute-ca-rw
      - *keys-orchestrator-tls-rw
      - *keys-realtime-tls-rw
      - *docker-sock
    secrets:
      - {source: secrets-key, target: "${CHELABASE_KEYS_DIR}/secrets/secrets.key"}
      - {source: compute-jwt-private, target: "${CHELABASE_KEYS_DIR}/neon/compute-jwt.pem"}
      - {source: compute-jwt-public, target: "${CHELABASE_KEYS_DIR}/neon/compute-jwt.pub"}
      - {source: nats-worker, target: "${CHELABASE_KEYS_DIR}/nats/worker.password"}
      - {source: valkey-control, target: "${CHELABASE_KEYS_DIR}/valkey/control.password"}
      - {source: realtime-pg, target: "${CHELABASE_KEYS_DIR}/realtime/pg.password"}
      - {source: s3-storage-access-key, target: /run/chelabase/secrets/storage-s3/access-key}
      - {source: s3-storage-secret-key, target: /run/chelabase/secrets/storage-s3/secret-key}
      - {source: token-worker-identity, target: "${CHELABASE_KEYS_DIR}/tokens/worker-identity.token"}
    depends_on: !override
      metadata-db:
        condition: service_healthy
      nats:
        condition: service_healthy
      valkey:
        condition: service_healthy
      storage-controller:
        condition: service_healthy
      pageserver:
        condition: service_healthy
      safekeeper1:
        condition: service_healthy
      safekeeper2:
        condition: service_healthy
      safekeeper3:
        condition: service_healthy
      register-safekeepers:
        condition: service_completed_successfully

  # The gateway's port is the stack's (published on loopback; it listens on it inside too), and
  # it answers every host of the stack on the network. It starts before its backends (502 until
  # they come up).
  gateway:
    <<: *workbench
    command: ["${CHELABASE_CHECKOUT}/target/debug/gateway"]
    env_file:
      - *stack-env
    environment: !override
      # RT1 T1 (S27): the bearers it sends to the orchestrator's internal listener.
      - CHELABASE_DATA_KEYS_TOKEN_FILE=${CHELABASE_KEYS_DIR}/tokens/data-keys.token
      - CHELABASE_APP_SESSIONS_INTERNAL_TOKEN_FILE=${CHELABASE_KEYS_DIR}/tokens/app-sessions.token
    ports: !override
      - "127.0.0.1:${CHELABASE_GATEWAY_PORT:?set by chelabase workbench (stack.env)}:${CHELABASE_GATEWAY_PORT}"
      - "[::1]:${CHELABASE_GATEWAY_PORT}:${CHELABASE_GATEWAY_PORT}"
    networks: !override
      default:
        aliases:
          - ${CHELABASE_STUDIO_HOST_NAME:?set by chelabase workbench (stack.env)}
          - ${CHELABASE_API_HOST_NAME:?set by chelabase workbench (stack.env)}
          - ${CHELABASE_AUTH_HOST_NAME}
          - ${CHELABASE_MAIL_HOST_NAME:?set by chelabase workbench (stack.env)}
          - ${CHELABASE_DOCS_HOST_NAME:?set by chelabase workbench (stack.env)}
          - ${CHELABASE_LANDING_HOST_NAME:?set by chelabase workbench (stack.env)}
    volumes: !override
      - *checkout-ro
      - *keys-mask
      - *checkout-mask
    secrets:
      - {source: internal-signing, target: "${CHELABASE_KEYS_DIR}/gateway/internal-signing.pem"}
      - {source: app-jwt-public, target: "${CHELABASE_KEYS_DIR}/auth/app-jwt.pub"}
      - {source: member-jwt-public, target: "${CHELABASE_KEYS_DIR}/auth/member-jwt.pub"}
      - {source: token-data-keys, target: "${CHELABASE_KEYS_DIR}/tokens/data-keys.token"}
      - {source: token-app-sessions, target: "${CHELABASE_KEYS_DIR}/tokens/app-sessions.token"}
    healthcheck:
      test: ["CMD", "curl", "-fsS", "http://127.0.0.1:${CHELABASE_GATEWAY_PORT}/_gateway/health"]
    depends_on: !override
      mailpit:
        condition: service_healthy

  auth:
    <<: *workbench
    command: ["${CHELABASE_CHECKOUT}/target/debug/auth"]
    env_file:
      - *stack-env
    environment: !override
      # RT1 T1 (S27): the bearer it sends to the orchestrator's internal app routes.
      - CHELABASE_APP_AUTH_INTERNAL_TOKEN_FILE=${CHELABASE_KEYS_DIR}/tokens/app-auth.token
      - CHELABASE_IDENTITY_URL=http://identity:8080
      - CHELABASE_IDENTITY_TOKEN_FILE=${CHELABASE_KEYS_DIR}/tokens/auth-identity.token
    volumes: !override
      - *checkout-ro
      - *keys-mask
      - *checkout-mask
    secrets:
      - {source: cookie, target: "${CHELABASE_KEYS_DIR}/auth/cookie.key"}
      - {source: app-jwt-private, target: "${CHELABASE_KEYS_DIR}/auth/app-jwt.key"}
      - {source: app-jwt-public, target: "${CHELABASE_KEYS_DIR}/auth/app-jwt.pub"}
      - {source: member-jwt-private, target: "${CHELABASE_KEYS_DIR}/auth/member-jwt.key"}
      - {source: member-jwt-public, target: "${CHELABASE_KEYS_DIR}/auth/member-jwt.pub"}
      - {source: internal-verify, target: "${CHELABASE_KEYS_DIR}/gateway/internal-verify.pem"}
      - {source: compute-ca-cert, target: "${CHELABASE_KEYS_DIR}/compute-ca/ca.crt"}
      - {source: token-app-auth, target: "${CHELABASE_KEYS_DIR}/tokens/app-auth.token"}
      - {source: token-auth-identity, target: "${CHELABASE_KEYS_DIR}/tokens/auth-identity.token"}
    healthcheck:
      test: ["CMD", "curl", "-fsS", "http://127.0.0.1:8084/health"]
    depends_on: !override
      identity:
        condition: service_healthy

  rest:
    <<: *workbench
    command: ["${CHELABASE_CHECKOUT}/target/debug/rest"]
    env_file:
      - *stack-env
    environment: !override
      # RT1 T1 (S27): its internal bearer (both ways with the orchestrator).
      - CHELABASE_REST_INTERNAL_TOKEN_FILE=${CHELABASE_KEYS_DIR}/tokens/rest-internal.token
    volumes: !override
      - *checkout-ro
      - *keys-mask
      - *checkout-mask
    secrets:
      - {source: internal-verify, target: "${CHELABASE_KEYS_DIR}/gateway/internal-verify.pem"}
      - {source: compute-ca-cert, target: "${CHELABASE_KEYS_DIR}/compute-ca/ca.crt"}
      - {source: token-rest-internal, target: "${CHELABASE_KEYS_DIR}/tokens/rest-internal.token"}
    depends_on: !override
      metadata-db:
        condition: service_healthy

  # Object storage (m5), 8089 behind the gateway. Only in this overlay until its first release
  # image is published (the base file pins every image it runs). It dials computes on the compute
  # network as `authenticator` (caller sessions) and as `chelabase_storage` (its own login), and
  # SeaweedFS's S3 API as the `storage` identity (bucket chelabase-storage only).
  storage:
    <<: *workbench
    command: ["${CHELABASE_CHECKOUT}/target/debug/storage"]
    env_file:
      - *stack-env
    environment:
      - CHELABASE_STORAGE_INTERNAL_TOKEN_FILE=${CHELABASE_KEYS_DIR}/tokens/storage-internal.token
      - CHELABASE_STORAGE_BACKEND=seaweedfs
      - CHELABASE_STORAGE_S3_ENDPOINT=http://seaweedfs:8333
      - CHELABASE_STORAGE_S3_BUCKET=chelabase-storage
      - CHELABASE_STORAGE_S3_ACCESS_KEY_FILE=/run/chelabase/secrets/storage-s3/access-key
      - CHELABASE_STORAGE_S3_SECRET_KEY_FILE=/run/chelabase/secrets/storage-s3/secret-key
    networks:
      default: {}
      compute: {}
    volumes:
      - *checkout-ro
      - *keys-mask
      - *checkout-mask
    secrets:
      - {source: internal-verify, target: "${CHELABASE_KEYS_DIR}/gateway/internal-verify.pem"}
      - {source: compute-ca-cert, target: "${CHELABASE_KEYS_DIR}/compute-ca/ca.crt"}
      - {source: token-storage-internal, target: "${CHELABASE_KEYS_DIR}/tokens/storage-internal.token"}
      - {source: s3-storage-access-key, target: /run/chelabase/secrets/storage-s3/access-key}
      - {source: s3-storage-secret-key, target: /run/chelabase/secrets/storage-s3/secret-key}
    healthcheck:
      <<: *app-health
      test: ["CMD", "curl", "-fsS", "-o", "/dev/null", "http://127.0.0.1:8089/health"]
    depends_on:
      metadata-db:
        condition: service_healthy
      seaweedfs:
        condition: service_started

  # Its static address on `control` is outside the computes' range and in the chelabase_realtime
  # login rule.
  realtime:
    <<: *workbench
    command: ["${CHELABASE_CHECKOUT}/target/debug/realtime"]
    env_file:
      - *stack-env
    environment: !override
      # S1: its own credentials and secrets, from its own secrets below.
      - CHELABASE_NATS_USER=realtime
      - CHELABASE_NATS_PASSWORD_FILE=${CHELABASE_KEYS_DIR}/nats/realtime.password
      - CHELABASE_NATS_INBOX_PREFIX=_INBOX_realtime
      - CHELABASE_VALKEY_USER=realtime
      - CHELABASE_VALKEY_PASSWORD_FILE=${CHELABASE_KEYS_DIR}/valkey/realtime.password
      - CHELABASE_VALKEY_TLS=off
      - CHELABASE_REALTIME_PG_PASSWORD_FILE=${CHELABASE_KEYS_DIR}/realtime/pg.password
      - CHELABASE_REALTIME_TICKET_KEY_FILE=${CHELABASE_KEYS_DIR}/realtime/ticket.key
      - CHELABASE_REALTIME_INTERNAL_TOKEN_FILE=${CHELABASE_KEYS_DIR}/realtime/internal.token
      - CHELABASE_REALTIME_TLS_DIR=${CHELABASE_KEYS_DIR}/realtime-tls
    networks:
      control:
        ipv4_address: ${CHELABASE_REALTIME_CONTROL_IP:?set by chelabase workbench (stack.env)}
    volumes: !override
      - *checkout-ro
      - *keys-mask
      - *checkout-mask
      - *keys-realtime-tls-ro
    secrets:
      - {source: internal-verify, target: "${CHELABASE_KEYS_DIR}/gateway/internal-verify.pem"}
      - {source: compute-ca-cert, target: "${CHELABASE_KEYS_DIR}/compute-ca/ca.crt"}
      - {source: nats-realtime, target: "${CHELABASE_KEYS_DIR}/nats/realtime.password"}
      - {source: valkey-realtime, target: "${CHELABASE_KEYS_DIR}/valkey/realtime.password"}
      - {source: realtime-pg, target: "${CHELABASE_KEYS_DIR}/realtime/pg.password"}
      - {source: realtime-ticket, target: "${CHELABASE_KEYS_DIR}/realtime/ticket.key"}
      - {source: realtime-internal, target: "${CHELABASE_KEYS_DIR}/realtime/internal.token"}
      - {source: member-jwt-public, target: "${CHELABASE_KEYS_DIR}/auth/member-jwt.pub"}
    depends_on: !override
      nats:
        condition: service_healthy
      valkey:
        condition: service_healthy

  # Vite dev servers from the checkout (read-write: Vite's cache lives under node_modules), bound
  # to 0.0.0.0 (CHELABASE_*_BIND) and reached through the gateway; HMR goes through it too.
  studio:
    <<: *workbench
    command: ["pnpm", "--filter", "@chelabase/studio", "dev"]
    env_file:
      - *stack-env
      - path: ${CHELABASE_STACK_DIR}/studio.env
        required: false
    volumes:
      - *checkout-rw
      - *keys-mask
      - *checkout-mask

  docs:
    <<: *workbench
    profiles: ["sites"]
    command: ["pnpm", "--filter", "@chelabase/docs", "dev"]
    env_file:
      - *stack-env
    volumes:
      - *checkout-rw
      - *keys-mask
      - *checkout-mask
    healthcheck:
      <<: *app-health
      test: ["CMD", "curl", "-fsS", "-o", "/dev/null", "-H", "Host: ${CHELABASE_DOCS_HOST_NAME}", "http://127.0.0.1:3001/"]

  landing:
    <<: *workbench
    profiles: ["sites"]
    command: ["pnpm", "--filter", "@chelabase/landing", "dev"]
    env_file:
      - *stack-env
    volumes:
      - *checkout-rw
      - *keys-mask
      - *checkout-mask
    healthcheck:
      <<: *app-health
      test: ["CMD", "curl", "-fsS", "-o", "/dev/null", "-H", "Host: ${CHELABASE_LANDING_HOST_NAME}", "http://127.0.0.1:3002/"]

  # The test runner (`chelabase workbench test` / `run`, through `compose run --rm`): live tests
  # and e2e scripts on the stack's network, by service name. The CLI points CHELABASE_NEXTEST_BIN
  # at the host's cargo-nextest.
  runner:
    <<: *workbench
    profiles: ["runner"]
    restart: "no"
    entrypoint: []
    env_file:
      - *stack-env
    environment:
      # Bare names: a live test's own input, taken from the caller's env (unset when it has none),
      # e.g. `CHELABASE_LIVE_ENDPOINT=ep-… just workbench test -p chelabase-neon …`.
      - CHELABASE_LIVE_ENDPOINT
      # RT1 T1 (S1, S27, ruling (c)): the test harness runs the worker, the orchestrator and
      # realtime in-process (S24) and probes every user's rights, so it sees every service
      # secret (it has the Docker socket anyway). Its own NATS and Valkey users: `runner`.
      - CHELABASE_NATS_USER=runner
      - CHELABASE_NATS_PASSWORD_FILE=${CHELABASE_KEYS_DIR}/nats/runner.password
      - CHELABASE_NATS_INBOX_PREFIX=_INBOX_runner
      - CHELABASE_VALKEY_USER=runner
      - CHELABASE_VALKEY_PASSWORD_FILE=${CHELABASE_KEYS_DIR}/valkey/runner.password
      - CHELABASE_REALTIME_PG_PASSWORD_FILE=${CHELABASE_KEYS_DIR}/realtime/pg.password
      - CHELABASE_REALTIME_TICKET_KEY_FILE=${CHELABASE_KEYS_DIR}/realtime/ticket.key
      - CHELABASE_REALTIME_INTERNAL_TOKEN_FILE=${CHELABASE_KEYS_DIR}/realtime/internal.token
      - CHELABASE_REST_INTERNAL_TOKEN_FILE=${CHELABASE_KEYS_DIR}/tokens/rest-internal.token
      - CHELABASE_DATA_KEYS_TOKEN_FILE=${CHELABASE_KEYS_DIR}/tokens/data-keys.token
      - CHELABASE_APP_AUTH_INTERNAL_TOKEN_FILE=${CHELABASE_KEYS_DIR}/tokens/app-auth.token
      - CHELABASE_APP_SESSIONS_INTERNAL_TOKEN_FILE=${CHELABASE_KEYS_DIR}/tokens/app-sessions.token
      - CHELABASE_PROXY_API_TOKEN_FILE=${CHELABASE_KEYS_DIR}/tokens/proxy-api.token
      - CHELABASE_STORCON_HOOK_TOKEN_FILE=${CHELABASE_KEYS_DIR}/tokens/storcon-hook.token
      - CHELABASE_STORAGE_INTERNAL_TOKEN_FILE=${CHELABASE_KEYS_DIR}/tokens/storage-internal.token
      - CHELABASE_REALTIME_TLS_DIR=${CHELABASE_KEYS_DIR}/realtime-tls
      - CHELABASE_REALTIME_LOGIN_CIDRS=${CHELABASE_REALTIME_LOGIN_CIDRS:?set by chelabase workbench (stack.env)}
      - CHELABASE_IDENTITY_URL=http://identity:8080
      # chelabase-identity's live tests call as auth, and as the worker for pool routes.
      - CHELABASE_IDENTITY_TOKEN_FILE=${CHELABASE_KEYS_DIR}/tokens/auth-identity.token
      - CHELABASE_IDENTITY_WORKER_TOKEN_FILE=${CHELABASE_KEYS_DIR}/tokens/worker-identity.token
      - CHELABASE_IDENTITY_ORCHESTRATOR_TOKEN_FILE=${CHELABASE_KEYS_DIR}/tokens/orchestrator-identity.token
    group_add: ["${CHELABASE_DOCKER_GID}"]
    # The static address is in the member-login rule's address list. On the compute network:
    # live tests dial computes like the services do.
    networks:
      default: {}
      control:
        ipv4_address: ${CHELABASE_RUNNER_CONTROL_IP:?set by chelabase workbench (stack.env)}
      compute: {}
    volumes:
      - *checkout-rw
      - *keys-mask
      - *checkout-mask
      - *keys-compute-ca-ro
      - *keys-orchestrator-tls-ro
      - *keys-realtime-tls-ro
      # The whole state dir, rw (x-state): the runner works in it, see there.
      - *state
      - *docker-sock
      - type: bind
        source: ${CHELABASE_NEXTEST_BIN:-/usr/local/bin/cargo-nextest}
        target: /usr/local/bin/cargo-nextest
        read_only: true
    secrets:
      - {source: secrets-key, target: "${CHELABASE_KEYS_DIR}/secrets/secrets.key"}
      - {source: compute-jwt-private, target: "${CHELABASE_KEYS_DIR}/neon/compute-jwt.pem"}
      - {source: compute-jwt-public, target: "${CHELABASE_KEYS_DIR}/neon/compute-jwt.pub"}
      - {source: app-jwt-private, target: "${CHELABASE_KEYS_DIR}/auth/app-jwt.key"}
      - {source: app-jwt-public, target: "${CHELABASE_KEYS_DIR}/auth/app-jwt.pub"}
      - {source: nats-orchestrator, target: "${CHELABASE_KEYS_DIR}/nats/orchestrator.password"}
      - {source: nats-worker, target: "${CHELABASE_KEYS_DIR}/nats/worker.password"}
      - {source: nats-realtime, target: "${CHELABASE_KEYS_DIR}/nats/realtime.password"}
      - {source: nats-runner, target: "${CHELABASE_KEYS_DIR}/nats/runner.password"}
      - {source: valkey-proxy, target: "${CHELABASE_KEYS_DIR}/valkey/proxy.password"}
      - {source: valkey-control, target: "${CHELABASE_KEYS_DIR}/valkey/control.password"}
      - {source: valkey-realtime, target: "${CHELABASE_KEYS_DIR}/valkey/realtime.password"}
      - {source: valkey-runner, target: "${CHELABASE_KEYS_DIR}/valkey/runner.password"}
      - {source: valkey-health, target: "${CHELABASE_KEYS_DIR}/valkey/health.password"}
      - {source: realtime-pg, target: "${CHELABASE_KEYS_DIR}/realtime/pg.password"}
      - {source: realtime-ticket, target: "${CHELABASE_KEYS_DIR}/realtime/ticket.key"}
      - {source: realtime-internal, target: "${CHELABASE_KEYS_DIR}/realtime/internal.token"}
      - {source: token-rest-internal, target: "${CHELABASE_KEYS_DIR}/tokens/rest-internal.token"}
      - {source: token-data-keys, target: "${CHELABASE_KEYS_DIR}/tokens/data-keys.token"}
      - {source: token-app-auth, target: "${CHELABASE_KEYS_DIR}/tokens/app-auth.token"}
      - {source: token-app-sessions, target: "${CHELABASE_KEYS_DIR}/tokens/app-sessions.token"}
      - {source: token-proxy-api, target: "${CHELABASE_KEYS_DIR}/tokens/proxy-api.token"}
      - {source: token-storcon-hook, target: "${CHELABASE_KEYS_DIR}/tokens/storcon-hook.token"}
      - {source: token-storage-internal, target: "${CHELABASE_KEYS_DIR}/tokens/storage-internal.token"}
      - {source: storage-pem, target: "${CHELABASE_KEYS_DIR}/neon/compute-jwt.pub.pem"}
      - {source: storage-pageserver-api, target: "${CHELABASE_KEYS_DIR}/neon/storage-tokens/pageserver-api.jwt"}
      - {source: storage-safekeeper-data, target: "${CHELABASE_KEYS_DIR}/neon/storage-tokens/safekeeper-data.jwt"}
      - {source: storage-generations-api, target: "${CHELABASE_KEYS_DIR}/neon/storage-tokens/generations-api.jwt"}
      - {source: storage-storcon-admin, target: "${CHELABASE_KEYS_DIR}/neon/storage-tokens/storcon-admin.jwt"}
      - {source: storage-metrics, target: "${CHELABASE_KEYS_DIR}/neon/storage-tokens/metrics.token"}
      - {source: member-jwt-private, target: "${CHELABASE_KEYS_DIR}/auth/member-jwt.key"}
      - {source: member-jwt-public, target: "${CHELABASE_KEYS_DIR}/auth/member-jwt.pub"}
      - {source: identity-secret, target: "${CHELABASE_KEYS_DIR}/identity/secret"}
      - {source: identity-db-password, target: "${CHELABASE_KEYS_DIR}/identity/db.password"}
      - {source: token-auth-identity, target: "${CHELABASE_KEYS_DIR}/tokens/auth-identity.token"}
      - {source: token-orchestrator-identity, target: "${CHELABASE_KEYS_DIR}/tokens/orchestrator-identity.token"}
      - {source: token-worker-identity, target: "${CHELABASE_KEYS_DIR}/tokens/worker-identity.token"}

# The stack's control subnet, from the registry's control slot; computes take addresses from the
# upper /23 only.
networks:
  control: !override
    ipam:
      config:
        - subnet: ${CHELABASE_CONTROL_SUBNET:?set by chelabase workbench (stack.env)}
          ip_range: ${CHELABASE_CONTROL_COMPUTE_RANGE:?set by chelabase workbench (stack.env)}

# The self-hosted install's secrets volume: unused here (the keys dir and the state dir hold
# them, as Compose secrets below).
volumes:
  secrets: !reset null

# Per-service key files (U10): each service lists the ones it reads under its own `secrets:`,
# with `target:` set to the path it expects, so a service sees exactly its files. Compose binds
# each host file read-only; a missing file fails `up`.
# RT1 T1 (R11, S1, S27): the generated service secrets (`chelabase workbench up` creates each once,
# 0600, never overwritten); a service gets its file's path as <NAME>_FILE in its own
# `environment:`, never through stack.env.
secrets:
  s3-neon-access-key: {file: "${CHELABASE_STACK_DIR}/s3/access-key"}
  s3-neon-secret-key: {file: "${CHELABASE_STACK_DIR}/s3/secret-key"}
  s3-storage-access-key: {file: "${CHELABASE_STACK_DIR}/storage-s3/access-key"}
  s3-storage-secret-key: {file: "${CHELABASE_STACK_DIR}/storage-s3/secret-key"}
  grpc-tls-ca: {file: "${CHELABASE_STACK_DIR}/grpc-tls/ca.crt"}
  grpc-tls-server-crt: {file: "${CHELABASE_STACK_DIR}/grpc-tls/server.crt"}
  grpc-tls-server-key: {file: "${CHELABASE_STACK_DIR}/grpc-tls/server.key"}
  grpc-tls-client-crt: {file: "${CHELABASE_STACK_DIR}/grpc-tls/client.crt"}
  grpc-tls-client-key: {file: "${CHELABASE_STACK_DIR}/grpc-tls/client.key"}
  secrets-key: {file: "${CHELABASE_KEYS_DIR}/secrets/secrets.key"}
  # The stack's setup code (`chelabase workbench up` writes it): the orchestrator's, read-only.
  stack-setup-code: {file: "${CHELABASE_STACK_DIR}/setup/setup.code"}
  internal-signing: {file: "${CHELABASE_KEYS_DIR}/gateway/internal-signing.pem"}
  internal-verify: {file: "${CHELABASE_KEYS_DIR}/gateway/internal-verify.pem"}
  cookie: {file: "${CHELABASE_KEYS_DIR}/auth/cookie.key"}
  app-jwt-private: {file: "${CHELABASE_KEYS_DIR}/auth/app-jwt.key"}
  app-jwt-public: {file: "${CHELABASE_KEYS_DIR}/auth/app-jwt.pub"}
  # auth-replacement m5: the member JWT pair, the identity service's own files and each caller's
  # identity bearer.
  member-jwt-private: {file: "${CHELABASE_KEYS_DIR}/auth/member-jwt.key"}
  member-jwt-public: {file: "${CHELABASE_KEYS_DIR}/auth/member-jwt.pub"}
  identity-secret: {file: "${CHELABASE_KEYS_DIR}/identity/secret"}
  identity-db-password: {file: "${CHELABASE_KEYS_DIR}/identity/db.password"}
  token-auth-identity: {file: "${CHELABASE_KEYS_DIR}/tokens/auth-identity.token"}
  token-orchestrator-identity: {file: "${CHELABASE_KEYS_DIR}/tokens/orchestrator-identity.token"}
  token-worker-identity: {file: "${CHELABASE_KEYS_DIR}/tokens/worker-identity.token"}
  # The bootstrap's (S1): identity reads it here; the bootstrap's own `docker run` mounts it.
  token-bootstrap-identity: {file: "${CHELABASE_KEYS_DIR}/tokens/bootstrap-identity.token"}
  compute-jwt-private: {file: "${CHELABASE_KEYS_DIR}/neon/compute-jwt.pem"}
  compute-jwt-public: {file: "${CHELABASE_KEYS_DIR}/neon/compute-jwt.pub"}
  nats-orchestrator: {file: "${CHELABASE_KEYS_DIR}/nats/orchestrator.password"}
  nats-worker: {file: "${CHELABASE_KEYS_DIR}/nats/worker.password"}
  nats-realtime: {file: "${CHELABASE_KEYS_DIR}/nats/realtime.password"}
  nats-runner: {file: "${CHELABASE_KEYS_DIR}/nats/runner.password"}
  valkey-proxy: {file: "${CHELABASE_KEYS_DIR}/valkey/proxy.password"}
  valkey-control: {file: "${CHELABASE_KEYS_DIR}/valkey/control.password"}
  valkey-realtime: {file: "${CHELABASE_KEYS_DIR}/valkey/realtime.password"}
  valkey-runner: {file: "${CHELABASE_KEYS_DIR}/valkey/runner.password"}
  valkey-health: {file: "${CHELABASE_KEYS_DIR}/valkey/health.password"}
  realtime-pg: {file: "${CHELABASE_KEYS_DIR}/realtime/pg.password"}
  realtime-ticket: {file: "${CHELABASE_KEYS_DIR}/realtime/ticket.key"}
  realtime-internal: {file: "${CHELABASE_KEYS_DIR}/realtime/internal.token"}
  token-rest-internal: {file: "${CHELABASE_KEYS_DIR}/tokens/rest-internal.token"}
  token-data-keys: {file: "${CHELABASE_KEYS_DIR}/tokens/data-keys.token"}
  token-app-auth: {file: "${CHELABASE_KEYS_DIR}/tokens/app-auth.token"}
  token-app-sessions: {file: "${CHELABASE_KEYS_DIR}/tokens/app-sessions.token"}
  token-storage-internal: {file: "${CHELABASE_KEYS_DIR}/tokens/storage-internal.token"}
  token-proxy-api: {file: "${CHELABASE_KEYS_DIR}/tokens/proxy-api.token"}
  token-storcon-hook: {file: "${CHELABASE_KEYS_DIR}/tokens/storcon-hook.token"}
  # Storage auth (user, 2026-10-16): the compute-JWT public key as SPKI PEM and the scoped
  # NeonJWTs the workbench signs with the pair (<keys>/neon/storage-tokens/). The runner sees
  # them at their own paths (scripts call the storage controller); the Neon containers read them
  # under /run.
  storage-pem: {file: "${CHELABASE_KEYS_DIR}/neon/compute-jwt.pub.pem"}
  storage-pageserver-api: {file: "${CHELABASE_KEYS_DIR}/neon/storage-tokens/pageserver-api.jwt"}
  storage-safekeeper-data: {file: "${CHELABASE_KEYS_DIR}/neon/storage-tokens/safekeeper-data.jwt"}
  storage-generations-api: {file: "${CHELABASE_KEYS_DIR}/neon/storage-tokens/generations-api.jwt"}
  storage-storcon-admin: {file: "${CHELABASE_KEYS_DIR}/neon/storage-tokens/storcon-admin.jwt"}
  # The runner's metrics token (scope metrics, minted by the workbench). A kept metrics.token
  # isn't checked against the current compute-JWT key: after a key rotation, re-mint it with
  # `chelabase neon mint-metrics-token`, then recreate the runner (a single-file mount keeps the
  # old file's inode, so a running runner never sees the new token). The command writes under
  # `CHELABASE_NEON_DIR` (default `.chelabase/neon` in the checkout): for a workbench stack, run
  # it with that stack's `CHELABASE_NEON_DIR`.
  storage-metrics: {file: "${CHELABASE_KEYS_DIR}/neon/storage-tokens/metrics.token"}
  # The platform CA's certificate alone (never ca.key): auth, rest and realtime verify every
  # compute's TLS against it (U15, CHELABASE_COMPUTE_CA_FILE).
  compute-ca-cert: {file: "${CHELABASE_KEYS_DIR}/compute-ca/ca.crt"}
