[package]
name = "chelabase-init"
version.workspace = true
edition.workspace = true
license.workspace = true
description = "Generates a Chelabase stack's keys, secrets and auth files (`chelabase-init`)"

[dependencies]
anyhow = { workspace = true }
base64 = { workspace = true }
# The NATS users file holds bcrypt hashes.
bcrypt = "0.19.3"
chelabase-auth = { workspace = true, features = ["keygen"] }
chelabase-neon = { workspace = true }
chelabase-secrets = { workspace = true }
getrandom = { workspace = true }
hex = { workspace = true }
libc = { workspace = true }
serde = { workspace = true }
serde_json = { workspace = true }
sha2 = { workspace = true }
tracing = { workspace = true }

[dev-dependencies]
tempfile = { workspace = true }
