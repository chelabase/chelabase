[package]
name = "chelabase-neon"
version.workspace = true
edition.workspace = true
license.workspace = true
description = "Neon storage-controller client, compute spec, SCRAM verifiers and compute JWTs for Chelabase"

[features]
# The in-memory ComputeBackend for other crates' tests.
fake = []
# Specs built from chelabase-metadata's stored rows (the worker and the orchestrator).
metadata = ["dep:chelabase-metadata"]

[dependencies]
chelabase-http = { workspace = true }
chelabase-metadata = { workspace = true, optional = true }
anyhow = { workspace = true }
arc-swap = { workspace = true }
base64 = { workspace = true }
bollard = { workspace = true }
chrono = { workspace = true }
ed25519-dalek = { workspace = true }
futures-util = { workspace = true }
getrandom = { workspace = true }
hex = { workspace = true }
hmac = { workspace = true }
humantime = { workspace = true }
libc = { workspace = true }
jsonwebtoken = { workspace = true }
pbkdf2 = { workspace = true }
rcgen = { workspace = true }
redis = { workspace = true }
reqwest = { workspace = true }
rustls = { workspace = true }
serde = { workspace = true }
serde_json = { workspace = true }
sha2 = { workspace = true }
stringprep = { workspace = true }
tar = { workspace = true }
thiserror = { workspace = true }
tokio = { workspace = true }
tokio-postgres = { workspace = true }
tokio-postgres-rustls-improved = { workspace = true }
tracing = { workspace = true }
urlencoding = { workspace = true }
uuid = { workspace = true }
x509-parser = { workspace = true }

[dev-dependencies]
axum = { workspace = true }
tempfile = { workspace = true }
# Paused-clock unit tests of the retry loops (no real I/O under a paused clock).
tokio = { workspace = true, features = ["test-util"] }
