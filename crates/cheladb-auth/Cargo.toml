[package]
name = "cheladb-auth"
version.workspace = true
edition.workspace = true
license.workspace = true
description = "Zitadel JWKS JWT verification for Cheladb"

[dependencies]
cheladb-types = { workspace = true }
uuid = { workspace = true }
serde = { workspace = true }
serde_json = { workspace = true }
thiserror = { workspace = true }
jsonwebtoken = { workspace = true }
reqwest = { workspace = true }
parking_lot = { workspace = true }
tracing = { workspace = true }
tokio = { workspace = true }
axum = { workspace = true, optional = true }
# 0.9 is the latest stable; `getrandom` gives it its own OsRng (it predates rand 0.10).
rsa = { version = "0.9.10", features = ["pem", "getrandom"], optional = true }
base64 = { workspace = true }
sha2 = { workspace = true }
hex = { workspace = true }
getrandom = { workspace = true, optional = true }
ed25519-dalek = { workspace = true, optional = true }

[dev-dependencies]
cheladb-auth = { path = ".", features = ["test-support"] }
base64 = { workspace = true }

[features]
keygen = ["dep:ed25519-dalek", "dep:getrandom"]
test-support = ["keygen", "dep:axum", "dep:rsa"]
