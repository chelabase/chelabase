[package]
name = "chelabase-query"
version.workspace = true
edition.workspace = true
license.workspace = true
description = "Chelabase's data API query engine: the JSON grammar, schema introspection and caches, SQL planning and running a request on a given connection"

[dependencies]
async-trait = { workspace = true }
# A plan's values, encoded before the pipeline is sent.
bytes = { workspace = true }
chelabase-types = { workspace = true }
deadpool-postgres = { workspace = true }
# `maybe_done`, for polling the pipeline's steps in order.
futures-util = { workspace = true }
http = { workspace = true }
moka = { workspace = true }
serde = { workspace = true }
sha2 = { workspace = true }
# Keeps a bare JSON number's digits (a 30-digit numeric binds exactly). It changes
# `serde_json::Number` for every crate built with this one (rest and the orchestrator).
# It breaks deserializing numbers through serde's buffered content: an untagged, internally
# tagged or flattened `Deserialize` type. The workspace's untagged and tagged enums
# (the orchestrator's `PointInTime` docs type, auth's `NextStep`) only serialize, which it
# doesn't affect; keep it that way.
serde_json = { workspace = true, features = ["arbitrary_precision"] }
thiserror = { workspace = true }
# Every compute-facing statement (the fork pinned in the workspace; `NoTls`).
tokio-postgres = { workspace = true, features = ["with-serde_json-1", "with-uuid-1"] }
tracing = { workspace = true }
# The request grammar's hand-written OpenAPI schemas (`openapi` feature, used by rest's document).
utoipa = { workspace = true, optional = true }
uuid = { workspace = true }

[features]
openapi = ["dep:utoipa", "chelabase-types/openapi"]

[dev-dependencies]
# The fidelity test validates requests against the committed openapi/data.json. Arbitrary
# precision matches this crate's serde_json (a 20-digit integer is still an integer).
jsonschema = { version = "0.58.5", default-features = false, features = ["arbitrary-precision"] }
# Live tests' own admin sessions.
sqlx = { workspace = true }
tokio = { workspace = true }
