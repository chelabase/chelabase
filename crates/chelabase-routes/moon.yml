language: "rust"

tasks:
  check:
    command: "cargo"
    args: ["check", "-p", "chelabase-routes"]
    inputs:
      - "src/**/*"
      - "Cargo.toml"
  build:
    command: "cargo"
    args: ["build", "-p", "chelabase-routes"]
    deps: ["check"]
  test:
    command: "cargo"
    args: ["test", "-p", "chelabase-routes"]
