[package]
name = "chelabase-schema"
version.workspace = true
edition.workspace = true
license.workspace = true
description = "Chelabase's schema merge engine: reads one Postgres database's catalog into a normalized model, three-way diff and conflicts, merged model, phased plan, export and drift compare (no HTTP, no metadata access)"

[dependencies]
# The roles path's reserved-name rules (which memberships a merge can make, E30).
chelabase-types = { workspace = true }
# The canonical JSON a fingerprint is taken over.
hex = { workspace = true }
# Keyword kinds for identifier quoting; later, classifying user steps and parsing expressions.
pg_query = { workspace = true }
serde = { workspace = true }
# Plain serde_json: no `arbitrary_precision` here. Some crates that will deserialize these
# types (the orchestrator) are built with it, which breaks numbers inside untagged, internally
# tagged or flattened types, so every enum in this crate stays externally tagged.
serde_json = { workspace = true }
sha2 = { workspace = true }
thiserror = { workspace = true }
# The table API's OpenAPI schemas for the model's `Table` (the `openapi` feature).
utoipa = { workspace = true, optional = true }
# A plan's merge id (the phase 1 recovery marker).
uuid = { workspace = true }

[features]
openapi = ["dep:utoipa", "chelabase-types/openapi"]

[dev-dependencies]
# Live catalog tests' scratch database names.
getrandom = { workspace = true }
tokio = { workspace = true }
# Live catalog tests' own admin sessions.
tokio-postgres = { workspace = true }
# The renderer's hostile-name property tests.
proptest = { workspace = true }
