[package]
name = "chelabase-auth"
version.workspace = true
edition.workspace = true
license.workspace = true
description = "Zitadel JWKS JWT verification for Chelabase"

[dependencies]
chelabase-http = { workspace = true }
chelabase-types = { workspace = true }
uuid = { workspace = true }
serde = { workspace = true }
serde_json = { workspace = true }
thiserror = { workspace = true }
jsonwebtoken = { workspace = true }
reqwest = { workspace = true }
parking_lot = { workspace = true }
tracing = { workspace = true }
tokio = { workspace = true }
axum = { workspace = true, optional = true }
# RSA test-key generation for the JWKS mock. Same backend as jsonwebtoken's `aws_lc_rs`
# feature; the pure-Rust `rsa` crate (RUSTSEC-2023-0071, no fix) is not used.
aws-lc-rs = { workspace = true, optional = true }
base64 = { workspace = true }
sha2 = { workspace = true }
hex = { workspace = true }
getrandom = { workspace = true, optional = true }
ed25519-dalek = { workspace = true, optional = true }

[dev-dependencies]
chelabase-auth = { path = ".", features = ["test-support"] }
base64 = { workspace = true }

[features]
keygen = ["dep:ed25519-dalek", "dep:getrandom"]
test-support = ["keygen", "dep:axum", "dep:aws-lc-rs"]
