[package]
name = "cheladb-neon"
version.workspace = true
edition.workspace = true
license.workspace = true
description = "Neon storage-controller client, compute spec, SCRAM verifiers and compute JWTs for Cheladb"

[features]
# The in-memory ComputeBackend for other crates' tests.
fake = []
# Specs built from cheladb-metadata's stored rows (the worker and the orchestrator).
metadata = ["dep:cheladb-metadata"]

[dependencies]
cheladb-metadata = { workspace = true, optional = true }
anyhow = { workspace = true }
base64 = { workspace = true }
bollard = { workspace = true }
ed25519-dalek = { workspace = true }
futures-util = { workspace = true }
getrandom = { workspace = true }
hex = { workspace = true }
hmac = { workspace = true }
jsonwebtoken = { workspace = true }
pbkdf2 = { workspace = true }
redis = { workspace = true }
reqwest = { workspace = true }
serde = { workspace = true }
serde_json = { workspace = true }
sha2 = { workspace = true }
stringprep = { workspace = true }
thiserror = { workspace = true }
tokio = { workspace = true }
uuid = { workspace = true }

[dev-dependencies]
axum = { workspace = true }
tempfile = { workspace = true }
