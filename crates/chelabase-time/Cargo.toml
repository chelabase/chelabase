[package]
name = "chelabase-time"
version.workspace = true
edition.workspace = true
license.workspace = true
description = "Timestamps, dates and duration parsing for Chelabase"

[dependencies]
chrono = { workspace = true }
jiff = { workspace = true }
serde = { workspace = true }
# Postgres codecs for `Timestamp` and `Date` once they are jiff-backed.
sqlx = { workspace = true, optional = true }
jiff-sqlx = { workspace = true, optional = true }
utoipa = { workspace = true, optional = true }

[features]
sqlx = ["dep:sqlx", "dep:jiff-sqlx"]
openapi = ["dep:utoipa"]

[dev-dependencies]
# The oracle for `parse_duration` while it is still in the tree.
humantime = { workspace = true }
proptest = { workspace = true }
serde_json = { workspace = true }
tokio = { workspace = true }
