[package]
name = "chelabase"
version.workspace = true
edition.workspace = true
license.workspace = true
description = "Chelabase local CLI (auth bootstrap, token mint, future control-plane commands)"

[[bin]]
name = "chelabase"
path = "src/main.rs"

[dependencies]
anyhow = { workspace = true }
base64 = { workspace = true }
chrono = { workspace = true }
chelabase-auth = { workspace = true, features = ["keygen"] }
chelabase-init = { workspace = true }
chelabase-neon = { workspace = true }
chelabase-secrets = { workspace = true }
chelabase-types = { workspace = true }
chelabase-zitadel = { workspace = true }
clap = { workspace = true }
hex = { workspace = true }
jsonwebtoken = { workspace = true }
reqwest = { workspace = true }
serde = { workspace = true }
serde_json = { workspace = true }
sha2 = { workspace = true }
tokio = { workspace = true }
tracing = { workspace = true }
tracing-subscriber = { workspace = true }

[dev-dependencies]
# The legacy generators the workbench tests compare with.
chelabase-init = { workspace = true, features = ["test-support"] }
# The NATS users file's hashes are checked against the passwords.
bcrypt = "0.19.3"
tempfile = { workspace = true }
axum = { workspace = true }
