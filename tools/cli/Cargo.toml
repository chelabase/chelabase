[package]
name = "chelabase"
version.workspace = true
edition.workspace = true
license.workspace = true
description = "Chelabase local CLI (auth bootstrap, token mint, future control-plane commands)"

[[bin]]
name = "chelabase"
path = "src/main.rs"

[dependencies]
anyhow = { workspace = true }
base64 = { workspace = true }
chrono = { workspace = true }
chelabase-auth = { workspace = true, features = ["keygen"] }
chelabase-neon = { workspace = true }
chelabase-secrets = { workspace = true }
chelabase-types = { workspace = true }
chelabase-zitadel = { workspace = true }
clap = { workspace = true }
hex = { workspace = true }
jsonwebtoken = { workspace = true }
reqwest = { workspace = true }
serde = { workspace = true }
serde_json = { workspace = true }
sha2 = { workspace = true }
tokio = { workspace = true }
tracing = { workspace = true }
tracing-subscriber = { workspace = true }

[dev-dependencies]
tempfile = { workspace = true }
axum = { workspace = true }
