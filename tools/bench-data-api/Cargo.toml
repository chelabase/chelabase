[package]
name = "bench-data-api"
version.workspace = true
edition.workspace = true
license.workspace = true
description = "Data API pipelining benchmark harness (step 6e)"
publish = false

[lib]
name = "bench_data_api"
path = "src/lib.rs"

[[bin]]
name = "bench-data-api"
path = "src/main.rs"

[dependencies]
anyhow = { workspace = true }
chelabase-auth = { workspace = true }
chelabase-query = { workspace = true }
chelabase-types = { workspace = true }
clap = { workspace = true }
deadpool-postgres = { workspace = true }
futures-util = { workspace = true }
rand = { workspace = true }
rest = { path = "../../services/rest" }
serde = { workspace = true }
serde_json = { workspace = true }
sqlx = { workspace = true }
tokio = { workspace = true }
tokio-postgres = { workspace = true, features = ["with-uuid-1", "with-serde_json-1"] }
uuid = { workspace = true }
